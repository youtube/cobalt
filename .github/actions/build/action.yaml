name: Build Cobalt
description: Builds Cobalt targets
inputs:
  targets:
    description: "JSON list of ninja targets for Cobalt build."
    required: true
  test_root_target:
    description: "Deprecated: Root target for tests (unused in gn analyze)."
    required: false
    default: ''
  test_targets_json_file:
    description: "The path to the file the test targets are written to."
    required: true
  enable_sccache:
    description: Use sccache for build acceleration.
    default: 'false'
  sccache_gcs_key:
    description: GCS SA key to read/write to bucket
outputs:
  skip:
    description: "Set to true when the platform build was skipped."
    value: ${{ steps.test-targets.outputs.skip }}
runs:
  using: "composite"
  steps:
      - name: Clean out dir from previous runner
        run: |
          rm -rf cobalt/src/out
        shell: bash
      - name: Install sccache
        if: inputs.enable_sccache == 'true'
        uses: ./.github/actions/sccache
        with:
          sccache_gcs_key: ${{ inputs.sccache_gcs_key }}
      - name: GN gen
        env:
          ENABLE_SCCACHE: ${{ inputs.enable_sccache }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        working-directory: cobalt/src
        run: |
          gn_flags=()
          if [[ "${PLATFORM}" == *"tvos"* ]]; then
            # TvOS does not use RBE unless it's sccache
            gn_flags+=(--no-rbe)
          fi
          if [[ "${ENABLE_SCCACHE}" == "true" ]]; then
            gn_flags+=(--use-sccache)
          fi
          cobalt/build/gn.py -p "${PLATFORM}" -C "${CONFIG}" "${gn_flags[@]}"
        shell: bash
      - name: Configure Siso Credential Helper
        shell: bash
        run: |
          echo "SISO_CREDENTIAL_HELPER=gcloud" >> "${GITHUB_ENV}"
      - name: List GN args
        env:
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        working-directory: cobalt/src
        run: |
          gn args --list --short --overrides-only out/"${PLATFORM}_${CONFIG}"
        shell: bash
      - name: Get list of changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        env:
          CHANGED_FILES_LIST: changed_files.txt
        working-directory: cobalt/src
        run: |
          set -ex
          git -c core.quotepath=off diff --name-only --no-renames \
            HEAD~1 HEAD > "${CHANGED_FILES_LIST}"
          cat "${CHANGED_FILES_LIST}"
        shell: bash
      - name: Filter platform and prune test targets
        id: test-targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
          TARGETS: ${{ inputs.targets }}
          TEST_TARGETS_JSON_FILE: ${{ inputs.test_targets_json_file }}
          STATIC_DIR: cobalt/build/testing/targets/${{ matrix.platform }}
        working-directory: cobalt/src
        shell: bash
        run: |
          set -ex
          STATIC_JSON="${STATIC_DIR}/test_targets.json"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            python3 cobalt/build/test_targets.py \
              --out-dir "out/${PLATFORM}_${CONFIG}" \
              --changed-files changed_files.txt \
              --targets "${TARGETS}" \
              --test-targets-json "${STATIC_JSON}" \
              --output "${TEST_TARGETS_JSON_FILE}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            # Non-PR (push, schedule, manual dispatch): run all tests
            if [[ -f "${STATIC_JSON}" ]]; then
              cp -av "${STATIC_JSON}" \
                "${TEST_TARGETS_JSON_FILE}"
              test_targets_json=$(jq -cr \
                '[.[] | select(.target != null) | .target]' \
                "${TEST_TARGETS_JSON_FILE}")
            else
              header='[{"disabled": false, "description": "Header"}]'
              echo "${header}" > "${TEST_TARGETS_JSON_FILE}"
              test_targets_json="[]"
            fi
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "test_targets_json=${test_targets_json}" >> "${GITHUB_OUTPUT}"
            targets_count=$(echo "${test_targets_json}" | jq -cr 'length')
            echo "test_targets_count=${targets_count}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Archive test target JSON
        if: matrix.config == 'devel'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.platform }}_test_targets_json
          path: cobalt/src/out/${{ matrix.platform }}_${{ matrix.config }}/test_targets.json
      - name: Ninja build test targets
        if: |
          steps.test-targets.outputs.skip != 'true' &&
          matrix.config == 'devel' &&
          fromJSON(steps.test-targets.outputs.test_targets_count || 0) > 0
        id: build-test-targets
        working-directory: cobalt/src
        env:
          TEST_TARGETS_JSON: ${{ steps.test-targets.outputs.test_targets_json }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -ex
          readarray -t test_targets < <(echo "${TEST_TARGETS_JSON:-[]}" | jq -r '.[]')
          time autoninja -C out/"${PLATFORM}_${CONFIG}" "${test_targets[@]}"
        shell: bash
      - name: Ninja build
        if: steps.test-targets.outputs.skip != 'true'
        working-directory: cobalt/src
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          USE_SCCACHE: ${{ inputs.enable_sccache }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -ex
          readarray -t targets < <(echo "${TARGETS_JSON:-[]}" | jq -r '.[]')
          time autoninja -C out/"${PLATFORM}_${CONFIG}" "${targets[@]}"
          if [[ "${USE_SCCACHE}" == "true" ]]; then
            sccache --show-stats
          fi
        shell: bash
      - name: Archive Android APKs
        if: |
          steps.test-targets.outputs.skip != 'true' &&
          (startsWith(matrix.platform, 'android') ||
           contains(matrix.platform, 'aosp')) &&
          matrix.config == 'qa'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.platform }} APKs
          path: |
            cobalt/src/out/${{ matrix.platform }}_qa/apks/*.apk
            cobalt/src/out/${{ matrix.platform }}_qa/*_apk/*.apk
            cobalt/src/out/${{ matrix.platform }}_qa/gen/build_info.json
