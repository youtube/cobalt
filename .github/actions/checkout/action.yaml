name: Cached Checkout
description: Generic git checkout with bare repository cache support.
inputs:
  repository:
    description: The url of the repo to checkout. Defaults to Cobalt.
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: Git ref to checkout.
    required: true
  path:
    description: Destination path.
    required: true
  fetch_depth:
    description: Number of commits to fetch.
    default: "1"
  use_cache:
    description: Whether to attempt using /runner-cache.
    default: "true"
  squash_merge:
    description: Whether to squash merge pull requests onto base ref.
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Clone Repo
      env:
        REPO_URL: ${{ inputs.repository }}
        DEST_PATH: ${{ inputs.path }}
        FETCH_DEPTH: ${{ inputs.fetch_depth }}
      shell: bash
      run: |
        set -ex

        if [ ! -d "${DEST_PATH}/.git" ]; then
          retry() {
            for delay in 0 5 15 30; do
              sleep "${delay}"
              rm -rf "${DEST_PATH}"
              "$@" && return
            done
            return 1
          }

          depth_arg=()
          if [ "${FETCH_DEPTH}" -ne 0 ]; then
            depth_arg+=(--depth "${FETCH_DEPTH}")
          fi

          retry git clone \
            --no-tags \
            --filter=blob:none \
            "${depth_arg[@]}" \
            "${REPO_URL}" \
            "${DEST_PATH}"
        else
          echo "Repository already exists at ${DEST_PATH}. Skipping clone."
        fi

        git config --global --add safe.directory "$(cd "${DEST_PATH}" && pwd)"

    - name: Checkout Ref
      env:
        REF: ${{ inputs.ref }}
        DEST_PATH: ${{ inputs.path }}
        FETCH_DEPTH: ${{ inputs.fetch_depth }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        SQUASH_MERGE: ${{ inputs.squash_merge }}
      shell: bash
      run: |
        set -ex
        cd "${DEST_PATH}"
        retry() {
          for delay in 0 5 15 30; do
            sleep "${delay}"
            "$@" && return
          done
          return 1
        }
        shallow=$(git rev-parse --is-shallow-repository)

        if [ "${SQUASH_MERGE}" = "true" ] && [ -n "${GITHUB_BASE_REF}" ]; then
          base_ref="origin/${GITHUB_BASE_REF}"
          base_spec="+refs/heads/${GITHUB_BASE_REF}:refs/remotes/${base_ref}"
          depth_arg=()
          [ "${shallow}" = "true" ] && depth_arg=(--depth=500)
          retry git fetch --no-tags "${depth_arg[@]}" origin "${base_spec}"
          retry git fetch --no-tags "${depth_arg[@]}" origin "${REF}"
          head_sha=$(git rev-parse FETCH_HEAD)
          git merge-base "${base_ref}" "${head_sha}" >/dev/null || \
            [ "${shallow}" != "true" ] || \
            retry git fetch --no-tags --unshallow origin "${base_spec}" "${REF}"
          commit_date=$(git log -1 --format="%cI" "${head_sha}")
          author_name=$(git log -1 --format="%an" "${head_sha}")
          author_email=$(git log -1 --format="%ae" "${head_sha}")
          author_name="${author_name:-${COMMIT_AUTHOR_NAME:-github-actions[bot]}}"
          author_email="${author_email:-${COMMIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}}"

          git checkout "${base_ref}"
          git -c "user.name=${author_name}" -c "user.email=${author_email}" \
            merge --squash "${head_sha}"
          git \
            -c "user.name=${author_name}" \
            -c "user.email=${author_email}" \
            commit --quiet --allow-empty \
            --date="${commit_date}" \
            --message "Squash merge ${REF} onto ${GITHUB_BASE_REF}"
        else
          depth_arg=()
          [ "${FETCH_DEPTH}" -eq 0 ] || depth_arg=(--depth "${FETCH_DEPTH}")
          [ "${FETCH_DEPTH}" -eq 0 ] && [ "${shallow}" = "true" ] && \
            depth_arg=(--unshallow)
          retry git fetch --no-tags "${depth_arg[@]}" origin "${REF}"
          git checkout FETCH_HEAD
        fi
