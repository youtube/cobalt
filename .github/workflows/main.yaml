      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.CI_ESSENTIALS }}
      - name: Extract Test Target Name
        id: extract-target-name
        env:
          test_target_with_path: ${{ matrix.test_target }}
        run: echo "test_target=${test_target_with_path#*:}" >> "${GITHUB_OUTPUT}"
        shell: bash
      - name: Download Test Results
        uses: ./.github/actions/download_test_results
        continue-on-error: true
        with:
          pattern: ${{ env.TEST_RESULTS_KEY }}*
          path: results/
      - name: Test Results
        uses: ./.github/actions/process_test_results
        with:
          target_name: ${{ matrix.test_target }}
          results_glob: results/**/${{ steps.extract-target-name.outputs.test_target }}*.xml
          log_glob: results/**/${{ steps.extract-target-name.outputs.test_target }}*log.txt
          datadog_api_key: ${{ secrets.datadog_api_key }}
          num_gtest_shards: 1
      - name: ${{ matrix.test_target }} Device Logs
        if: always() && needs.initialize.outputs.test_on_device == 'true'
        continue-on-error: true
        uses: ./.github/actions/print_logs
        with:
          log_glob: results/**/${{ steps.extract-target-name.outputs.test_target }}*logcat.txt
          symbolize: 'false'
      - name: ${{ matrix.test_target }} Test Logs
        if: always()
        uses: ./.github/actions/print_logs
        with:
          log_glob: results/**/${{ steps.extract-target-name.outputs.test_target }}*log.txt
          results_glob: results/**/${{ steps.extract-target-name.outputs.test_target }}*.xml
          symbolize: 'false'

  validate-result:
    # List required jobs here.
    needs:
      - initialize
      - build
      - on-device-test
      - on-host-test
      - web-tests
      - internal-test
      - test-results
      - browser-test-on-host
      - chromedriver-smoketest
      - linux-e2e-test
    if: always() && needs.initialize.result == 'success'
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_tests_passing
    strategy:
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.CI_ESSENTIALS }}
      - name: Download Test Results
        uses: ./.github/actions/download_test_results
        continue-on-error: true
        with:
          pattern: ${{ matrix.platform }}_${{ matrix.name }}_*results*
          path: results/
      - name: Validate Results
        if: always()
        env:
          PLATFORM_INPUT: ${{ inputs.platform }}
          PLATFORM_NAME: ${{ matrix.name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_TESTS_JSON: ${{ needs.initialize.outputs.expected_tests_json }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          xml_files=(results/**/*.xml)

          non_required_out=$(jq -r '.[] | select(.required == false) | .target | split(":")[-1]' <<< "${EXPECTED_TESTS_JSON}")
          non_required_targets=()
          if [[ -n "${non_required_out}" ]]; then
            mapfile -t non_required_targets <<< "${non_required_out}"
          fi

          required_xmls=()
          non_required_xmls=()
          for xml_file in "${xml_files[@]}"; do
            base_name=$(basename "${xml_file}")
            is_non_required=false
            for nr_target in "${non_required_targets[@]}"; do
              if [[ "${base_name}" == "${nr_target}_testoutput.xml" || "${base_name}" == "${nr_target}_result.xml" || "${base_name}" == "${nr_target}.xml" ]]; then
                is_non_required=true
                break
              fi
            done
            if [[ "${is_non_required}" == "true" ]]; then
              non_required_xmls+=("${xml_file}")
            else
              required_xmls+=("${xml_file}")
            fi
          done

          parse_junit_failures() {
            local rc=0 out
            if [[ $# -eq 0 ]]; then
              echo '{}'
              return 0
            fi
            out=$(python3 cobalt/tools/junit_mini_parser.py "$@") || rc=$?
            if [[ "${rc}" -gt 1 ]] || ! jq -e '.failing_tests' <<< "${out}" >/dev/null 2>&1; then
              echo "::error::junit_mini_parser.py failed (exit ${rc})." >&2
              return 1
            fi
            echo "${out}"
          }

          test_failures=$(parse_junit_failures "${required_xmls[@]}")
          non_required_test_failures=$(parse_junit_failures "${non_required_xmls[@]}")

          # Generate shepherd_report.json
          jq -n \
            --arg platform "${PLATFORM_INPUT}" \
            --arg platform_name "${PLATFORM_NAME}" \
            --arg workflow "${WORKFLOW_NAME}" \
            --arg run_id "${RUN_ID}" \
            --arg run_attempt "${RUN_ATTEMPT}" \
            --arg run_url "${RUN_URL}" \
            --argjson needs "${NEEDS_JSON}" \
            --argjson failing_tests "${test_failures}" \
            --argjson non_required_failing_tests "${non_required_test_failures}" \
            --arg completed_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              platform: $platform,
              platform_name: $platform_name,
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_url: $run_url,
              completed_at: $completed_at,
              checks: ($needs | map_values(.result)),
              test_failures: $failing_tests,
              non_required_test_failures: $non_required_failing_tests
            }' > shepherd_report.json

          failing_jobs=$(jq -r '[.checks // {} | to_entries[] | select(.value == "failure" or .value == "cancelled") | .key] | join(", ")' shepherd_report.json)
          failed_tests_count=$(jq '[.failing_tests // {} | .[] | length] | add // 0' <<< "${test_failures}")
          if [[ "${failed_tests_count}" -gt 0 || -n "${failing_jobs}" ]]; then
            echo "::error title=Platform Validation Failed::Failing jobs: ${failing_jobs:-none}, Failed tests: ${failed_tests_count}"
            exit 1
          fi
          echo "Platform validation passed."
        shell: bash
      - name: Upload Shepherd Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: shepherd-report-${{ inputs.platform }}
          path: shepherd_report.json
          retention-days: 30
          overwrite: true
