name: Autoroll Main

on:
  schedule:
    - cron: '0 * * * *' # Hourly.
  workflow_dispatch:
    inputs:
      max_commits:
        description: 'Max number of commits to include on a single PR'
        type: number

permissions:
  contents: read

jobs:
  autoroll:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: "cobalt-github-releaser-bot"
      GIT_AUTHOR_EMAIL: "cobalt-github-releaser-bot@google.com"
      GIT_COMMITTER_NAME: "cobalt-github-releaser-bot"
      GIT_COMMITTER_EMAIL: "cobalt-github-releaser-bot@google.com"
      # Target branch -> bug attached to every autoroll PR for that branch.
      # The lint workflow's Bug ID Check requires a "Bug: <id>" line in the
      # PR title or description.
      TARGET_BUGS: |
        {
          "27.lts": "538269087"
        }
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    strategy:
      fail-fast: false
      matrix:
        branch: [
          {source: main, target: 27.lts, autoroll: .github/AUTOROLL, max_commits: 10, mode: full},
          {source: main, target: staging, autoroll: .github/AUTOROLL, max_commits: 50, mode: full},
        ]
    steps:
      # Two checkouts: the autoroller's scripts and config come from the ref
      # this workflow runs on (main on the schedule, or the branch selected
      # for a workflow_dispatch), while the roll itself operates on a
      # checkout of the target branch.
      - name: Checkout autoroller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: autoroller
          fetch-depth: 1
          sparse-checkout: .github

      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: src
          ref: ${{ matrix.branch.target }}
          fetch-depth: 1000
          token: ${{ secrets.CHERRY_PICK_TOKEN }}

      - name: Prepare Cherry Pick Branch
        id: prepare
        env:
          SOURCE_BRANCH: ${{ matrix.branch.source }}
          TARGET_BRANCH: ${{ matrix.branch.target }}
          FETCH_DEPTH: 1000
        run: |
          set -x

          git config --global submodule.recurse false

          # Use existing branch from remote if it exists, otherwise start from target branch.
          # Record the remote tip so pushes can use an explicit lease (empty
          # means the branch must not exist on the remote).
          BRANCH="autoroll-${SOURCE_BRANCH}-to-${TARGET_BRANCH}"
          if git fetch --depth="${FETCH_DEPTH}" --no-recurse-submodules origin "${BRANCH}"; then
            git checkout --no-recurse-submodules -B "${BRANCH}" FETCH_HEAD
            git update-ref "refs/remotes/origin/${BRANCH}" FETCH_HEAD
            echo "remote_sha=$(git rev-parse FETCH_HEAD)" >> "${GITHUB_OUTPUT}"
          else
            git checkout --no-recurse-submodules -B "${BRANCH}" "${TARGET_BRANCH}" --no-track
            echo "remote_sha=" >> "${GITHUB_OUTPUT}"
          fi

          # Fetch enough history for source branch.
          git fetch --depth="${FETCH_DEPTH}" --no-recurse-submodules origin "${SOURCE_BRANCH}:${SOURCE_BRANCH}"

          # Label mode keeps one conflict branch per conflicting PR. Mirror
          # them as local branches so the script can reconcile them.
          git fetch --depth="${FETCH_DEPTH}" --no-recurse-submodules origin \
            "+refs/heads/autoroll-conflict-${SOURCE_BRANCH}-to-${TARGET_BRANCH}-*:refs/heads/autoroll-conflict-${SOURCE_BRANCH}-to-${TARGET_BRANCH}-*"

      - name: Fetch Candidate PRs with Labels
        if: matrix.branch.mode == 'label'
        env:
          GITHUB_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          GH_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          SOURCE_BRANCH: ${{ matrix.branch.source }}
          TARGET_BRANCH: ${{ matrix.branch.target }}
        run: |
          gh pr list --state merged --base "${SOURCE_BRANCH}" --label "cp-${TARGET_BRANCH}" --limit 1000 --json number,labels > "${RUNNER_TEMP}/candidate_prs.json"

      - name: Cherry Pick Merged PRs
        id: autoroll
        env:
          MAX_COMMITS: ${{ inputs.max_commits || matrix.branch.max_commits }}
          SOURCE_BRANCH: ${{ matrix.branch.source }}
          TARGET_BRANCH: ${{ matrix.branch.target }}
          AUTOROLL_FILE: ${{ matrix.branch.autoroll }}
          ROLL_MODE: ${{ matrix.branch.mode || 'full' }}
          AUTOROLLER_DIR: ${{ github.workspace }}/autoroller/.github
          GITHUB_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          GH_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
        run: |
          set -x

          MANIFEST="${RUNNER_TEMP}/autoroll_manifest.json"
          MAX_CONFLICT_PRS=$(jq -r '.max_conflict_prs' "${AUTOROLLER_DIR}/config/infra/autoroll.json")
          ARGS=(
            --source-branch "${SOURCE_BRANCH}"
            --target-branch "${TARGET_BRANCH}"
            --autoroll-file "${AUTOROLL_FILE}"
            --max-commits "${MAX_COMMITS}"
            --mode "${ROLL_MODE}"
            --max-conflict-prs "${MAX_CONFLICT_PRS}"
            --manifest "${MANIFEST}"
          )

          if [[ "${ROLL_MODE}" == "label" ]]; then
            ARGS+=(--prs-json "${RUNNER_TEMP}/candidate_prs.json")
          fi

          # Run the Python script to perform cherry-picks and get all PR links.
          PR_LINKS=$(python3 "${AUTOROLLER_DIR}/scripts/autoroll.py" "${ARGS[@]}")

          echo "manifest=${MANIFEST}" >> "${GITHUB_OUTPUT}"
          cat "${MANIFEST}"

          if [[ -n "${PR_LINKS}" ]]; then
            echo "cherry_picked=true" >> "${GITHUB_OUTPUT}"
            {
              echo "pr_links<<EOF"
              echo "${PR_LINKS}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No commits to roll found."
          fi

      - name: Push and Create PR
        if: steps.autoroll.outputs.pr_links != ''
        env:
          SOURCE_BRANCH: ${{ matrix.branch.source }}
          TARGET_BRANCH: ${{ matrix.branch.target }}
          GITHUB_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          PR_LINKS: ${{ steps.autoroll.outputs.pr_links }}
          MANIFEST: ${{ steps.autoroll.outputs.manifest }}
          REMOTE_SHA: ${{ steps.prepare.outputs.remote_sha }}
          AUTOROLL_FILE: ${{ matrix.branch.autoroll }}
        run: |
          set -x

          BRANCH="autoroll-${SOURCE_BRANCH}-to-${TARGET_BRANCH}"
          git push --force-with-lease="${BRANCH}:${REMOTE_SHA}" origin "${BRANCH}"

          BUG=$(jq -r --arg branch "${TARGET_BRANCH}" '.[$branch] // empty' <<< "${TARGET_BUGS}")

          PR_TITLE="Autoroll from ${SOURCE_BRANCH} to ${TARGET_BRANCH}"
          PR_BODY_FILE=$(mktemp)
          trap 'rm -f "${PR_BODY_FILE}"' EXIT

          {
            echo "Automated cherry-pick roll to ${TARGET_BRANCH}."
            echo ""
            echo "Original pull requests:"
            echo "${PR_LINKS}"
            echo ""
            echo "To merge these changes, run the autoroll script:"
            echo ""
            echo '```bash'
            echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY} python3 cobalt/devinfra/github/autoroll/merge_autoroll.py \\"
            echo "  --source-branch ${SOURCE_BRANCH} \\"
            echo "  --target-branch ${TARGET_BRANCH}"
            echo '```'

            # Conflicting cherry-picks live on their own autoroll-conflict-* branches/PRs; list them for visibility.
            CONFLICTING=$(jq -r '.conflicts[]? | if .pr then "- #\(.pr)" else "- \(.id)" end' "${MANIFEST}")
            PENDING=$(jq -r '.pending[]? | if .pr then "- #\(.pr): \(.reason)" else "- \(.id): \(.reason)" end' "${MANIFEST}")
            if [[ -n "${CONFLICTING}" ]]; then
              echo ""
              echo "Conflicting pull requests (rolled in separate autoroll-conflict PRs):"
              echo "${CONFLICTING}"
            fi
            if [[ -n "${PENDING}" ]]; then
              echo ""
              echo "Pending conflicting pull requests:"
              echo "${PENDING}"
            fi
          } > "${PR_BODY_FILE}"

          if [[ -n "${BUG}" ]]; then
            {
              echo ""
              echo "Bug: ${BUG}"
            } >> "${PR_BODY_FILE}"
          fi

          PR_STATE=$(gh pr view "autoroll-${SOURCE_BRANCH}-to-${TARGET_BRANCH}" --json state --template '{{.state}}' 2>/dev/null || echo "NOT_FOUND")

          if [[ "${PR_STATE}" == "OPEN" ]]; then
            PR_NUMBER=$(gh pr view "autoroll-${SOURCE_BRANCH}-to-${TARGET_BRANCH}" --json number --jq .number)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f title="${PR_TITLE}" -f body="$(cat "${PR_BODY_FILE}")" --jq .html_url
          else
            gh pr create --base "${TARGET_BRANCH}" --head "autoroll-${SOURCE_BRANCH}-to-${TARGET_BRANCH}" --title "${PR_TITLE}" --body-file "${PR_BODY_FILE}" --reviewer linxinan-yt,oxve,briantting
          fi

      - name: Reconcile Conflict Branches
        if: steps.autoroll.outputs.manifest != ''
        env:
          SOURCE_BRANCH: ${{ matrix.branch.source }}
          TARGET_BRANCH: ${{ matrix.branch.target }}
          ROLL_MODE: ${{ matrix.branch.mode }}
          GITHUB_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          GH_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
          MANIFEST: ${{ steps.autoroll.outputs.manifest }}
        run: |
          set -x

          BUG=$(jq -r --arg branch "${TARGET_BRANCH}" '.[$branch] // empty' <<< "${TARGET_BUGS}")
          COMMENT_MARKER="This cherry-pick conflicts with"

          PR_BODY_FILE=$(mktemp)
          PR_COMMENT_FILE=$(mktemp)
          trap 'rm -f "${PR_BODY_FILE}" "${PR_COMMENT_FILE}"' EXIT

          while IFS=$'\t' read -r BRANCH OLD_SHA CHANGED PR_TITLE; do
            if [[ "${CHANGED}" == "true" ]]; then
              # An empty expected value requires the remote branch to not exist.
              git push --force-with-lease="${BRANCH}:${OLD_SHA}" origin "${BRANCH}:refs/heads/${BRANCH}"
            fi

            # The PR title/body mirror the CONFLICTED commit so a squash merge
            # reproduces its message, including the "Refer to original PR" and
            # "(cherry picked from commit ...)" lines the autoroller uses to
            # detect already-rolled commits in the target branch history.
            jq -r --arg branch "${BRANCH}" '.conflicts[] | select(.branch == $branch) | .body' "${MANIFEST}" > "${PR_BODY_FILE}"
            if [[ -n "${BUG}" ]]; then
              {
                echo ""
                echo "Bug: ${BUG}"
              } >> "${PR_BODY_FILE}"
            fi

            PR_JSON=$(gh pr list --head "${BRANCH}" --state open --json number,title,body,comments --jq '.[0] // {}')
            PR_NUMBER=$(jq -r '.number // empty' <<< "${PR_JSON}")
            if [[ -z "${PR_NUMBER}" ]]; then
              PR_URL=$(gh pr create --base "${TARGET_BRANCH}" --head "${BRANCH}" --title "${PR_TITLE}" --body-file "${PR_BODY_FILE}" --reviewer linxinan-yt,oxve,briantting)
              PR_NUMBER="${PR_URL##*/}"
            elif [[ "$(jq -r '.title' <<< "${PR_JSON}")" != "${PR_TITLE}" || "$(jq -r '.body' <<< "${PR_JSON}")" != "$(cat "${PR_BODY_FILE}")" ]]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f title="${PR_TITLE}" -f body="$(cat "${PR_BODY_FILE}")" --jq .html_url
            fi

            # Keep resolution instructions out of the PR body (and thus out of
            # the squash commit message) by posting them as a comment, once.
            if ! jq -e --arg marker "${COMMENT_MARKER}" '.comments // [] | any(.body | contains($marker))' <<< "${PR_JSON}" > /dev/null; then
              {
                echo "⚠️ ${COMMENT_MARKER} \`${TARGET_BRANCH}\` and must be resolved manually. The autoroller rebuilds this branch from \`${TARGET_BRANCH}\` every run until a resolution commit is pushed. Use the following commands to checkout the branch locally and resolve the conflicts in a separate commit:"
                echo ""
                echo '```bash'
                echo "gh pr checkout ${PR_NUMBER} -R ${GITHUB_REPOSITORY}"
                echo ""
                echo "# Resolve conflicts then"
                echo "git add <resolved_files>"
                echo ""
                echo "# Copy CONFLICTED commit's message and metadata"
                echo "# Replace CONFLICTED in title with RESOLVED"
                echo "git commit -c <conflicted_sha>"
                echo ""
                echo "git push origin ${BRANCH}"
                echo '```'
                echo ""
                echo "When squash merging, keep the PR title and description as the commit message so the roll is recorded in the target branch history."
                if [[ "${ROLL_MODE}" == "label" ]]; then
                  echo ""
                  echo "To drop this cherry-pick instead, remove the \`cp-${TARGET_BRANCH}\` label from the original PR; this PR is then closed automatically."
                fi
              } > "${PR_COMMENT_FILE}"
              gh pr comment "${PR_NUMBER}" --body-file "${PR_COMMENT_FILE}"
            fi
          done < <(jq -r '.conflicts[]? | [.branch, .old_sha, .changed, .title] | @tsv' "${MANIFEST}")

          # Branches that are no longer needed: conflict branches whose PR is no
          # longer a conflicting candidate (label removed, landed, or applies
          # cleanly now) and a clean branch left empty by a rebuild. Deleting a
          # branch closes its PR. The lease refuses to delete anything a human
          # pushed to in the meantime.
          while IFS=$'\t' read -r BRANCH OLD_SHA; do
            git push --force-with-lease="${BRANCH}:${OLD_SHA}" origin --delete "${BRANCH}"
          done < <(jq -r '.delete[]? | [.branch, .old_sha] | @tsv' "${MANIFEST}")

          while IFS= read -r BRANCH; do
            echo "::notice::${BRANCH} has commits not made by the autoroller and was left untouched."
          done < <(jq -r '.hands_off[]?.branch' "${MANIFEST}")

      - name: Check Full Mode Status
        if: matrix.branch.mode == 'full' && steps.autoroll.outputs.manifest != ''
        run: |
          if jq -e '(.conflicts | length > 0) or (.hands_off | length > 0)' "${{ steps.autoroll.outputs.manifest }}" > /dev/null; then
            echo "::error::Full mode autoroll is blocked by a conflict. Please resolve the open conflict PR."
            exit 1
          fi
