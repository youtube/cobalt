# Disable dangerous-triggers rule because this workflow uses pull_request_target
# strictly to edit PR labels (pull-requests: write) without checking out or executing
# untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: Auto Label Kokoro

run-name: Auto Label Kokoro (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }})

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - staging
      - autoroll-chromium/main-to-staging
      - 'stack/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-tvos-impact:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, chrobalt-linux-runner]
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 20
    container:
      image: ghcr.io/youtube/cobalt/linux:main
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /runner-cache:/runner-cache
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    outputs:
      affects_tvos: ${{ steps.analyze.outputs.affects_tvos }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            cobalt/build

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Prepare OverlayFS Workspace
        uses: ./.github/actions/overlay_workspace
        with:
          path: cobalt
          use_gcloud: true

      - name: Checkout
        uses: ./.github/actions/checkout
        with:
          path: cobalt/src
          ref: ${{ github.event.pull_request.head.sha }}
          fetch_depth: 1
          use_cache: true

      - name: Check tvOS Build Impact
        id: analyze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_TARGETS: ${{ steps.parse-targets.outputs.test_targets_json }}
        run: |
          export PATH="/runner-cache/golden-workspace/depot_tools:${GITHUB_WORKSPACE}/cobalt/depot_tools:${PATH}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/check_tvos_impact.py" \
            --src-dir "${GITHUB_WORKSPACE}/cobalt/src" \
            --base-sha "${BASE_SHA}" \
            --test-targets-json "${TEST_TARGETS}" \
            --compile-targets "//cobalt:cobalt" \
            --github-output "${GITHUB_OUTPUT}"

  label-kokoro-run:
    needs: analyze-tvos-impact
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.pull_request.draft == false && needs.analyze-tvos-impact.outputs.affects_tvos == 'true'
    steps:
      - name: Apply kokoro:run label to PR for collaborators/committers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          echo "Author '${PR_AUTHOR}' association: ${AUTHOR_ASSOC}"

          PERMISSION=$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Author '${PR_AUTHOR}' permission: ${PERMISSION}"

          if [[ "${AUTHOR_ASSOC}" == "OWNER" || "${AUTHOR_ASSOC}" == "MEMBER" || "${AUTHOR_ASSOC}" == "COLLABORATOR" || "${PERMISSION}" == "admin" || "${PERMISSION}" == "write" ]]; then
            if ! echo "$PR_LABELS" | jq -e '.[] | select(.name == "kokoro:run")' > /dev/null; then
              echo "Author is a collaborator/committer. Applying kokoro:run label..."
              gh pr edit "$PR_URL" --add-label "kokoro:run"
            else
              echo "kokoro:run label is already present."
            fi
          else
            echo "Author '${PR_AUTHOR}' (assoc: '${AUTHOR_ASSOC}', perm: '${PERMISSION}') is not a committer. Skipping auto-labeling."
          fi
