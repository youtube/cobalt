# Disable dangerous-triggers rule because this workflow uses pull_request_target
# to edit PR labels (pull-requests: write).
#
# The tvOS impact analysis checks out the PR's merge commit and runs `gn gen` on
# it, which executes scripts from the PR (GN exec_script). This is the same trust
# model as main.yaml, which builds PR merge commits on the same self-hosted
# runners, and is limited to PRs authored by committers (see check-author). The
# analysis job only has read permissions; labeling happens in a separate job
# that doesn't run PR code.
# actionlint: disable dangerous-triggers
name: Auto Label Kokoro

# tvos.yaml finds the run for its commit and event action by this name.
run-name: Auto Label Kokoro (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }} (${{ github.event.action }}))

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - staging
      - autoroll-chromium/main-to-staging
      - 'stack/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-author:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_committer: ${{ steps.check.outputs.is_committer }}
    steps:
      - name: Check whether the PR author is a collaborator/committer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          echo "Author '${PR_AUTHOR}' association: ${AUTHOR_ASSOC}"

          PERMISSION=$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Author '${PR_AUTHOR}' permission: ${PERMISSION}"

          if [[ "${AUTHOR_ASSOC}" == "OWNER" || "${AUTHOR_ASSOC}" == "MEMBER" || "${AUTHOR_ASSOC}" == "COLLABORATOR" || "${PERMISSION}" == "admin" || "${PERMISSION}" == "write" ]]; then
            echo "is_committer=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Author '${PR_AUTHOR}' is not a committer. Skipping tvOS impact analysis and auto-labeling."
            echo "is_committer=false" >> "${GITHUB_OUTPUT}"
          fi

  analyze-tvos-impact:
    needs: check-author
    if: github.event.pull_request.draft == false && needs.check-author.outputs.is_committer == 'true'
    runs-on: [self-hosted, chrobalt-linux-runner]
    permissions:
      contents: read
    timeout-minutes: 20
    container:
      image: ghcr.io/youtube/cobalt/linux:main
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /runner-cache:/runner-cache
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    outputs:
      affects_tvos: ${{ steps.analyze.outputs.affects_tvos }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            cobalt/build

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Prepare OverlayFS Workspace
        uses: ./.github/actions/overlay_workspace
        with:
          path: cobalt
          use_gcloud: true

      # Checks out the base branch tip, which is in the cache. The analysis
      # script then fetches and checks out the PR's merge commit on top of it.
      - name: Checkout
        uses: ./.github/actions/checkout
        with:
          path: cobalt/src
          ref: ${{ github.sha }}
          fetch_depth: 1
          use_cache: true

      - name: Check tvOS Build Impact
        id: analyze
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_TARGETS: ${{ steps.parse-targets.outputs.test_targets_json }}
        run: |
          export PATH="/runner-cache/golden-workspace/depot_tools:${GITHUB_WORKSPACE}/cobalt/depot_tools:${PATH}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/check_tvos_impact.py" \
            --src-dir "${GITHUB_WORKSPACE}/cobalt/src" \
            --pr-number "${PR_NUMBER}" \
            --pr-head-sha "${PR_HEAD_SHA}" \
            --test-targets-json "${TEST_TARGETS}" \
            --compile-targets "//cobalt:cobalt" \
            --github-output "${GITHUB_OUTPUT}"

  label-kokoro-run:
    needs: [check-author, analyze-tvos-impact]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Fails safe: also labels when the analysis job didn't succeed (e.g., the
    # runner or checkout failed, or it timed out).
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.check-author.outputs.is_committer == 'true' &&
      (needs.analyze-tvos-impact.result != 'success' ||
       needs.analyze-tvos-impact.outputs.affects_tvos == 'true')
    steps:
      - name: Apply kokoro:run label to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          ANALYZE_RESULT: ${{ needs.analyze-tvos-impact.result }}
        run: |
          if [[ "${ANALYZE_RESULT}" != "success" ]]; then
            echo "tvOS impact analysis result: ${ANALYZE_RESULT}. Defaulting to running the tvOS build."
          fi
          if ! echo "$PR_LABELS" | jq -e '.[] | select(.name == "kokoro:run")' > /dev/null; then
            echo "Applying kokoro:run label..."
            gh pr edit "$PR_URL" --add-label "kokoro:run"
          else
            echo "kokoro:run label is already present."
          fi
