name: Cobalt Chromedriver Smoke Test
description: Downloads Cobalt and Chromedriver artifacts from GCS and runs the Chromedriver smoke test.
inputs:
  platform:
    description: "The Cobalt platform being tested (e.g. linux-x64x11)."
    required: false
    default: "linux-x64x11"
  config:
    description: "The build config (e.g. qa, devel)."
    required: false
    default: "qa"
  test_artifacts_key:
    description: "GCS artifact key for the Cobalt release package and symbols."
    required: true
  chromedriver_artifacts_key:
    description: "GCS artifact key for the linux-x64x11-no-starboard Chromedriver binary."
    required: true
  download_chromedriver:
    description: "Download official Chromedriver instead of using the built binary."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Smoke Test Runtime Dependencies
      shell: bash
      run: |
        set -ex
        required_pkgs=(
          dbus-x11
          libatomic1
          libegl1
          libegl1-mesa
          libegl-mesa0
          libgbm1
          libgl1-mesa-dri
          libglapi-mesa
          libgles2-mesa
          python3-venv
          unzip
          x11-xserver-utils
          xvfb
        )
        if ! dpkg -s "${required_pkgs[@]}" >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends "${required_pkgs[@]}"
        fi

    - name: Download Cobalt QA Release Package from GCS
      uses: ./.github/actions/download_test_artifacts
      with:
        test_artifacts_key: ${{ inputs.test_artifacts_key }}
        archive_name: ${{ inputs.platform }}_${{ inputs.config }}.zip
        destination_path: artifacts

    - name: Download Chromedriver QA Binary from GCS
      uses: ./.github/actions/download_test_artifacts
      with:
        test_artifacts_key: ${{ inputs.chromedriver_artifacts_key }}
        archive_name: chromedriver
        destination_path: artifacts/chromedriver_no_starboard

    - name: Prepare Cobalt and Chromedriver Binaries
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        CONFIG: ${{ inputs.config }}
        TEST_ARTIFACTS_KEY: ${{ inputs.test_artifacts_key }}
      run: |
        set -euxo pipefail
        project_name=$(gcloud config get-value project)
        out_root="${GITHUB_WORKSPACE}/cobalt/src/out"
        out_dir="${out_root}/${PLATFORM}_${CONFIG}"
        mkdir -p "${out_root}"

        unzip -q -o "${GITHUB_WORKSPACE}/artifacts/${PLATFORM}_${CONFIG}.zip" -d "${out_root}"

        # packager.py renames cobalt.stripped -> cobalt inside the release zip.
        # Keep the stripped binary at cobalt.stripped and download the unstripped
        # cobalt binary from the packaged symbol directory in GCS.
        mv "${out_dir}/cobalt" "${out_dir}/cobalt.stripped"
        gcloud storage cp \
          "gs://${project_name}-test-artifacts/${TEST_ARTIFACTS_KEY}/${PLATFORM}_${CONFIG}/symbol/cobalt" \
          "${out_dir}/cobalt"

        mkdir -p "${out_dir}/starboard"
        cp -f "${out_dir}/libstarboard.so.18" "${out_dir}/starboard/libstarboard.so.18"

        cp -f "${GITHUB_WORKSPACE}/artifacts/chromedriver_no_starboard/chromedriver" "${out_dir}/chromedriver"
        chmod +x "${out_dir}/cobalt" "${out_dir}/cobalt.stripped" "${out_dir}/chromedriver"
        ls -la "${out_dir}"

    - name: Run Chromedriver Smoke Test
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        DOWNLOAD_CHROMEDRIVER: ${{ inputs.download_chromedriver }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -ex
        chmod +x "${ACTION_PATH}/run_smoke_test.sh"
        extra_args=()
        if [[ "${DOWNLOAD_CHROMEDRIVER}" == "true" ]]; then
          extra_args+=(--download-chromedriver)
        fi
        "${ACTION_PATH}/run_smoke_test.sh" \
          --cobalt-path "${GITHUB_WORKSPACE}/cobalt/src" \
          --config "${CONFIG}" \
          --output-dir "${GITHUB_WORKSPACE}/chromedriver_tests" \
          "${extra_args[@]}"

    - name: Archive Chromedriver Smoke Test Artifacts
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: chromedriver_smoketest_results_${{ github.run_attempt }}
        path: chromedriver_tests/**
