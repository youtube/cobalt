# Disable dangerous-triggers rule because this workflow uses pull_request_target
# and issue_comment strictly for PR automation (anchor comment, commit statuses,
# commit message generation, and read-only owner review) without executing
# untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: 'Pull Request Automation'

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ci-shepherd-anchor:
    name: Initialize CI Shepherd Anchor
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow }}-ci-shepherd-anchor @ ${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Initialize Anchor Comment and Commit Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail

          header="<!-- sticky-pull-request-comment: shepherd-report -->"

          # 1. Determine contexts: on synchronize pull existing CI / statuses, otherwise default to CI / All Pass
          contexts=("CI / All Pass")
          if [[ "${EVENT_ACTION}" == "synchronize" && -n "${BEFORE_SHA:-}" ]]; then
            mapfile -t prev_contexts < <(gh api "repos/${REPO}/commits/${BEFORE_SHA}/status" 2>/dev/null \
              | jq -r '.statuses[]? | select(.context | startswith("CI /")) | .context' 2>/dev/null | sort -u || true)
            contexts+=("${prev_contexts[@]}")
          fi
          mapfile -t contexts < <(printf '%s\n' "${contexts[@]}" | grep -v '^$' | sort -u)

          # 2. Reset all CI / commit statuses to pending on HEAD_SHA
          for ctx in "${contexts[@]}"; do
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="pending" \
              -f description="Checks are running" \
              -f context="${ctx}" || true
          done

          # 3. Build anchor comment table
          table=$(printf '| Context | State | Description |\n|---|---|---|')
          for ctx in "${contexts[@]}"; do
            table+=$(printf '\n| %s | ⏳ PENDING | Checks are running |' "${ctx}")
          done
          body=$(printf '%s\n\n%s' "${header}" "${table}")

          # 4. Create or patch anchor comment
          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" 2>/dev/null \
            | jq -r --arg h "${header}" '.[]? | select((.body // "") | contains($h)) | .id' | head -n1 || true)

          if [[ -n "${comment_id}" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="${body}" --silent
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" --silent
          fi

  generate_commit_message:
    name: Generate Commit Message
    needs: [ci-shepherd-anchor]
    # Run condition: PR open/reopen OR comment '/generate-commit-message' on a PR
    if: >
      always() && !cancelled() && (
        (github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/generate-commit-message'))
      )
    concurrency:
      group: ${{ github.workflow }}-generate-commit-message @ ${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      response: ${{ steps.gemini.outputs.response }}

    steps:
      - name: 'Checkout prompt'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .agent/commit_message_prompt.md
          sparse-checkout-cone-mode: false

      # --- Step 1: Get PR Diff ---
      - name: 'Get PR Diff'
        id: diff
        env:
          PR_URL_1: ${{ github.event.pull_request.url }}
          PR_URL_2: ${{ github.event.issue.pull_request.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Logic: Concatenate both URLs. Since events are exclusive, one will be empty.
          # PR Event URL + Issue Comment URL
          PR_API_URL="${PR_URL_1}${PR_URL_2}"
          DIFF_FILE="${RUNNER_TEMP}/pr_diff.txt"
          echo "DIFF_FILE=${DIFF_FILE}" >> "${GITHUB_ENV}"

          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3.diff" "${PR_API_URL}" > "${DIFF_FILE}"

          # If the diff exceeds 64 KB, omit it.
          if [ $(wc -c < "${DIFF_FILE}") -gt 65536 ]; then
            echo "[Diff omitted: exceeds size limit]" > "${DIFF_FILE}"
          fi

      # --- Step 2: Call Gemini API ---
      - name: 'Generate Commit Message with Gemini'
        id: gemini
        # Security: Load untrusted data into ENV variables safely.
        # We use concatenation ${{ A }}${{ B }} instead of || to avoid parser errors.
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}${{ github.event.issue.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}${{ github.event.issue.title }}
          PR_BODY: ${{ github.event.pull_request.body }}${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GEMINI_SECRET: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
        run: |
          set -euo pipefail
          # Extract additional instructions from the comment body if present.
          COMMENT="${COMMENT_BODY:-}"
          COMMENT="${COMMENT#* }"
          if [ "${COMMENT}" = "/generate-commit-message" ]; then
            COMMENT=""
          fi

          # Use jq to safely combine the instructions with the variables.
          json_payload=$(jq -n \
            --rawfile instr .agent/commit_message_prompt.md \
            --arg comment "<user_instructions>${COMMENT}</user_instructions>" \
            --arg url "<pull_request_url>${PR_URL}</pull_request_url>" \
            --arg title "<pull_request_title>${PR_TITLE}</pull_request_title>" \
            --arg body "<pull_request_description>${PR_BODY}</pull_request_description>" \
            --rawfile diff "${DIFF_FILE}" \
            '($instr + "\n\n**Additional instructions:**\n" + $comment + "\n\n**Pull Request URL:**\n" + $url + "\n\n**Pull Request Title:**\n" + $title + "\n\n**Original PR Description:**\n" + $body + "\n\n**Code Diff to Analyze:**\n<code_diff>\n" + $diff + "</code_diff>") as $full_text |
            {
              contents: [{
                parts: [{
                  text: $full_text
                }]
              }]
            }')

          api_response=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_SECRET}" \
            -d "${json_payload}")

          gemini_text_response=$(echo "${api_response}" | jq -r '.candidates[0].content.parts[0].text // "Error: Could not parse a valid response from the Gemini API. Please check the API response logs in the workflow run."')

          DELIMITER=$(openssl rand -hex 16)
          {
            echo "response<<${DELIMITER}"
            echo "${gemini_text_response}"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"

  post_commit_message:
    name: Post Commit Message
    needs: [generate_commit_message]
    if: >
      always() && !cancelled() &&
      needs.generate_commit_message.result == 'success' && (
        (github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/generate-commit-message'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Post Commit Message as Comment'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMENT_BODY: |
            ### 🤖 Gemini Suggested Commit Message

            ---

            ```
            ${{ needs.generate_commit_message.outputs.response }}
            ```

            ---

            **💡 Pro Tips for a Better Commit Message:**

            1.  **Influence the Result:** Want to change the output? You can write **custom prompts or instructions** directly in the **Pull Request description**. The model uses that text to generate the message.
            2.  **Re-run the Generator:** Post a comment with: `/generate-commit-message`
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const body = process.env.COMMENT_BODY;
            const issueNumber = Number(process.env.PR_NUMBER || process.env.ISSUE_NUMBER || context.issue.number);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  owner_review:
    name: Owner Review
    needs: [ci-shepherd-anchor]
    if: >
      always() && !cancelled() && (
        (github.event_name == 'pull_request_target' &&
          (github.event.action == 'opened' || github.event.action == 'reopened') &&
          !endsWith(github.event.pull_request.user.login, '-bot') &&
          !endsWith(github.event.pull_request.user.login, '[bot]')) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/owner-review') &&
          !endsWith(github.event.issue.user.login, '-bot') &&
          !endsWith(github.event.issue.user.login, '[bot]'))
      )
    concurrency:
      group: ${{ github.workflow }}-owner-review @ ${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      has_comment: ${{ steps.format_comment.outputs.has_comment }}
      pr_number: ${{ steps.format_comment.outputs.pr_number }}
      comment_body: ${{ steps.format_comment.outputs.comment_body }}
      review_comments: ${{ steps.format_comment.outputs.review_comments }}

    steps:
      - name: 'Checkout prompts'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .agent
            .github
          sparse-checkout-cone-mode: false

      - name: 'Get PR Diff'
        env:
          URL: ${{ github.event.pull_request.url }}${{ github.event.issue.pull_request.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.v3.diff" "${URL}" > "${RUNNER_TEMP}/pr.diff"
          gh api "${URL}/files" --paginate --jq '.[].filename' > "${RUNNER_TEMP}/changed_files.txt"

      - name: 'Resolve Reviewers & Prompt'
        id: resolve_review
        run: |
          set -euo pipefail
          prompt_file="${RUNNER_TEMP}/review_prompt.txt"
          review_out_dir="${RUNNER_TEMP}/review-out"
          review_file="${review_out_dir}/owner_review.json"
          mkdir -p "${review_out_dir}"
          rm -f "${review_file}"

          mapfile -t changed_files < "${RUNNER_TEMP}/changed_files.txt"
          reviewer_paths=""
          if [[ ${#changed_files[@]} -gt 0 ]]; then
            reviewer_paths=$(python3 .github/scripts/resolve_codeowners.py --paths "${changed_files[@]}")
          fi

          if [ -n "${reviewer_paths}" ]; then
            echo "has_reviewers=true" >> "${GITHUB_OUTPUT}"
            echo "reviewer_paths=$(printf '%s\n' "${reviewer_paths}" | paste -sd ' ' -)" >> "${GITHUB_OUTPUT}"
            {
              echo "Review the PR diff below as the lead reviewer."
              echo "The full PR source tree is available in read-only mode at ${RUNNER_TEMP}/pr-src (use read_file, list_directory, glob, or grep_search with that path to inspect surrounding code)."
              echo "Run each matching reviewer persona as a subagent using its prompt file:"
              for rpath in ${reviewer_paths}; do
                echo "---"
                echo "Reviewer prompt (${rpath}):"
                cat "${rpath}"
                echo ""
              done
              echo "---"
              echo "Produce comments ONLY on files matching each reviewer's own paths globs (never comment on files outside a reviewer's paths)."
              echo "In \"comments\", each \"path\" MUST be the repository-relative path from the diff (never prefix it with \"${RUNNER_TEMP}/pr-src/\")."
              echo "Start EVERY inline comment's body with a markdown header identifying the reviewer persona (e.g. #### 🛡️ Review by \`<reviewer-name>\` followed by a blank line), and include change suggestions in \`\`\`suggestion blocks where appropriate."
              echo "Write the final review result using the write_file tool directly to ${review_file} as raw JSON (no markdown code fences, overriding any output format in the reviewer prompts above) with fields:"
              echo '{"summary": "overall review summary", "comments": [{"path": "file/path", "line": 12, "body": "#### 🛡️ Review by `<reviewer-name>`\n\ncomment with ```suggestion\nreplacement\n```"}]}'
              echo "After writing ${review_file}, respond with a brief confirmation."
              echo ""
              echo "<code_diff>"
              cat "${RUNNER_TEMP}/pr.diff"
              echo "</code_diff>"
            } > "${prompt_file}"

            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "prompt<<${delim}"
              cat "${prompt_file}"
              echo "${delim}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: 'Checkout PR source read-only'
        if: steps.resolve_review.outputs.has_reviewers == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_src="${RUNNER_TEMP}/pr-src"
          if [[ -d "${pr_src}" ]]; then
            chmod -R u+w "${pr_src}"
            rm -rf "${pr_src}"
          fi
          mkdir -p "${pr_src}"
          git -C "${pr_src}" init -q
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -C "${pr_src}" -c "http.extraheader=${auth_header}" \
            fetch -q --depth=1 --no-tags "https://github.com/${REPO}.git" "refs/pull/${PR_NUM}/head"
          git -C "${pr_src}" checkout -q --detach FETCH_HEAD
          chmod -R a-w "${pr_src}" .agent .github

      - name: 'Review with Gemini CLI'
        id: gemini_review
        if: steps.resolve_review.outputs.has_reviewers == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
          gemini_model: 'gemini-3.8-flash'
          settings: |-
            {
              "context": {
                "includeDirectories": [
                  "${{ runner.temp }}/pr-src",
                  "${{ runner.temp }}/review-out"
                ],
                "loadMemoryFromIncludeDirectories": false
              },
              "tools": {
                "core": [
                  "list_directory",
                  "read_file",
                  "glob",
                  "grep_search",
                  "write_file"
                ]
              }
            }
          prompt: ${{ steps.resolve_review.outputs.prompt }}

      - name: 'Format Comment'
        id: format_comment
        env:
          OWNER_REV_RAN: ${{ steps.gemini_review.outcome == 'success' }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          out_file="${RUNNER_TEMP}/comment.md"
          json_file="${RUNNER_TEMP}/comments.json"
          review_file="${RUNNER_TEMP}/review-out/owner_review.json"
          echo "[]" > "${json_file}"
          rm -f "${out_file}"
          touch "${out_file}"

          if [[ "${OWNER_REV_RAN}" == "true" ]]; then
            echo "### 🛡️ CODEOWNERS Critic Review" >> "${out_file}"
            echo "" >> "${out_file}"

            if [ -f "${review_file}" ] && jq -e 'type == "object" and (.summary | type == "string") and (.comments | type == "array")' "${review_file}" >/dev/null 2>&1; then
              printf '%s\n\n' "$(jq -r .summary "${review_file}")" >> "${out_file}"
              jq -c .comments "${review_file}" > "${json_file}"
            else
              echo "[]" > "${json_file}"
              echo "Automated code review could not be generated for this change." >> "${out_file}"
              echo "" >> "${out_file}"
            fi
          fi

          if [ -s "${out_file}" ]; then
            echo "> **💡 Triggering reviews:**" >> "${out_file}"
            echo "> - Comment \`/owner-review\` to trigger CODEOWNERS review." >> "${out_file}"
            echo "has_comment=true" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${PR_NUM}" >> "${GITHUB_OUTPUT}"
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "comment_body<<${delim}"
              cat "${out_file}"
              echo "${delim}"
            } >> "${GITHUB_OUTPUT}"
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "review_comments<<${delim}"
              cat "${json_file}"
              echo "${delim}"
            } >> "${GITHUB_OUTPUT}"
          fi

  post_owner_review:
    name: Post Owner Review
    needs: [owner_review]
    if: always() && !cancelled() && needs.owner_review.result == 'success' && needs.owner_review.outputs.has_comment == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Post Owner Review'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ needs.owner_review.outputs.pr_number }}
          COMMENT_BODY: ${{ needs.owner_review.outputs.comment_body }}
          REVIEW_COMMENTS: ${{ needs.owner_review.outputs.review_comments }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const body = process.env.COMMENT_BODY;
            let comments = [];
            try {
              comments = JSON.parse(process.env.REVIEW_COMMENTS || '[]');
            } catch (_) {}

            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: body,
                  event: 'COMMENT',
                  comments: comments
                });
                return;
              } catch (err) {
                console.log('Failed to post inline review, falling back to top-level comment:', err.message);
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
