name: OverlayFS Workspace Layer
description: Layers a pre-warmed golden workspace using fuse-overlayfs for zero-copy, instant checkouts.

inputs:
  path:
    description: Destination path (e.g. cobalt).
    required: true
  platform:
    description: Target platform for platform-specific golden snapshot.
    default: ''
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'

outputs:
  cache_hit:
    description: "Whether the golden workspace cache was hit on the node SSD."
    value: ${{ steps.prepare.outputs.cache_hit }}

runs:
  using: "composite"
  steps:
    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Layer OverlayFS Workspace
      id: prepare
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        PLATFORM_INPUT: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        LOWER_DIR="/runner-cache/golden-workspace"
        SESSION_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RUNNER_NAME:-runner}"
        UPPER_DIR="/runner-cache/workspaces/${SESSION_ID}/upper"
        WORK_DIR="/runner-cache/workspaces/${SESSION_ID}/work"
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"

        # Clean up stale mounts and reclaim space from finished or cancelled jobs
        fusermount3 -u -z "${MERGED_DIR}" 2>/dev/null || fusermount -u -z "${MERGED_DIR}" 2>/dev/null || umount -l "${MERGED_DIR}" 2>/dev/null || true
        rm -rf /runner-cache/workspaces/*

        # Determine whether the runner started warm (golden workspace hit on SSD)
        cache_hit=false
        if [ -w "/runner-cache" ] && [ -d "${LOWER_DIR}" ]; then
          cache_hit=true
        fi
        echo "cache_hit=${cache_hit}" >> "${GITHUB_OUTPUT}"

        echo "Logging workspace cache status to Cloud Logging..."
        LOG_PAYLOAD=$(jq -n \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg job "${GITHUB_JOB}" \
          --arg runner "${RUNNER_NAME:-runner}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --argjson cache_hit "${cache_hit}" \
          '{workflow: $workflow, job: $job, runner: $runner, run_id: $run_id, url: $url, cache_hit: $cache_hit}')
        gcloud logging write github-actions-runners "${LOG_PAYLOAD}" --payload-type=json 2>/dev/null || true

        # Hydrate golden workspace from GCS snapshot if cache is cold
        if [ -w "/runner-cache" ] && [ ! -d "${LOWER_DIR}" ]; then
          PROJECT_NAME=$(gcloud config get-value project)
          ARCHIVE="gs://${PROJECT_NAME}-test-artifacts/golden-workspace/${PLATFORM_INPUT}/golden-workspace-latest.tar.zst"
          STAGING_DIR="${LOWER_DIR}.staging.$$"

          rm -rf "${LOWER_DIR}.staging."*
          mkdir -p "${STAGING_DIR}"

          if gcloud storage cp "${ARCHIVE}" - 2>/dev/null | tar --no-same-owner --use-compress-program="zstd -d -T0" -xf - -C "${STAGING_DIR}"; then
            if [ -d "${STAGING_DIR}/src/.git" ]; then
              git -C "${STAGING_DIR}/src" update-index --refresh -q 2>/dev/null || true
            fi
            rm -rf "${LOWER_DIR}"
            mv "${STAGING_DIR}" "${LOWER_DIR}"
            echo "Extracted golden workspace snapshot from ${ARCHIVE}"
          fi
          rm -rf "${STAGING_DIR}"
        fi

        if [ ! -d "${LOWER_DIR}" ]; then
          echo "Golden workspace not found on SSD or GCS. Proceeding with cold workspace."
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        mkdir -p "${UPPER_DIR}" "${WORK_DIR}" "${MERGED_DIR}"

        echo "Mounting OverlayFS (${LOWER_DIR}) to ${MERGED_DIR}..."
        fuse-overlayfs -o lowerdir="${LOWER_DIR}",upperdir="${UPPER_DIR}",workdir="${WORK_DIR}" "${MERGED_DIR}"

        git config --global --add safe.directory "${MERGED_DIR}"
        git config --global --add safe.directory "${MERGED_DIR}/src"
        git config --global --add safe.directory "${MERGED_DIR}/depot_tools"
