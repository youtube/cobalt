name: Cached Checkout
description: Generic git checkout with bare repository cache support.
inputs:
  repository:
    description: The url of the repo to checkout. Defaults to Cobalt.
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: Git ref to checkout.
    required: true
  path:
    description: Destination path.
    required: true
  fetch_depth:
    description: Number of commits to fetch.
    default: "1"
  use_cache:
    description: Whether to attempt using /runner-cache.
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Fetch and Checkout Ref
      env:
        REPO_URL: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DEST_PATH: ${{ inputs.path }}
        FETCH_DEPTH: ${{ inputs.fetch_depth }}
      shell: bash
      run: |
        set -exo pipefail

        retry() {
          for delay in 0 5 15 30; do
            sleep "${delay}"
            "$@" && return 0
          done
          return 1
        }

        mkdir -p "${DEST_PATH}"
        git config --global --add safe.directory "$(cd "${DEST_PATH}" && pwd)"

        if [ ! -d "${DEST_PATH}/.git" ]; then
          git -C "${DEST_PATH}" init --quiet
          git -C "${DEST_PATH}" remote add origin "${REPO_URL}"
        fi

        if [[ "${REF}" =~ ^[0-9a-fA-F]{40}$ ]] && \
           [ "$(git -C "${DEST_PATH}" rev-parse -q --verify HEAD 2>/dev/null || true)" = "${REF}" ] && \
           { [ "${FETCH_DEPTH}" -ne 0 ] || [ ! -f "${DEST_PATH}/.git/shallow" ]; }; then
          echo "HEAD is already at ${REF}. Skipping fetch."
          exit 0
        fi

        depth_arg=()
        if [ "${FETCH_DEPTH}" -ne 0 ]; then
          depth_arg+=(--depth "${FETCH_DEPTH}")
        elif [ -f "${DEST_PATH}/.git/shallow" ]; then
          depth_arg+=(--unshallow)
        fi

        retry git -C "${DEST_PATH}" fetch --no-tags --filter=blob:none "${depth_arg[@]}" origin "${REF}"
        git -C "${DEST_PATH}" checkout --detach FETCH_HEAD
