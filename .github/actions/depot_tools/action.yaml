name: Set Up Depot Tools
description: Sets up Depot Tools and initializes gclient. Optionally performs checkout and uses git cache.

inputs:
  run_sync:
    description: Whether or not to run gclient sync.
    default: 'true'
  rbe_instance:
    description: The RBE instance to use.
    default: projects/cobalt-actions-prod/instances/default_instance
  use_cache:
    description: Whether or not to use runner cache.
    default: 'true'
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'
  publish_golden_workspace:
    description: "Whether or not to publish the golden workspace archive."
    default: 'false'
  platform:
    description: "Target platform for platform-specific golden archive."
    default: ''

runs:
  using: "composite"
  steps:
    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Set Cache Path
      id: cache-path
      shell: bash
      env:
        USE_CACHE: ${{ inputs.use_cache }}
      run: |
        if [[ "${USE_CACHE}" == "true" ]] && [[ -w "/runner-cache" ]]; then
          echo "path=/runner-cache" >> "${GITHUB_OUTPUT}"
        else
          echo "path=" >> "${GITHUB_OUTPUT}"
        fi

    - name: Clone Depot Tools
      uses: ./.github/actions/checkout
      with:
        repository: https://chromium.googlesource.com/chromium/tools/depot_tools.git
        # TODO(b/562551706): Pinned before upstream 20aff01e (2026-09-16), which added
        # `--end-of-options` to `git checkout`. Need to update git on runners.
        ref: 4a978d8f1f3567d5bd729aec018bfc345a14e1cd
        fetch_depth: 0
        path: cobalt/depot_tools
        use_cache: ${{ inputs.use_cache }}

    - name: Add Depot Tools to PATH
      run: echo "${GITHUB_WORKSPACE}/cobalt/depot_tools" >> "${GITHUB_PATH}"
      shell: bash

    - name: Set CIPD Cache Directory
      if: steps.cache-path.outputs.path != ''
      env:
        CACHE_PATH: ${{ steps.cache-path.outputs.path }}
      run: echo "CIPD_CACHE_DIR=${CACHE_PATH}/cipd-cache" >> "${GITHUB_ENV}"
      shell: bash

    - name: Bootstrap Bundled python3
      run: |
        # Must be run manually as ${DEPOT_TOOLS_UPDATE} is 0 in CI, skipping the bootstrap.
        if [ -f "${GITHUB_WORKSPACE}/cobalt/depot_tools/python3_bin_reldir.txt" ] && \
           [ -x "${GITHUB_WORKSPACE}/cobalt/depot_tools/$(tr -d '\r\n' < "${GITHUB_WORKSPACE}/cobalt/depot_tools/python3_bin_reldir.txt")/python3" ]; then
          echo "Bundled python3 already bootstrapped in depot_tools. Skipping."
        else
          source "${GITHUB_WORKSPACE}/cobalt/depot_tools/bootstrap_python3" && bootstrap_python3
        fi
      shell: bash

    - name: Disable Chromium client side build telemetry
      run: build_telemetry opt-out
      shell: bash

    - name: Run gclient config
      env:
        RBE_INSTANCE: ${{ inputs.rbe_instance }}
        REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -x
        cd cobalt

        if [ ! -f .gclient ]; then
          gclient config \
            --name=src \
            --custom-var="rbe_instance=\"${RBE_INSTANCE}\"" \
            "${REPOSITORY}"
        else
          echo ".gclient already exists. Skipping gclient config."
        fi
      shell: bash

    - name: Set target OS
      shell: bash
      working-directory: cobalt
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        if ! grep -q "target_os" .gclient; then
          if [[ "${PLATFORM}" == *"android"* || "${PLATFORM}" == *"aosp"* ]]; then
            echo "target_os=['android']" >> .gclient
          elif [[ "${PLATFORM}" == *"tvos"* ]]; then
            echo "target_os=['ios']" >> .gclient
          fi
        fi
        gclient validate

    - name: Set target CPU
      shell: bash
      working-directory: cobalt
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        if ! grep -q "target_cpu" .gclient; then
          if [[ "${PLATFORM}" == *"evergreen-arm64"* ]]; then
            echo "target_cpu=['x64', 'arm64']" >> .gclient
          elif [[ "${PLATFORM}" == *"evergreen-arm"* ]]; then
            echo "target_cpu=['x64', 'arm']" >> .gclient
          fi
        fi
        gclient validate

    - name: Check Golden Workspace DEPS Match
      id: check-deps
      if: inputs.run_sync == 'true'
      shell: bash
      working-directory: cobalt
      run: |
        git config --global --add safe.directory '*'
        if ! grep -q "ios" .gclient && [ -f "src/DEPS" ]; then
          LOWER_DIR="${GOLDEN_WORKSPACE_LOWER_DIR:-}"
          if [ -z "${LOWER_DIR}" ]; then
            if [ -f "/runner-cache/current/.runner_cache_ready" ]; then
              LOWER_DIR=$(readlink -f "/runner-cache/current")
            elif [ -f "/runner-cache/golden-workspace/.runner_cache_ready" ]; then
              LOWER_DIR=$(readlink -f "/runner-cache/golden-workspace")
            fi
          fi

          target_matched=false
          current_hash=$(sha256sum src/DEPS | awk '{print $1}')

          # Method 1: Direct comparison between golden workspace DEPS and target src/DEPS
          if [ -n "${LOWER_DIR}" ] && [ -f "${LOWER_DIR}/src/DEPS" ]; then
            if cmp -s "${LOWER_DIR}/src/DEPS" "src/DEPS"; then
              echo "Golden workspace DEPS (${LOWER_DIR}/src/DEPS) matches target src/DEPS."
              target_matched=true
            fi
          fi

          # Method 2: Compare against cached DEPS hash (.deps_sha256)
          if [ "${target_matched}" != "true" ]; then
            cached_hash=""
            if [ -f ".deps_sha256" ]; then
              cached_hash=$(tr -d '[:space:]' < .deps_sha256)
            elif [ -n "${LOWER_DIR}" ] && [ -f "${LOWER_DIR}/.deps_sha256" ]; then
              cached_hash=$(tr -d '[:space:]' < "${LOWER_DIR}/.deps_sha256")
            elif [ -n "${LOWER_DIR}" ] && [ -f "${LOWER_DIR}/src/DEPS" ]; then
              cached_hash=$(sha256sum "${LOWER_DIR}/src/DEPS" 2>/dev/null | awk '{print $1}')
            fi

            if [ -n "${cached_hash}" ] && [ "${cached_hash}" = "${current_hash}" ]; then
              echo "Golden workspace DEPS hash (${current_hash}) matches src/DEPS."
              target_matched=true
            fi
          fi

          # Method 3: Compare git tree diff against golden revision if present in git object database
          if [ "${target_matched}" != "true" ]; then
            golden_rev=""
            if [ -f ".golden_revision" ]; then
              golden_rev=$(tr -d '[:space:]' < .golden_revision)
            elif [ -n "${LOWER_DIR}" ] && [ -f "${LOWER_DIR}/.golden_revision" ]; then
              golden_rev=$(tr -d '[:space:]' < "${LOWER_DIR}/.golden_revision")
            elif [ -n "${LOWER_DIR}" ] && [ -d "${LOWER_DIR}/src/.git" ]; then
              golden_rev=$(git -C "${LOWER_DIR}/src" rev-parse HEAD 2>/dev/null || true)
            fi

            if [ -n "${golden_rev}" ] && git -C src cat-file -e "${golden_rev}^{commit}" 2>/dev/null; then
              if git -C src diff --quiet "${golden_rev}" HEAD -- DEPS 2>/dev/null; then
                echo "Golden workspace base revision (${golden_rev}) matches target DEPS."
                target_matched=true
              fi
            fi
          fi

          if [ "${target_matched}" = "true" ]; then
            echo "Skipping gclient sync and runhooks."
            python3 src/build/util/lastchange.py -o src/build/util/LASTCHANGE --filter='\(#[1-9][0-9]*\)'
            python3 src/build/util/lastchange.py -m GPU_LISTS_VERSION --revision-id-only --header src/gpu/config/gpu_lists_version.h
            echo "deps_match=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
        fi
        echo "deps_match=false" >> "${GITHUB_OUTPUT}"

    - name: Clean dirty sub-repositories
      shell: bash
      if: inputs.run_sync == 'true' && steps.check-deps.outputs.deps_match != 'true'
      working-directory: cobalt/src
      run: |
        # Identify and delete dirty sub-repositories
        git -c core.quotepath=false status --porcelain -unormal | while IFS= read -r line; do
          path="${line:3}"
          clean_path="${path%/}"
          if [[ -d "${clean_path}" && -d "${clean_path}/.git" ]]; then
            echo "Deleting conflicting sub-repo: ${clean_path}"
            rm -rf "${clean_path}"
          fi
        done

    - name: Run gclient sync
      shell: bash
      if: inputs.run_sync == 'true' && steps.check-deps.outputs.deps_match != 'true'
      working-directory: cobalt
      env:
        REF: ${{ github.sha }}
      run: |
        gclient sync \
          --verbose \
          --shallow \
          --no-history \
          --nohooks \
          --force \
          --delete_unversioned_trees \
          --revision "${REF}"

    - name: Run gclient runhooks
      if: inputs.run_sync == 'true' && steps.check-deps.outputs.deps_match != 'true'
      working-directory: cobalt
      run: |
        gclient runhooks --verbose
      shell: bash

    - name: Publish Golden Workspace
      if: inputs.publish_golden_workspace == 'true' && steps.check-deps.outputs.deps_match != 'true'
      uses: ./.github/actions/publish_golden_workspace
      with:
        platform: ${{ inputs.platform }}
        workspace_path: cobalt
        use_gcloud: ${{ inputs.use_gcloud }}
