# Disable dangerous-triggers rule because this workflow uses pull_request_target
# strictly to rerun existing workflows when trigger labels are applied,
# without checking out or executing untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: Workflow Dispatcher

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
      label_name:
        description: 'Label name'
        required: true
        default: 'runtest'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'runtest' || github.event.label.name == 'yts_playback_test' || github.event.label.name == 'kokoro:run' || github.event.label.name == 'kokoro:force-run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Check label and trigger PR jobs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let pr = context.payload.pull_request;
            let labelName = context.payload.label ? context.payload.label.name : null;

            if (context.eventName === 'workflow_dispatch') {
              const prNumber = parseInt(context.payload.inputs.pr_number, 10);
              labelName = context.payload.inputs.label_name;
              const prResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = prResponse.data;
            }

            const PLATFORM_WORKFLOWS = [
              'android.yaml',
              'aosp.yaml',
              'evergreen.yaml',
              'linux.yaml',
              'tvos.yaml'
            ];

            let workflows = [];
            if (labelName === 'kokoro:run' || labelName === 'kokoro:force-run') {
              workflows = ['tvos.yaml'];
            } else {
              workflows = PLATFORM_WORKFLOWS;
            }

            console.log(`Triggering workflows for label ${labelName}:`, workflows);

            await Promise.all(workflows.map(async (workflow) => {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow,
                  head_sha: pr.head.sha,
                  event: 'pull_request'
                });

                if (runs.data.workflow_runs.length === 0) {
                  return;
                }

                const latestRun = runs.data.workflow_runs[0];

                // If the workflow is currently running or queued, cancel it first so it can be re-run
                if (latestRun.status !== 'completed') {
                  console.log(`Run ${latestRun.id} for ${workflow} is currently ${latestRun.status}. Cancelling...`);
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: latestRun.id
                    });
                  } catch (cancelError) {
                    console.log(`Cancel request note for ${workflow}:`, cancelError.message);
                  }

                  // Wait for run to reach 'completed' status before attempting to rerun
                  for (let attempt = 0; attempt < 15; attempt++) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    const checkRun = await github.rest.actions.getWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: latestRun.id
                    });
                    if (checkRun.data.status === 'completed') {
                      console.log(`Run ${latestRun.id} for ${workflow} reached completed status (${checkRun.data.conclusion}).`);
                      break;
                    }
                  }
                }

                console.log(`Rerunning ${workflow} (run ${latestRun.id})...`);
                await github.rest.actions.reRunWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestRun.id
                });
                console.log(`Successfully triggered rerun for ${workflow} (run ${latestRun.id})!`);
              } catch (error) {
                console.error(`Failed to rerun ${workflow}:`, error);
              }
            }));

            // Remove the trigger label after all workflows have been triggered
            if (labelName === 'runtest' || labelName === 'yts_playback_test') {
              try {
                console.log(`Removing label ${labelName} from PR #${pr.number}...`);
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: labelName
                });
                console.log(`Successfully removed label ${labelName} from PR #${pr.number}.`);
              } catch (error) {
                console.error(`Failed to remove label ${labelName}:`, error);
              }
            }
