name: Cached Checkout
description: Generic git checkout with bare repository cache support.
inputs:
  repository:
    description: The url of the repo to checkout. Defaults to Cobalt.
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: Git ref to checkout.
    required: true
  path:
    description: Destination path.
    required: true
  fetch_depth:
    description: Number of commits to fetch.
    default: '1'
  use_cache:
    description: Whether to attempt using /runner-cache.
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Clone Repo
      env:
        REPO_URL: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DEST_PATH: ${{ inputs.path }}
        FETCH_DEPTH: ${{ inputs.fetch_depth }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
      shell: bash
      run: |
        set -ex

        retry() {
          for delay in 0 5 15 30; do
            sleep "${delay}"
            "$@" && return
          done
          return 1
        }

        depth_arg=()
        if [ "${FETCH_DEPTH}" -ne 0 ]; then
          depth_arg+=(--depth "${FETCH_DEPTH}")
        fi

        if [ ! -d "${DEST_PATH}/.git" ]; then
          for attempt in 1 2 3; do
            if git clone \
              --filter=blob:none \
              "${depth_arg[@]}" \
              "${REPO_URL}" \
              "${DEST_PATH}"; then
              break
            fi
            if [[ -n "${DEST_PATH}" && "${DEST_PATH}" != "." && "${DEST_PATH}" != "/" ]]; then
              rm -rf "${DEST_PATH}"
            else
              rm -rf "${DEST_PATH}/.git"
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
        else
          echo "Repository already exists at ${DEST_PATH}. Skipping clone."
        fi

        git config --global --add safe.directory "$(cd "${DEST_PATH}" && pwd)"

        if [ -n "${GITHUB_BASE_REF}" ] && [[ "${REPO_URL}" != *"depot_tools"* ]]; then
          retry git -C "${DEST_PATH}" fetch "${depth_arg[@]}" origin "${GITHUB_BASE_REF}" "${REF}"
          git -C "${DEST_PATH}" checkout "origin/${GITHUB_BASE_REF}"
          # Deepen shallow history until a common merge-base between target branch and PR head is found.
          for _ in {1..5}; do
            git -C "${DEST_PATH}" merge-base HEAD "${REF}" > /dev/null && break
            git -C "${DEST_PATH}" fetch --deepen=100 origin -- "${GITHUB_BASE_REF}" "${REF}"
          done
          git -C "${DEST_PATH}" merge --squash "${REF}"
          commit_date=$(git -C "${DEST_PATH}" log -1 --format=%cI "${REF}")
          author_name=$(git -C "${DEST_PATH}" log -1 --format=%an "${REF}")
          author_email=$(git -C "${DEST_PATH}" log -1 --format=%ae "${REF}")
          GIT_AUTHOR_NAME="${author_name}" \
          GIT_AUTHOR_EMAIL="${author_email}" \
          GIT_AUTHOR_DATE="${commit_date}" \
          GIT_COMMITTER_NAME="${author_name}" \
          GIT_COMMITTER_EMAIL="${author_email}" \
          GIT_COMMITTER_DATE="${commit_date}" \
          git -C "${DEST_PATH}" commit --quiet --allow-empty \
            --message "Squash merge ${REF} onto ${GITHUB_BASE_REF}"
        else
          if git -C "${DEST_PATH}" cat-file -e "${REF}^{commit}" 2>/dev/null; then
            echo "Commit ${REF} already exists in ${DEST_PATH}. Skipping fetch."
          else
            retry git -C "${DEST_PATH}" fetch "${depth_arg[@]}" origin -- "${REF}"
          fi
          git -C "${DEST_PATH}" checkout "${REF}"
        fi
