name: OverlayFS Workspace Layer
description: Layers a pre-warmed golden workspace using fuse-overlayfs for zero-copy, instant checkouts.

inputs:
  path:
    description: Destination path (e.g. cobalt).
    required: true
  platform:
    description: Target platform for platform-specific golden snapshot.
    default: ''
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'

outputs:
  cache_hit:
    description: "Whether the golden workspace cache was hit on the node SSD."
    value: ${{ steps.resolve-snapshot.outputs.cache_hit }}

runs:
  using: "composite"
  steps:
    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Clean Stale Mounts and Workspaces
      id: cleanup
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"
        if mountpoint -q "${MERGED_DIR}"; then
          fusermount3 -u -z "${MERGED_DIR}"
        fi
        rm -rf /runner-cache/workspaces/*
        if [ -w "/runner-cache" ] && [ ! -d "/runner-cache/golden-workspace/gclient" ]; then
          rm -rf /runner-cache/golden-workspace
        fi

    - name: Check SSD Cache Hit
      id: detect-cache
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        src_hit=false
        gclient_hit=false
        cache_hit=false
        PROFILE="linux"
        if [[ "${PLATFORM}" == *"android"* || "${PLATFORM}" == *"aosp"* ]]; then
          PROFILE="android"
        fi
        SRC_DIR="/runner-cache/golden-workspace/src"
        GCLIENT_DIR="/runner-cache/golden-workspace/gclient/${PROFILE}"
        if [ -d "${SRC_DIR}/src/.git" ] && cmp -s DEPS "${SRC_DIR}/src/DEPS"; then
          src_hit=true
        fi
        if [ -d "${GCLIENT_DIR}" ] && cmp -s DEPS "${GCLIENT_DIR}/src/DEPS"; then
          gclient_hit=true
        fi
        if [ "${src_hit}" = "true" ] && [ "${gclient_hit}" = "true" ]; then
          cache_hit=true
        fi
        echo "cache_hit=${cache_hit}" >> "${GITHUB_OUTPUT}"

        echo "Logging workspace cache status to Cloud Logging..."
        LOG_PAYLOAD=$(jq -n \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg job "${GITHUB_JOB}" \
          --arg runner "${RUNNER_NAME:-runner}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg platform "${PLATFORM}" \
          --arg profile "${PROFILE}" \
          --argjson cache_hit "${cache_hit}" \
          --argjson src_cache_hit "${src_hit}" \
          --argjson gclient_cache_hit "${gclient_hit}" \
          '{workflow: $workflow, job: $job, runner: $runner, run_id: $run_id, url: $url, platform: $platform, profile: $profile, cache_hit: $cache_hit, src_cache_hit: $src_cache_hit, gclient_cache_hit: $gclient_cache_hit}')
        gcloud logging write github-actions-runners "${LOG_PAYLOAD}" --payload-type=json

    - name: Hydrate Snapshot from GCS
      id: hydrate-snapshot
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        MAX_HISTORY_COMMITS: 200
      run: |
        set -euo pipefail
        if [ ! -w "/runner-cache" ]; then
          exit 0
        fi

        PROFILE="linux"
        if [[ "${PLATFORM}" == *"android"* || "${PLATFORM}" == *"aosp"* ]]; then
          PROFILE="android"
        fi

        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        BUCKET="$(gcloud config get-value project)-test-artifacts/golden-workspace"
        mkdir -p /runner-cache/golden-workspace/gclient

        hydrate_part() {
          local key="$1"
          local staging_dir="/runner-cache/staging.${key//\//-}.$$"
          local lower_dir="/runner-cache/golden-workspace/${key}"
          local ref="refs/remotes/origin/golden-workspace/${key}"
          local expected=""

          if [ -n "$(git ls-remote origin "refs/golden-workspace/${key}")" ]; then
            git fetch -q origin "+refs/golden-workspace/${key}:${ref}"
            expected=$(git log -1 --format=%s "${ref}")
          fi

          if [ -f "${lower_dir}/.digest" ]; then
            local local_digest
            local_digest=$(cat "${lower_dir}/.digest")
            if [ -n "${expected}" ] && [ -n "${local_digest}" ] && git log -n "${MAX_HISTORY_COMMITS}" --format=%s "${ref}" | grep -Fxq "${local_digest}"; then
              echo "Golden workspace (${key}) on SSD is valid (${local_digest:0:12})."
              if cmp -s DEPS "${lower_dir}/src/DEPS" || [ "${local_digest}" = "${expected}" ]; then
                return 0
              fi
              echo "Notice: DEPS differs from the SSD snapshot (${key}); fetching latest (${expected:0:12})..."
            else
              echo "Notice: Golden workspace (${key}) on SSD is stale or unverified; re-hydrating..."
              rm -rf "${lower_dir}"
            fi
          fi

          if [ -z "${expected}" ]; then
            echo "Notice: No golden workspace snapshot ref found for ${key}."
            return 0
          fi

          echo "Downloading, extracting, and verifying golden workspace (${key}) (${expected:0:12})..."
          rm -rf "${staging_dir}" && mkdir -p "${staging_dir}"
          {
            gcloud storage cat "gs://${BUCKET}/${key}/${expected}.tar.zst" \
              | tee /dev/fd/3 \
              | tar --no-same-owner --use-compress-program="zstd -d -T0" -xf - -C "${staging_dir}" >&2
          } 3>&1 | sha256sum -c <(echo "${expected}  -")

          if [ -d "${staging_dir}/src/.git" ]; then
            git -C "${staging_dir}/src" update-index --refresh -q
          fi

          echo "${expected}" > "${staging_dir}/.digest"
          rm -rf "${lower_dir}"
          mv "${staging_dir}" "${lower_dir}"
          echo "Extracted and verified golden workspace (${key}) to ${lower_dir}"
        }

        hydrate_part "src" &
        pid_src=$!
        hydrate_part "gclient/${PROFILE}" &
        pid_gclient=$!
        wait "${pid_src}"
        wait "${pid_gclient}"

    - name: Resolve Active Snapshot Directory
      id: resolve-snapshot
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        SSD_CACHE_HIT: ${{ steps.detect-cache.outputs.cache_hit }}
      run: |
        set -euo pipefail
        PROFILE="linux"
        if [[ "${PLATFORM}" == *"android"* || "${PLATFORM}" == *"aosp"* ]]; then
          PROFILE="android"
        fi
        lower_dirs=()
        SRC_DIR="/runner-cache/golden-workspace/src"
        GCLIENT_DIR="/runner-cache/golden-workspace/gclient/${PROFILE}"
        if [ -d "${GCLIENT_DIR}" ]; then
          if cmp -s DEPS "${GCLIENT_DIR}/src/DEPS"; then
            lower_dirs+=("${GCLIENT_DIR}")
          else
            echo "Notice: DEPS differs from the golden gclient snapshot. Skipping gclient overlay."
          fi
        fi
        if [ -d "${SRC_DIR}/src/.git" ]; then
          lower_dirs+=("${SRC_DIR}")
        fi

        lower_dir=$(IFS=:; echo "${lower_dirs[*]}")
        echo "lower_dir=${lower_dir}" >> "${GITHUB_OUTPUT}"
        if [ "${#lower_dirs[@]}" -eq 2 ]; then
          echo "cache_hit=${SSD_CACHE_HIT}" >> "${GITHUB_OUTPUT}"
        else
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Mount OverlayFS Layer
      if: steps.resolve-snapshot.outputs.lower_dir != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        LOWER_DIR: ${{ steps.resolve-snapshot.outputs.lower_dir }}
      run: |
        SESSION_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RUNNER_NAME:-runner}"
        UPPER_DIR="/runner-cache/workspaces/${SESSION_ID}/upper"
        WORK_DIR="/runner-cache/workspaces/${SESSION_ID}/work"
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"

        mkdir -p "${UPPER_DIR}" "${WORK_DIR}" "${MERGED_DIR}"

        echo "Mounting OverlayFS (${LOWER_DIR}) to ${MERGED_DIR}..."
        fuse-overlayfs -o lowerdir="${LOWER_DIR}",upperdir="${UPPER_DIR}",workdir="${WORK_DIR}" "${MERGED_DIR}"

        git config --global --add safe.directory "${MERGED_DIR}"
        git config --global --add safe.directory "${MERGED_DIR}/src"
        git config --global --add safe.directory "${MERGED_DIR}/depot_tools"
