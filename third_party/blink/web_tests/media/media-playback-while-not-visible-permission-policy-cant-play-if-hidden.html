<!DOCTYPE html>
<title>Test behavior of HTMLMediaElements with the media-playback-while-not-rendered permission policy</title>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharnessreport.js"></script>
<body>
<script>
  internals.settings.setAutoplayPolicy('no-user-gesture-required');

  function hideFrame(iframe, type) {
    if (type === 'display') {
      iframe.style.setProperty('display', 'none');
    } else if (type === 'visibility') {
      iframe.style.setProperty('visibility', 'hidden');
    } else if (type === 'zeroSize') {
      iframe.style.setProperty('width', '0');
      iframe.style.setProperty('height', '0');
    }
  }

  function runCantPlayTest(mediaTag, mediaSrc, type) {
    async_test(function(t) {
      const iframe = document.createElement('iframe');
      iframe.allow = "media-playback-while-not-visible 'none'; autoplay *";
      // Hide the iframe before it is appended so it is hidden by the time the
      // media element is created.
      hideFrame(iframe, type);
      iframe.srcdoc = `<!DOCTYPE html><${mediaTag} loop></${mediaTag}>`;
      document.body.appendChild(iframe);
      t.add_cleanup(() => { document.body.removeChild(iframe); });

      iframe.onload = t.step_func(function() {
        const media = iframe.contentDocument.querySelector(mediaTag);
        media.src = mediaSrc;
        assert_true(media.paused);

        media.play().then(
            t.unreached_func("Unrendered media element should not be allowed to play."),
            (e) => {
              assert_true(e.name == 'NotAllowedError');
              t.done();
            });
      });
    }, `When media-playback-while-not-visible permission policy is set, ${mediaTag} elements in non-rendered iframes shouldn't be allowed to play (type = ${type})`);
  }

  const visibility_types = ['display', 'visibility', 'zeroSize'];
  for (const type of visibility_types) {
    runCantPlayTest('video', 'content/test.ogv', type);
    runCantPlayTest('audio', 'content/test.oga', type);
  }
</script>
</body>
