# Disable dangerous-triggers rule because this workflow uses pull_request_target
# to edit PR labels (pull-requests: write).
#
# The tvOS impact analysis checks out the PR's merge commit and runs `gn gen` on
# it, which executes scripts from the PR (GN exec_script). This is the same trust
# model as main.yaml, which builds PR merge commits on the same self-hosted
# runners, and is limited to PRs authored by committers (see check-author). The
# analysis job only has read permissions; labeling happens in a separate job
# that doesn't run PR code.
# actionlint: disable dangerous-triggers
name: Auto Label Kokoro

# tvos.yaml finds the run for its commit and event action by this name.
run-name: Auto Label Kokoro (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }} (${{ github.event.action }}))

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - staging
      - autoroll-chromium/main-to-staging
      - 'stack/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-author:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_committer: ${{ steps.check.outputs.is_committer }}
    steps:
      - name: Check whether the PR author is a collaborator/committer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          echo "Author '${PR_AUTHOR}' association: ${AUTHOR_ASSOC}"

          PERMISSION=$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Author '${PR_AUTHOR}' permission: ${PERMISSION}"

          if [[ "${AUTHOR_ASSOC}" == "OWNER" || "${AUTHOR_ASSOC}" == "MEMBER" || "${AUTHOR_ASSOC}" == "COLLABORATOR" || "${PERMISSION}" == "admin" || "${PERMISSION}" == "write" ]]; then
            echo "is_committer=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Author '${PR_AUTHOR}' is not a committer. Skipping tvOS impact analysis and auto-labeling."
            echo "is_committer=false" >> "${GITHUB_OUTPUT}"
          fi

  analyze-tvos-impact:
    needs: check-author
    if: github.event.pull_request.draft == false && needs.check-author.outputs.is_committer == 'true'
    runs-on: [self-hosted, chrobalt-linux-runner]
    permissions:
      contents: read
    timeout-minutes: 20
    container:
      image: ghcr.io/youtube/cobalt/linux:main
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /runner-cache:/runner-cache
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    outputs:
      affects_tvos: ${{ steps.analyze.outputs.affects_tvos }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            cobalt/build

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Prepare OverlayFS Workspace
        uses: ./.github/actions/overlay_workspace
        with:
          path: cobalt
          use_gcloud: true

      # Checks out the base branch tip, which is in the cache. The PR's merge
      # commit is fetched on top of it below.
      - name: Checkout
        uses: ./.github/actions/checkout
        with:
          path: cobalt/src
          ref: ${{ github.sha }}
          fetch_depth: 1
          use_cache: true

      # In pull_request_target, github.sha is the base branch tip, and GitHub
      # updates refs/pull/<num>/merge asynchronously, so wait until it merges
      # the current PR head. Failing here labels the PR (see label-kokoro-run).
      - name: Check Out PR Merge Commit
        working-directory: cobalt/src
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in {1..6}; do
            if git fetch --no-tags --depth=2 origin "refs/pull/${PR_NUMBER}/merge" &&
               [[ "$(git rev-parse FETCH_HEAD^2)" == "${PR_HEAD_SHA}" ]]; then
              git checkout --detach FETCH_HEAD
              git diff --name-only --no-renames HEAD^1 HEAD | tee "${RUNNER_TEMP}/changed_files.txt"
              exit 0
            fi
            sleep 10
          done
          echo "::error::refs/pull/${PR_NUMBER}/merge doesn't merge ${PR_HEAD_SHA}. The PR may have merge conflicts."
          exit 1

      - name: Check tvOS Build Impact
        id: analyze
        working-directory: cobalt/src
        env:
          TEST_TARGETS: ${{ steps.parse-targets.outputs.test_targets_json }}
          # Changes that gn analyze can't see but always affect the tvOS build.
          ALWAYS_AFFECTS_TVOS: ^(DEPS$|\.gn$|build/|build_overrides/|cobalt/build/|cobalt/devinfra/kokoro/|cobalt/testing/filters/tvos-arm64-simulator/|\.github/workflows/(tvos|auto_label_kokoro)\.yaml$)
          HEADERS: \.(h|hh|hpp|inc|inl|def)$
        run: |
          export PATH="/runner-cache/golden-workspace/depot_tools:${GITHUB_WORKSPACE}/cobalt/depot_tools:${PATH}"
          changed_files="${RUNNER_TEMP}/changed_files.txt"
          if grep -qE "${ALWAYS_AFFECTS_TVOS}" "${changed_files}"; then
            echo "affects_tvos=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          out_dir="${RUNNER_TEMP}/tvos_out"
          script_executable="--script-executable=${PWD}/cobalt/build/tvos_linux_script_wrapper.py"
          python3 cobalt/build/gn.py "${out_dir}" -p tvos-arm64-simulator -C devel --no-rbe --no-check "${script_executable}"

          {
            cat "${changed_files}"
            echo
            # gn analyze only knows the headers listed in BUILD.gn files, so
            # also pass the files that include each changed header by its path.
            { grep -E "${HEADERS}" "${changed_files}" || true; } | while read -r header; do
              git grep -lF "\"${header}\"" -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.m' '*.mm' '*.h' '*.hh' '*.hpp' '*.inc' '*.inl' '*.def' || true
            done
          } | jq -nR --argjson test_targets "${TEST_TARGETS}" '{
            files: [inputs | select(length > 0) | "//" + .] | unique,
            test_targets: [$test_targets[] | "//" + .],
            additional_compile_targets: ["//cobalt:cobalt"]
          }' > "${out_dir}/analyze_in.json"
          cat "${out_dir}/analyze_in.json"

          gn analyze "${out_dir}" "${out_dir}/analyze_in.json" "${out_dir}/analyze_out.json" "${script_executable}"
          cat "${out_dir}/analyze_out.json"
          # Anything other than "No dependency" (e.g., an error) affects tvOS.
          if [[ "$(jq -r '.status' "${out_dir}/analyze_out.json")" == "No dependency" ]]; then
            echo "affects_tvos=false" >> "${GITHUB_OUTPUT}"
          else
            echo "affects_tvos=true" >> "${GITHUB_OUTPUT}"
          fi

  label-kokoro-run:
    needs: [check-author, analyze-tvos-impact]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Fails safe: also labels when the analysis job didn't succeed (e.g., the
    # runner or checkout failed, or it timed out).
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.check-author.outputs.is_committer == 'true' &&
      (needs.analyze-tvos-impact.result != 'success' ||
       needs.analyze-tvos-impact.outputs.affects_tvos == 'true')
    steps:
      - name: Apply kokoro:run label to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          ANALYZE_RESULT: ${{ needs.analyze-tvos-impact.result }}
        run: |
          if [[ "${ANALYZE_RESULT}" != "success" ]]; then
            echo "tvOS impact analysis result: ${ANALYZE_RESULT}. Defaulting to running the tvOS build."
          fi
          if ! echo "$PR_LABELS" | jq -e '.[] | select(.name == "kokoro:run")' > /dev/null; then
            echo "Applying kokoro:run label..."
            gh pr edit "$PR_URL" --add-label "kokoro:run"
          else
            echo "kokoro:run label is already present."
          fi
