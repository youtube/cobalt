name: Label Cherry Pick

on:
  pull_request_target:
    types:
      - labeled
      - closed

permissions:
  contents: read

jobs:
  prepare_branch_list:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.merge_commit_sha != null
    permissions:
      pull-requests: write
    outputs:
      target_branch: ${{ steps.set-branches.outputs.target_branch }}
    steps:
      - name: Auto-label PR
        uses: actions/labeler@v5
        if: github.event.pull_request.merged == true && github.base_ref == 'main'
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/config/infra/auto_cherry.yml

      - name: Set Branches
        id: set-branches
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ${EVENT_ACTION} == 'closed' ]]; then
            # Fetch live labels from the API to include auto-added ones
            labels=$(gh pr view ${PR_NUMBER} --repo ${GITHUB_REPOSITORY} --json labels --jq '.labels[].name')
          else
            # Or get the label that was added on the merged PR.
            labels=${LABEL_NAME}
          fi

          # This list must contain all cherry-pick destinations as file is used for all branches.
          branches=("main" "26.eap" "26.android" "25.lts.1+" "24.lts.1+" "23.lts.1+" "22.lts.1+" "21.lts.1+" "20.lts.1+" "19.lts.1+" "rc_11" "COBALT_9")
          filtered_branches=()
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "${BASE_REF}" ]]; then
              continue
            fi
            if [[ "${labels}" =~ "cp-${branch}" ]]; then
              filtered_branches+=("${branch}")
            fi
          done

          echo "target_branch=$(echo -n "${filtered_branches[@]}" | jq -cRs 'split(" ")')" >> "${GITHUB_OUTPUT}"

  cherry_pick:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: prepare_branch_list
    if: needs.prepare_branch_list.outputs.target_branch != '[]'
    strategy:
      matrix:
        target_branch: ${{ fromJson(needs.prepare_branch_list.outputs.target_branch) }}
    env:
      ACCESS_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      CHERRY_PICK_BRANCH: cherry-pick-${{ matrix.target_branch }}-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 30
        with:
          ref: ${{ matrix.target_branch }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Release Automation"
          git config --global user.email "github@google.com"

      - name: Cherry pick merge commit
        id: cherry-pick
        continue-on-error: true
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
        run: |
          set -x
          git fetch origin "${TARGET_BRANCH}"

          set +e
          # Select the first parent as the mainline tree. This is necessary if
          # the commit has multiple parents as the cherry-pick will fail otherwise.
          git cherry-pick -x --mainline=1 ${MERGE_COMMIT_SHA}
          RES=$?
          set -e
          if [ ${RES} -ne 0 ]; then
            # If the cherry pick failed due to a merge conflict we can
            # add the conflicting file and create the commit anyway.
            git add --sparse .
            git cherry-pick --continue
          fi
          exit ${RES}

      - name: Create Pull Request
        id: create-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@2b011faafdcbc9ceb11414d64d0573f37c774b04 # v4.2.3
        with:
          token: ${{ secrets.CHERRY_PICK_TOKEN }}
          draft: ${{ steps.cherry-pick.outcome == 'failure' }}
          base: ${{ matrix.target_branch }}
          branch: ${{ env.CHERRY_PICK_BRANCH }}
          committer: GitHub Release Automation <github@google.com>
          reviewers: |
            ${{ github.event.pull_request.user.login }}
            ${{ github.actor }}
          title: "Cherry pick PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          body: |
            Refer to the original PR: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            ${{ github.event.pull_request.body }}

      - name: Comment on failure
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          CHERRY_PICK_OUTCOME: ${{ steps.cherry-pick.outcome }}
        with:
          github-token: ${{ secrets.CHERRY_PICK_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER;
            const outcome = process.env.CHERRY_PICK_OUTCOME;
            const branch = process.env.CHERRY_PICK_BRANCH;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const treeUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${branch}`;

            if (!prNumber) {
              // Comment on the originating PR if creating a cherry pick PR failed.
              github.rest.issues.createComment({
                issue_number: context.payload.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `> [!CAUTION]\n> Creating the cherry pick PR failed! Check the log at ${runUrl} for details.`
              });
            } else if (outcome === 'failure') {
              // Comment on the new PR if the cherry pick failed.
              github.rest.issues.createComment({
                issue_number: parseInt(prNumber, 10),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `![MERGE CONFLICT CAT](https://services.google.com/fh/files/misc/merge_conflict_cat.png)\n> [!CAUTION]\n> There were merge conflicts while cherry picking! Check out [${branch}](${treeUrl}) and fix the conflicts before proceeding. Check the log at ${runUrl} for details.`
              });
            }
