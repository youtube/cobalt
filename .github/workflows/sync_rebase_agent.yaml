name: Sync Staging to Shadow Branch

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync staging into experimental/staging_shadow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.CHERRY_PICK_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fast-forward / Merge staging into experimental/staging_shadow
        run: |
          set -x
          git config user.name "cobalt-github-releaser-bot"
          git config user.email "cobalt-github-releaser-bot@google.com"

          git fetch origin experimental/staging_shadow:experimental/staging_shadow || true
          git checkout experimental/staging_shadow
          git merge origin/staging --no-edit -m "ci: sync staging into experimental/staging_shadow"
          git push origin experimental/staging_shadow
