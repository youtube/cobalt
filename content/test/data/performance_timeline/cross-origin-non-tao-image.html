<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: Expose cross-origin non-TAO images renderTime.
</title>

<body>
  <script>
    const getStartTime = async (type, name) => {
      return await new Promise(resolve => {
        new PerformanceObserver((entryList, observer) => {
          resolve(entryList.getEntriesByName(name)[0].startTime);
          observer.disconnect();
        }).observe({ type: type, buffered: true });
      });
    };
  </script>

  <img src='/cross-site/b.com/single_face.jpg' id='image_id' />
</body>
