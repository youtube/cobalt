name: golden_workspace

# Publishes "golden workspace" snapshots (a fully synced, pristine checkout of
# this repository at the tip of main, plus depot_tools) to GCS. CI runners use
# them to warm their OverlayFS lower dir instead of running a cold gclient
# sync. One snapshot is produced per .gclient profile; see
# .github/scripts/golden_workspace.sh for the profile <-> platform mapping.
#
# This workflow must only ever run from `main`, never from pull requests. The
# consumer (.github/actions/overlay_workspace) independently verifies every
# snapshot against github.com before using it and falls back to a cold
# workspace otherwise, so a bad or missing snapshot can only cost time.

on:
  push:
    branches:
      - main
    paths:
      - DEPS
      - .gitmodules
      - .github/scripts/golden_workspace.sh
      - .github/workflows/golden_workspace.yaml
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest main commit matters; drop in-flight runs for older ones.
  group: golden-workspace-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.profile }}
    if: github.repository == 'youtube/cobalt' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, chrobalt-linux-runner]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - android
          - evergreen-arm64
          - evergreen-arm
          - android-evergreen-arm64
          - android-evergreen-arm
    env:
      DEPOT_TOOLS_UPDATE: '0'
      GW_GCS_PREFIX: gs://cobalt-actions-prod-test-artifacts/golden-workspace
      GW_PROFILE: ${{ matrix.profile }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Only the publishing tooling is taken from this checkout. The snapshot
      # itself is cloned fresh from github.com inside the script.
      - name: Checkout tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/actions/gob_auth
            .github/scripts/golden_workspace.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate with GCP
        uses: ./.github/actions/gob_auth
        with:
          use_gcloud: true

      - name: Produce snapshot
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/golden_workspace.sh produce "${GITHUB_SHA}" "${RUNNER_TEMP}/golden-workspace" "${GW_PROFILE}"

      - name: Upload snapshot
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/golden_workspace.sh upload "${GITHUB_SHA}" "${RUNNER_TEMP}/golden-workspace" "${GW_PROFILE}"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/golden-workspace" "${RUNNER_TEMP}/golden-workspace.staging"
