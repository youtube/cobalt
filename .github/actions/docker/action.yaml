name: Docker Image Build
description: Builds Cobalt build docker images.
inputs:
  docker_service:
    description: "Docker compose service."
    required: true
  is_pr:
    description: "True if the event is a pull request from a forked repository."
    required: true
  docker_content_sha:
    description: "The git hash for the latest docker related changes."
    required: true
  github_token:
    description: "The github token."
    required: true
outputs:
  docker_tag:
    description: "The full docker image tag."
    value: ${{ steps.pull-cached-image.outputs.docker_tag }}
runs:
  using: "composite"
  steps:
    - name: Set up Cloud SDK
      uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6 # v1.1.1
      if: inputs.is_pr == 'true'

    - name: Login to GAR
      env:
        IS_PR: ${{ inputs.is_pr }}
      run: |
        # Login to GAR
        TOKEN_ENDPOINT="http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
        ACCESS_TOKEN=$(curl -H 'Metadata-Flavor: Google' "${TOKEN_ENDPOINT}" | jq -r .access_token)

        # Login to GAR to be able to push images created by fork based PR workflows.
        if [[ "${IS_PR}" == "true" ]]; then
          printf "%s" "${ACCESS_TOKEN}" | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
        fi

        # Login to Marketplace GAR to be able to pull base images.
        printf "%s" "${ACCESS_TOKEN}" | docker login -u oauth2accesstoken --password-stdin https://marketplace.gcr.io
      shell: bash

    - name: Login to GitHub Docker Registry
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Pull or Build Docker Image
      id: pull-cached-image
      env:
        BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        GITHUB_DOCKER_REGISTRY_URL: ghcr.io
        PR_DOCKER_REGISTRY_URL: us-central1-docker.pkg.dev
        DOCKER_SERVICE: ${{ inputs.docker_service }}
        DOCKER_CONTENT_SHA: ${{ inputs.docker_content_sha }}
        IS_PR: ${{ inputs.is_pr }}
      run: |
        set -euo pipefail

        digest() {
          docker manifest inspect --verbose "$1" 2>/dev/null |
            jq -r '(if type == "array" then map(select(.Descriptor.platform.architecture != "unknown"))[0] else . end) | (.SchemaV2Manifest.config.digest // .OCIManifest.config.digest // empty)' || true
        }

        # 1. Resolve cached image in GHCR (with GAR fallback for fork PRs).
        DOCKER_COMPOSE_IMAGE="${GITHUB_DOCKER_REGISTRY_URL}/${GITHUB_REPOSITORY,,}/${DOCKER_SERVICE}"
        IMAGE_SHA="${DOCKER_COMPOSE_IMAGE}:${DOCKER_CONTENT_SHA}"
        SHA_DIGEST=$(digest "${IMAGE_SHA}")
        if [[ -z "${SHA_DIGEST}" && "${IS_PR}" == "true" ]]; then
          DOCKER_COMPOSE_IMAGE="${PR_DOCKER_REGISTRY_URL}/$(gcloud config get-value project)/github/${DOCKER_SERVICE}"
          IMAGE_SHA="${DOCKER_COMPOSE_IMAGE}:${DOCKER_CONTENT_SHA}"
          SHA_DIGEST=$(digest "${IMAGE_SHA}")
        fi
        echo "docker_tag=${IMAGE_SHA}" >> "${GITHUB_OUTPUT}"
        echo "Resolved ${IMAGE_SHA} (${SHA_DIGEST:-cache miss})"

        # 2. Build and push only :<docker_content_sha> (never --all-tags) on cache miss.
        if [[ -z "${SHA_DIGEST}" ]]; then
          export DOCKER_COMPOSE_IMAGE
          docker compose build "${DOCKER_SERVICE}"
          docker tag "${DOCKER_COMPOSE_IMAGE}" "${IMAGE_SHA}"
          for _ in 1 2 3 4 5; do
            SHA_DIGEST=$(digest "${IMAGE_SHA}")
            if [[ -n "${SHA_DIGEST}" ]]; then break; fi
            if docker push "${IMAGE_SHA}"; then
              SHA_DIGEST=$(digest "${IMAGE_SHA}")
              if [[ -n "${SHA_DIGEST}" ]]; then break; fi
            fi
            sleep $((RANDOM % 5 + 2))
          done
          [[ -n "${SHA_DIGEST}" ]] || { echo "::error::Failed to push ${IMAGE_SHA}"; exit 1; }
        fi

        # 3. Sync floating branch tag (e.g. :main, :27.lts) on non-PR runs (single-arch linux/amd64).
        if [[ "${IS_PR}" != "true" ]]; then
          FLOATING_TAG="${GITHUB_REF_NAME//\//__}"
          FLOATING_TAG="${FLOATING_TAG%.1[+,-]}"
          IMAGE_FLOATING="${DOCKER_COMPOSE_IMAGE}:${FLOATING_TAG}"
          if [[ -n "${FLOATING_TAG}" && "$(digest "${IMAGE_FLOATING}")" != "${SHA_DIGEST}" ]]; then
            docker pull "${IMAGE_SHA}"
            docker tag "${IMAGE_SHA}" "${IMAGE_FLOATING}"
            SHA_DIGEST=$(digest "${IMAGE_SHA}")
            synced=false
            for _ in 1 2 3 4 5; do
              if [[ -n "${SHA_DIGEST}" && "$(digest "${IMAGE_FLOATING}")" == "${SHA_DIGEST}" ]] || docker push "${IMAGE_FLOATING}"; then
                synced=true
                break
              fi
              sleep $((RANDOM % 5 + 2))
              SHA_DIGEST=$(digest "${IMAGE_SHA}")
            done
            [[ "${synced}" == "true" ]] || { echo "::error::Failed to sync ${IMAGE_FLOATING}"; exit 1; }
          fi
        fi
      shell: bash
