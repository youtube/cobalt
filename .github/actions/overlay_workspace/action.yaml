name: OverlayFS Workspace Layer
description: Layers a pre-warmed golden workspace using fuse-overlayfs for zero-copy, instant checkouts.

inputs:
  path:
    # TODO: Verify destination path changes / remove temporary test modifications before production
    description: Destination path (e.g. cobalt).
    required: true
  platform:
    description: Target platform for platform-specific golden snapshot.
    default: ''
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'
  target_os:
    description: "Target OS for gclient (linux, android, ios)."
    default: 'linux'

outputs:
  cache_hit:
    description: "Whether the golden workspace cache was hit on the node SSD."
    value: ${{ steps.resolve-snapshot.outputs.cache_hit }}

runs:
  using: "composite"
  steps:
    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Clean Stale Mounts and Workspaces
      id: cleanup
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"
        # Clean up stale mounts and reclaim space from finished or cancelled jobs
        fusermount3 -u -z "${MERGED_DIR}" 2>/dev/null || fusermount -u -z "${MERGED_DIR}" 2>/dev/null || umount -l "${MERGED_DIR}" 2>/dev/null || true
        rm -rf /runner-cache/workspaces/*

    - name: Purge Legacy Unpartitioned Golden Workspace
      id: purge-legacy
      shell: bash
      run: |
        # Purge legacy golden workspace without version marker
        if [ -w "/runner-cache" ] && [ ! -f "/runner-cache/golden-workspace/.version_v2" ]; then
          echo "Notice: Purging legacy golden workspace..."
          rm -rf /runner-cache/golden-workspace
          mkdir -p /runner-cache/golden-workspace
          touch /runner-cache/golden-workspace/.version_v2
        fi

    - name: Check SSD Cache Hit
      id: detect-cache
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        TARGET_OS: ${{ inputs.target_os }}
      run: |
        cache_hit=false
        SRC_DIR="/runner-cache/golden-workspace/src"
        GCLIENT_DIR="/runner-cache/golden-workspace/gclient/${TARGET_OS}"
        if [ -d "${SRC_DIR}/src/.git" ] && cmp -s DEPS "${SRC_DIR}/src/DEPS" && \
           [ -d "${GCLIENT_DIR}" ] && cmp -s DEPS "${GCLIENT_DIR}/src/DEPS"; then
          cache_hit=true
        fi
        echo "cache_hit=${cache_hit}" >> "${GITHUB_OUTPUT}"

        echo "Logging workspace cache status to Cloud Logging..."
        LOG_PAYLOAD=$(jq -n \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg job "${GITHUB_JOB}" \
          --arg runner "${RUNNER_NAME:-runner}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg platform "${PLATFORM}" \
          --arg target_os "${TARGET_OS}" \
          --argjson cache_hit "${cache_hit}" \
          '{workflow: $workflow, job: $job, runner: $runner, run_id: $run_id, url: $url, platform: $platform, target_os: $target_os, cache_hit: $cache_hit}')
        gcloud logging write github-actions-runners "${LOG_PAYLOAD}" --payload-type=json || true

    - name: Hydrate Snapshot from GCS
      id: hydrate-snapshot
      if: inputs.target_os != 'ios'
      shell: bash
      env:
        TARGET_OS: ${{ inputs.target_os }}
        MAX_HISTORY_COMMITS: 200
      run: |
        if [ ! -w "/runner-cache" ]; then
          exit 0
        fi

        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        BUCKET="$(gcloud config get-value project)-test-artifacts/golden-workspace"

        for key in "src" "gclient/${TARGET_OS}"; do
          LOWER_DIR="/runner-cache/golden-workspace/${key}"
          REF="refs/remotes/origin/golden-workspace/${key}"

          git fetch -q origin "+refs/golden-workspace/${key}:${REF}" || true
          EXPECTED=$(git log -1 --format=%s "${REF}" || true)

          if [ -f "${LOWER_DIR}/.digest" ]; then
            LOCAL_DIGEST=$(cat "${LOWER_DIR}/.digest")
            if [ -n "${LOCAL_DIGEST}" ] && git log -n "${MAX_HISTORY_COMMITS}" --format=%s "${REF}" | grep -Fxq "${LOCAL_DIGEST}"; then
              echo "Golden workspace for ${key} on SSD is valid (${LOCAL_DIGEST:0:12})."
              if cmp -s DEPS "${LOWER_DIR}/src/DEPS" || [ "${LOCAL_DIGEST}" = "${EXPECTED}" ]; then
                continue
              fi
              echo "Notice: DEPS differs from the SSD snapshot; fetching latest (${EXPECTED:0:12})..."
            else
              echo "Notice: Golden workspace for ${key} on SSD is stale or unverified; re-hydrating..."
              rm -rf "${LOWER_DIR}"
            fi
          fi

          if [ -z "${EXPECTED}" ]; then
            echo "Notice: No golden workspace snapshot ref found for ${key}."
            continue
          fi

          STAGING_DIR="/runner-cache/staging.${key//\//_}.$$"
          trap 'rm -rf "${STAGING_DIR}"' EXIT

          echo "Downloading, extracting, and verifying golden workspace for ${key} (${EXPECTED:0:12})..."
          rm -rf "${STAGING_DIR}" && mkdir -p "${STAGING_DIR}"
          COMPUTED=$( (gcloud storage cat "gs://${BUCKET}/${key}/${EXPECTED}.tar.zst" \
            | tee /dev/fd/3 \
            | tar --no-same-owner --use-compress-program="zstd -d -T0" -xf - -C "${STAGING_DIR}") \
            | sha256sum | awk '{print $1}') || true
          wait || true

          if [ "${COMPUTED}" != "${EXPECTED}" ]; then
            echo "::warning::Golden workspace checksum verification failed for ${key}!"
            rm -rf "${STAGING_DIR}"
            continue
          fi

          if [ -d "${STAGING_DIR}/src/.git" ]; then
            git -C "${STAGING_DIR}/src" update-index --refresh -q || true
          fi

          echo "${EXPECTED}" > "${STAGING_DIR}/.digest"
          mkdir -p "$(dirname "${LOWER_DIR}")"
          rm -rf "${LOWER_DIR}"
          mv "${STAGING_DIR}" "${LOWER_DIR}"
          echo "Extracted and verified golden workspace for ${key} to ${LOWER_DIR}"
        done

    - name: Resolve Active Snapshot Directory
      id: resolve-snapshot
      shell: bash
      env:
        TARGET_OS: ${{ inputs.target_os }}
        SSD_CACHE_HIT: ${{ steps.detect-cache.outputs.cache_hit }}
      run: |
        SRC_DIR="/runner-cache/golden-workspace/src"
        GCLIENT_DIR="/runner-cache/golden-workspace/gclient/${TARGET_OS}"
        lower_dirs=()

        if [ -d "${GCLIENT_DIR}" ]; then
          if cmp -s DEPS "${GCLIENT_DIR}/src/DEPS"; then
            lower_dirs+=("${GCLIENT_DIR}")
          else
            echo "Notice: DEPS differs from the golden gclient snapshot. Skipping gclient overlay."
          fi
        fi
        if [ -d "${SRC_DIR}/src/.git" ]; then
          lower_dirs+=("${SRC_DIR}")
        fi

        if [ "${#lower_dirs[@]}" -ge 1 ]; then
          lower_dir=$(IFS=:; echo "${lower_dirs[*]}")
          echo "lower_dir=${lower_dir}" >> "${GITHUB_OUTPUT}"
          if [ "${#lower_dirs[@]}" -eq 2 ]; then
            echo "cache_hit=${SSD_CACHE_HIT}" >> "${GITHUB_OUTPUT}"
          else
            echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          fi
        else
          echo "lower_dir=" >> "${GITHUB_OUTPUT}"
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          echo "Golden workspace not found on SSD or GCS. Proceeding with cold workspace."
        fi

    - name: Mount OverlayFS Layer
      if: steps.resolve-snapshot.outputs.lower_dir != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        LOWER_DIR: ${{ steps.resolve-snapshot.outputs.lower_dir }}
      run: |
        SESSION_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RUNNER_NAME:-runner}"
        UPPER_DIR="/runner-cache/workspaces/${SESSION_ID}/upper"
        WORK_DIR="/runner-cache/workspaces/${SESSION_ID}/work"
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"

        mkdir -p "${UPPER_DIR}" "${WORK_DIR}" "${MERGED_DIR}"

        echo "Mounting OverlayFS (${LOWER_DIR}) to ${MERGED_DIR}..."
        fuse-overlayfs -o lowerdir="${LOWER_DIR}",upperdir="${UPPER_DIR}",workdir="${WORK_DIR}" "${MERGED_DIR}"

        git config --global --add safe.directory "${MERGED_DIR}"
        git config --global --add safe.directory "${MERGED_DIR}/src"
        git config --global --add safe.directory "${MERGED_DIR}/depot_tools"

        echo "UPPER_DIR=${UPPER_DIR}" >> "${GITHUB_ENV}"
        echo "SRC_DIR=${LOWER_DIR##*:}" >> "${GITHUB_ENV}"

        echo "UPPER_DIR=${UPPER_DIR}" >> "${GITHUB_ENV}"
        echo "SRC_DIR=${LOWER_DIR##*:}" >> "${GITHUB_ENV}"
