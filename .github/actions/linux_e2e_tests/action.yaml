name: Linux E2E Tests
description: Runs Cobalt Lifecycle and Preload E2E integration tests on Linux under xvfb.
inputs:
  platform:
    description: "The platform target (e.g. linux-x64x11-modular, evergreen-x64)."
    required: true
  config:
    description: "The build configuration (e.g. qa, devel)."
    required: false
    default: "qa"
  test_artifacts_key:
    description: "Artifact key used to download test binaries if running as a separate job."
    required: false
    default: ""
  test_results_key:
    description: "Artifact key used to store test results."
    required: false
    default: "linux_e2e_results"

runs:
  using: "composite"
  steps:
    - name: Download Artifacts
      if: inputs.test_artifacts_key != ''
      uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
      with:
        name: ${{ inputs.test_artifacts_key }}
        path: artifacts

    - name: Extract Artifacts
      if: inputs.test_artifacts_key != ''
      shell: bash
      run: |
        set -x
        SRC_DIR="${GITHUB_WORKSPACE}"
        if [[ -d "${GITHUB_WORKSPACE}/cobalt/src" ]]; then
          SRC_DIR="${GITHUB_WORKSPACE}/cobalt/src"
        fi
        out_dir="${SRC_DIR}/out/${{ inputs.platform }}_${{ inputs.config }}"
        if [[ -f "artifacts/e2e_artifacts.tar.zstd" ]]; then
          tar -I 'zstd -T0' -xf artifacts/e2e_artifacts.tar.zstd -C "${SRC_DIR}"
        elif [[ -f "artifacts/test_artifacts.tar.zstd" ]]; then
          tar -I 'zstd -T0' -xf artifacts/test_artifacts.tar.zstd -C "${SRC_DIR}"
        fi

    - name: Run Linux E2E Tests
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        CONFIG: ${{ inputs.config }}
        XVFB_SERVER_ARGS: "-screen 0 1920x1080x24i +render +extension GLX -noreset"
        ASAN_OPTIONS: "exitcode=0:detect_leaks=0"
      run: |
        set -euxo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/results"

        # Determine source tree root
        SRC_DIR="${GITHUB_WORKSPACE}"
        if [[ -d "${GITHUB_WORKSPACE}/cobalt/src" ]]; then
          SRC_DIR="${GITHUB_WORKSPACE}/cobalt/src"
        fi
        cd "${SRC_DIR}"

        out_dir="${SRC_DIR}/out/${PLATFORM}_${CONFIG}"
        if [ -n "${LD_LIBRARY_PATH:-}" ]; then
          export LD_LIBRARY_PATH="${out_dir}/starboard:${out_dir}:${LD_LIBRARY_PATH}"
        else
          export LD_LIBRARY_PATH="${out_dir}/starboard:${out_dir}"
        fi

        # Ensure binaries have executable permissions
        chmod +x "${out_dir}/cobalt_loader" 2>/dev/null || true
        chmod +x "${out_dir}/loader_app" 2>/dev/null || true
        chmod +x "${out_dir}/elf_loader_sandbox" 2>/dev/null || true

        set +e
        xvfb-run -a --server-args="${XVFB_SERVER_ARGS}" \
          python3 cobalt/tools/test_lifecycle_e2e.py \
            --platform "${PLATFORM}" \
            --config "${CONFIG}" \
            --out-dir "${out_dir}" 2>&1 | tee "${GITHUB_WORKSPACE}/results/e2e_${PLATFORM}_${CONFIG}_log.txt"
        test_exit_code=${PIPESTATUS[0]}
        cp preload_run.log lifecycle_run.log "${GITHUB_WORKSPACE}/results/" 2>/dev/null || true
        exit ${test_exit_code}


    - name: Archive E2E Test Results
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: ${{ inputs.test_results_key }}
        path: ${{ github.workspace }}/results/*
