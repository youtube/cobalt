name: Generate Retry Filter
description: Generates and uploads retry test filter for failed tests.
inputs:
  target_name:
    description: "The test target name."
    required: true
  test_results_key:
    description: "Artifact key used to upload the retry filter."
    required: true
  outcome:
    description: "The outcome of the test results step."
    required: false
    default: "success"
  results_dir:
    description: "Directory where test results are located."
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - name: Generate Retry Filter
      env:
        TEST_TARGET: ${{ inputs.target_name }}
        OUTCOME: ${{ inputs.outcome }}
        RESULTS_DIR: ${{ inputs.results_dir }}
      run: |
        set -ex
        TEST_TARGET="${TEST_TARGET#*:}"
        FILTER_DIR="${GITHUB_WORKSPACE}/retry_filters_artifact/retry_filters"
        rm -rf "${GITHUB_WORKSPACE}/retry_filters_artifact"
        mkdir -p "${FILTER_DIR}"

        generate_filter_file() {
          local output_file="$1"
          shift
          local xml_files=("$@")

          # Check if any XML file has an associated crash marker file.
          for xml_file in "${xml_files[@]}"; do
            if [ -f "${xml_file%.xml}.crash" ]; then
              return 0
            fi
          done

          local raw_filter
          raw_filter=$(python3 cobalt/tools/junit_mini_parser.py \
            --format=filter "${xml_files[@]}" || true)

          # If target failed but no failing tests were identified (e.g. runner crash or timeout),
          # do not write a filter so the original test set is retried.
          if [ "${OUTCOME}" != "success" ] && [ "${raw_filter}" = "-*" ]; then
            return 0
          fi

          if [ -n "${raw_filter}" ]; then
            echo "${raw_filter}" > "${output_file}"
          fi
        }

        shopt -s globstar nullglob
        xml_files=("${RESULTS_DIR}"/**/"${TEST_TARGET}"*.xml)
        if [ ${#xml_files[@]} -gt 0 ]; then
          # Generate global filter
          generate_filter_file "${FILTER_DIR}/${TEST_TARGET}.filter" "${xml_files[@]}"

          # Also generate shard-specific filter files if shards exist
          for xml_file in "${xml_files[@]}"; do
            if [[ "${xml_file}" =~ /shard_([0-9]+)/ ]]; then
              shard_id="${BASH_REMATCH[1]}"
              generate_filter_file "${FILTER_DIR}/${TEST_TARGET}_${shard_id}.filter" "${xml_file}"
            fi
          done
        fi
      shell: bash
    - name: Upload Retry Filter
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: ${{ inputs.test_results_key }}_retry_filter_${{ inputs.target_name }}
        path: retry_filters_artifact/
        if-no-files-found: ignore
        overwrite: true
