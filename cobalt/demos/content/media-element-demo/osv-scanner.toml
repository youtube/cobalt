# OSV-Scanner configuration for cobalt/demos/content/media-element-demo
#
# Context:
# The media-element-demo is an isolated demonstration and test web application
# used to verify HTML5 <video> and MediaSource API behavior in Cobalt.
# The 54 vulnerabilities suppressed below reside in build-time tooling (webpack,
# copy-webpack-plugin, terser-webpack-plugin, ts-loader) and local dev server
# utilities (http-server, portfinder).
#
# Reachability Analysis:
# 1. Non-production / standalone demo: This package is an optional developer demo,
#    never deployed to production or bundled into shipping Cobalt runtime binaries.
# 2. Transitive build and local dev tooling only: All affected libraries are
#    transitive devDependencies used during local compilation or local testing
#    on localhost. None of them are bundled into the client runtime distribution
#    (dist/bundle.js), which only incorporates demo player logic and bluebird.
# 3. No untrusted input exposure: Build scripts execute offline on trusted local
#    sources; the local dev server serves static files and does not handle untrusted
#    external network queries, outbound redirects with credentials, or untrusted archives.
# 4. Zero attack surface: The vulnerable code paths are completely unreachable in
#    both local demo execution and Cobalt production environments.

