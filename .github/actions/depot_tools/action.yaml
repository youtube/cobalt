name: Set Up Depot Tools
description: Sets up Depot Tools and initializes gclient. Optionally performs checkout and uses git cache.

inputs:
  run_sync:
    description: Whether or not to run gclient sync.
    default: 'true'
  rbe_instance:
    description: The RBE instance to use.
    default: projects/cobalt-actions-prod/instances/default_instance
  use_cache:
    description: Whether or not to use runner cache.
    default: 'true'
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'
  platform:
    description: "The platform for which to publish the golden snapshot."
    default: ''
  target_os:
    description: "Target OS for gclient (linux, android, ios)."
    default: ''
  target_cpu:
    description: "Target CPU(s) for gclient (e.g. ['x64', 'arm64'])."
    default: ''
  publish_golden:
    description: "Whether this platform publishes golden workspace snapshots."
    default: 'false'
  publish_src:
    description: "Whether to publish the universal src layer snapshot."
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set Cache Path
      id: cache-path
      shell: bash
      env:
        USE_CACHE: ${{ inputs.use_cache }}
      run: |
        if [[ "${USE_CACHE}" == "true" ]] && [[ -w "/runner-cache" ]]; then
          echo "path=/runner-cache" >> ${GITHUB_OUTPUT}
        else
          echo "path=" >> ${GITHUB_OUTPUT}
        fi

    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Clone Depot Tools
      uses: ./.github/actions/checkout
      with:
        repository: https://chromium.googlesource.com/chromium/tools/depot_tools.git
        # TODO(b/562551706): Pinned before upstream 20aff01e (2026-09-16), which added
        # `--end-of-options` to `git checkout`. Need to update git on runners.
        ref: 4a978d8f1f3567d5bd729aec018bfc345a14e1cd
        fetch_depth: 0
        path: cobalt/depot_tools
        use_cache: ${{ inputs.use_cache }}

    - name: Add Depot Tools to PATH
      run: |
        echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"
        echo "${GITHUB_WORKSPACE}/cobalt/depot_tools" >> "${GITHUB_PATH}"
      shell: bash

    - name: Set CIPD and VPython Cache Directories
      if: steps.cache-path.outputs.path != ''
      env:
        CACHE_PATH: ${{ steps.cache-path.outputs.path }}
      run: |
        mkdir -p "${CACHE_PATH}/cipd-cache" "${CACHE_PATH}/vpython"
        echo "CIPD_CACHE_DIR=${CACHE_PATH}/cipd-cache" >> "${GITHUB_ENV}"
        echo "VPYTHON_VIRTUALENV_ROOT=${CACHE_PATH}/vpython" >> "${GITHUB_ENV}"
      shell: bash

    - name: Bootstrap Bundled python3
      run: |
        # Must be run manually as ${DEPOT_TOOLS_UPDATE} is 0 in CI, skipping the bootstrap.
        source "${GITHUB_WORKSPACE}/cobalt/depot_tools/bootstrap_python3" && bootstrap_python3
      shell: bash

    - name: Disable Chromium client side build telemetry
      run: build_telemetry opt-out
      shell: bash

    - name: Run gclient config
      env:
        RBE_INSTANCE: ${{ inputs.rbe_instance }}
        REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        TARGET_OS: ${{ inputs.target_os }}
        TARGET_CPU: ${{ inputs.target_cpu }}
      run: |
        set -x
        cd cobalt

        if [ ! -f .gclient ]; then
          gclient config \
            --name=src \
            --custom-var="rbe_instance=\"${RBE_INSTANCE}\"" \
            "${REPOSITORY}"
          if [[ -n "${TARGET_OS}" ]]; then
            echo "target_os=['${TARGET_OS}']" >> .gclient
          fi
          if [[ -n "${TARGET_CPU}" ]]; then
            echo "target_cpu=${TARGET_CPU}" >> .gclient
          fi
          gclient validate
        else
          echo ".gclient already exists. Skipping gclient config."
        fi
      shell: bash

    - name: Check Golden Workspace DEPS Match
      id: check-deps
      if: inputs.run_sync == 'true'
      shell: bash
      working-directory: cobalt
      env:
        PLATFORM: ${{ inputs.platform || matrix.platform }}
        TARGET_OS: ${{ inputs.target_os }}
      run: |
        set -euo pipefail
        deps_match=false
        LOWER_DIR="/runner-cache/golden-workspace/gclient/${TARGET_OS:-linux}"

        if cmp -s "${LOWER_DIR}/src/DEPS" src/DEPS && cmp -s "${LOWER_DIR}/.gclient" .gclient; then
          echo "Golden workspace DEPS and .gclient match. Skipping gclient sync."
          deps_match=true
        fi
        echo "deps_match=${deps_match}" >> "${GITHUB_OUTPUT}"

    - name: Clean dirty sub-repositories
      shell: bash
      if: inputs.run_sync == 'true' && steps.check-deps.outputs.deps_match != 'true'
      working-directory: cobalt/src
      run: |
        # Identify and delete dirty sub-repositories
        git -c core.quotepath=false status --porcelain -unormal | while IFS= read -r line; do
          path="${line:3}"
          clean_path="${path%/}"
          if [[ -d "${clean_path}" && -d "${clean_path}/.git" ]]; then
            echo "Deleting conflicting sub-repo: ${clean_path}"
            rm -rf "${clean_path}"
          fi
        done

    - name: Run gclient sync
      shell: bash
      if: inputs.run_sync == 'true' && steps.check-deps.outputs.deps_match != 'true'
      working-directory: cobalt
      env:
        REF: ${{ github.sha }}
      run: |
        # Synchronize sub-repositories with minimal disk footprint and network transfer:
        # --shallow / --no-history: fetch only latest commits without full commit history
        # --nohooks: defer hooks so they run as an explicit, separately timed workflow step
        # --force / --delete_unversioned_trees: clean up untracked or mismatched trees left by prior builds
        # --revision: pin checkout to the exact triggering commit SHA
        gclient sync \
          --verbose \
          --shallow \
          --no-history \
          --nohooks \
          --force \
          --delete_unversioned_trees \
          --revision "${REF}"

    - name: Publish Golden Workspace Snapshot
      # Publish only when a sync actually happened (DEPS or .gclient changed, or
      # no usable snapshot existed), and only from one config per platform: the
      # snapshot is taken before the build, so its content is config-independent.
      id: publish-snapshot
      if: |
        inputs.run_sync == 'true' &&
        steps.check-deps.outputs.deps_match != 'true' &&
        matrix.config == 'devel' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (github.repository == 'youtube/cobalt' || github.repository == 'youtube/cobalt_sandbox')
      shell: bash
      working-directory: cobalt
      env:
        PLATFORM: ${{ inputs.platform || matrix.platform }}
        TARGET_OS: ${{ inputs.target_os }}
        PUBLISH_GOLDEN: ${{ inputs.publish_golden }}
        PUBLISH_SRC: ${{ inputs.publish_src }}
      run: |
        set -euo pipefail
        TARGET_OS="${TARGET_OS:-linux}"
        if [ "${TARGET_OS}" = "ios" ] || [ "${PUBLISH_GOLDEN}" != "true" ]; then
          echo "Skipping golden snapshot publishing."
          exit 0
        fi

        BUCKET="$(gcloud config get-value project)-test-artifacts/golden-workspace"
        ARCHIVE="/runner-cache/golden-${PLATFORM}.$$.tar.zst"
        trap 'rm -f "${ARCHIVE}"' EXIT
        mkdir -p "${RUNNER_TEMP}/golden"
        : > "${RUNNER_TEMP}/golden/${PLATFORM}"

        upload_part() {
          gcloud storage cp -n "${ARCHIVE}" "gs://${BUCKET}/$1/$2.tar.zst"
          echo "$1 $2" >> "${RUNNER_TEMP}/golden/${PLATFORM}"
        }

        TAR_ARGS=(
          --sort=name
          --mtime='1970-01-01 00:00:00Z'
          --owner=0
          --group=0
          --numeric-owner
        )

        if [ "${PUBLISH_SRC}" = "true" ]; then
          SRC_DIGEST=$(tar "${TAR_ARGS[@]}" -C "${SRC_DIR}" -cf - src \
            | zstd -T0 -3 -q | tee "${ARCHIVE}" | sha256sum | awk '{print $1}')
          upload_part "src" "${SRC_DIGEST}"
        fi

        GCLIENT_DIGEST=$(tar "${TAR_ARGS[@]}" --exclude='*.wh..wh.*' \
          -C "${UPPER_DIR}" -cf - depot_tools .gclient src \
          | zstd -T0 -3 -q | tee "${ARCHIVE}" | sha256sum | awk '{print $1}')
        upload_part "gclient/${TARGET_OS}" "${GCLIENT_DIGEST}"
        echo "published=true" >> "${GITHUB_OUTPUT}"

    - name: Upload Golden Workspace Metadata
      if: steps.publish-snapshot.outputs.published == 'true'
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: golden-digest-${{ inputs.platform || matrix.platform }}
        path: ${{ runner.temp }}/golden/${{ inputs.platform || matrix.platform }}
        retention-days: 1
        overwrite: true

    - name: Run gclient runhooks
      if: inputs.run_sync == 'true'
      working-directory: cobalt
      run: |
        gclient runhooks --verbose
      shell: bash
