name: OverlayFS Workspace Layer
description: Layers a pre-warmed golden workspace using fuse-overlayfs for zero-copy, instant checkouts.

inputs:
  path:
    description: Destination path (e.g. cobalt).
    required: true
  enabled:
    description: "Whether golden workspace caching is enabled."
    default: 'true'

outputs:
  cache_hit:
    description: "Whether the pre-warmed golden workspace was applied."
    value: ${{ steps.prepare.outputs.cache_hit }}

runs:
  using: "composite"
  steps:
    - name: Layer OverlayFS Workspace
      id: prepare
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        ENABLED: ${{ inputs.enabled }}
      run: |
        set -euo pipefail

        # Resolve lowerdir: prefer active generation pointer /runner-cache/current, fallback to /runner-cache/golden-workspace
        LOWER_DIR=""
        if [ -f "/runner-cache/current/.runner_cache_ready" ]; then
          LOWER_DIR=$(readlink -f "/runner-cache/current")
        elif [ -f "/runner-cache/golden-workspace/.runner_cache_ready" ]; then
          LOWER_DIR=$(readlink -f "/runner-cache/golden-workspace")
        fi

        # If caching is disabled or the node cache is not yet ready, exit cleanly without error
        if [ "${ENABLED}" != "true" ] || [ -z "${LOWER_DIR}" ]; then
          echo "Golden workspace cache bypassed or not ready on node SSD."
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [ -w "${LOWER_DIR}" ]; then
          if [ -d "${LOWER_DIR}/src/.git" ] && [ ! -f "${LOWER_DIR}/.golden_revision" ]; then
            git -C "${LOWER_DIR}/src" rev-parse HEAD > "${LOWER_DIR}/.golden_revision" 2>/dev/null || true
          fi
          if [ -f "${LOWER_DIR}/src/DEPS" ] && [ ! -f "${LOWER_DIR}/.deps_sha256" ]; then
            sha256sum "${LOWER_DIR}/src/DEPS" | awk '{print $1}' > "${LOWER_DIR}/.deps_sha256" 2>/dev/null || true
          fi
        fi

        echo "GOLDEN_WORKSPACE_LOWER_DIR=${LOWER_DIR}" >> "${GITHUB_ENV}"

        # Scope upper and work directories uniquely to this runner job
        SESSION_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RUNNER_NAME:-runner}"
        UPPER_DIR="/runner-cache/workspaces/${SESSION_ID}/upper"
        WORK_DIR="/runner-cache/workspaces/${SESSION_ID}/work"
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"

        # Clean up any stale mount on this specific destination
        fusermount3 -u -z "${MERGED_DIR}" 2>/dev/null || fusermount -u -z "${MERGED_DIR}" 2>/dev/null || umount -l "${MERGED_DIR}" 2>/dev/null || true

        # Clean up any stale workspaces from previous runs to prevent disk space exhaustion
        rm -rf /runner-cache/workspaces/*

        mkdir -p "${UPPER_DIR}" "${WORK_DIR}" "${MERGED_DIR}"

        echo "Mounting OverlayFS (${LOWER_DIR}) to ${MERGED_DIR}..."
        fuse-overlayfs -o lowerdir="${LOWER_DIR}",upperdir="${UPPER_DIR}",workdir="${WORK_DIR}" "${MERGED_DIR}"

        git config --global --add safe.directory "${MERGED_DIR}"
        git config --global --add safe.directory "${MERGED_DIR}/src"
        git config --global --add safe.directory "${MERGED_DIR}/depot_tools"
        echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"
        echo "cache_hit=true" >> "${GITHUB_OUTPUT}"
