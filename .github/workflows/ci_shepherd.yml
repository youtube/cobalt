# Disable dangerous-triggers rule because this workflow uses workflow_run
# strictly to deflake tests and generate reports, without checking out
# or executing untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: CI Shepherd

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [android, aosp, evergreen, linux, tvos]
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Workflow name'
        required: true
        type: choice
        options: [android, aosp, evergreen, linux, tvos]
      pr_number:
        description: 'Pull request number'
        required: false
        type: string
      action:
        description: 'Event action'
        required: true
        type: choice
        options: [in_progress, completed]

permissions:
  contents: read

env:
  DEFAULT_MAX_DEFLAKE_ATTEMPTS: 3

jobs:
  init-comment:
    runs-on: ubuntu-latest
    if: (github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.head_sha) != ''
    permissions:
      pull-requests: write
    concurrency:
      group: ci-shepherd-anchor @ ${{ github.event.workflow_run.head_sha || inputs.pr_number }}
      cancel-in-progress: false
    outputs:
      pr_number: ${{ steps.anchor.outputs.pr_number }}
      comment_id: ${{ steps.anchor.outputs.comment_id }}
      head_sha: ${{ steps.anchor.outputs.head_sha }}
    steps:
      - name: Create or Find Anchor Comment
        id: anchor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER:-}"
          head_sha="${HEAD_SHA:-}"
          if [[ -z "${pr_number}" && -n "${head_sha}" ]]; then
            pr_number=$(gh pr list --repo "${REPO}" --search "${head_sha}" --state all --json number --jq '.[0].number // ""')
          fi
          if [[ -z "${head_sha}" && -n "${pr_number}" ]]; then
            head_sha=$(gh pr view "${pr_number}" --repo "${REPO}" --json headRefOid -q .headRefOid)
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

          if [[ -z "${pr_number}" ]]; then
            echo "comment_id=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          header="<!-- sticky-pull-request-comment: shepherd-report -->"
          comment_id=$(gh api --paginate "repos/${REPO}/issues/${pr_number}/comments" 2>/dev/null \
            | jq -r --arg h "${header}" '.[]? | select((.body // "") | contains($h)) | .id' | head -n1 || true)

          if [[ -z "${comment_id}" ]]; then
            body="${header}"$'\n\n'"| Context | State | Description |"$'\n'"|---|---|---|"$'\n'"| CI / All Pass | ⏳ PENDING | Checks are running |"
            comment_id=$(gh api -X POST "repos/${REPO}/issues/${pr_number}/comments" -f body="${body}" --jq '.id')
          fi

          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"

  shepherd-analysis:
    runs-on: ubuntu-latest
    needs: [init-comment]
    if: always() && !cancelled() && needs.init-comment.outputs.pr_number != '' && (github.event.workflow_run.conclusion == 'failure' || inputs.action == 'completed')
    concurrency:
      group: shepherd-analysis @ ${{ needs.init-comment.outputs.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.extract.outputs.verdict }}
      confidence: ${{ steps.extract.outputs.confidence }}
      findings: ${{ steps.extract.outputs.findings }}
      recommendation: ${{ steps.extract.outputs.recommendation }}
    steps:
      - name: Configure environment for Gemini CLI
        run: |
          echo "GEMINI_CLI_TRUST_WORKSPACE=true" >> "$GITHUB_ENV"
          echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      - name: Checkout files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .agent
            cobalt/devinfra/github

      - name: Run PR Shepherd Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.init-comment.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 cobalt/devinfra/github/shepherd_pr.py \
            --repo "${REPO}" \
            --pr "${PR_NUMBER}" \
            --artifacts-dir artifacts \
            --exit-zero || true

      - name: Run Gemini PR Shepherd Analysis
        id: trigger_gemini_analysis
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        timeout-minutes: 10
        with:
          gemini_api_key: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
          github_pr_number: ${{ needs.init-comment.outputs.pr_number }}
          gemini_model: 'gemini-3.8-flash'
          gemini_debug: true
          upload_artifacts: true
          prompt: |
            Analyze the CI test failures for PR #${{ needs.init-comment.outputs.pr_number }}.
            All test failure artifacts, reports, and check statuses have already been fetched and preloaded into the `artifacts/` directory.
            Inspect `artifacts/summary.json` and any logs in `artifacts/logs/` or `artifacts/test_results/`.
            Do not run git fetch or git clone. Do not perform extraneous network searches or repetitive commands.
            If detailed step logs could not be retrieved or the check is an external build status, formulate your determination directly from the available check statuses and failure descriptions.

            Provide your final determination immediately as a single JSON object with the following fields:
            - "verdict": "failure" (if real failure introduced in PR code), "flaky" (if failures are due to flakes, timeouts, or infra), or "pass" (if all checks passed)
            - "confidence": a number from 0 to 1 indicating your confidence in the verdict
            - "findings_summary": markdown text explaining the root cause and triage recommendations to append to the PR comment
            - "recommendation": an action recommendation object for automated recovery:
              - "action": "restart_failed_jobs" (if flaky tests should be retried), "apply_labels" (if trigger labels should be applied), or "none" (if PR code changes are needed)
              - "labels": optional array of label strings to apply to the PR if applicable (e.g. ["kokoro:run"], ["kokoro:force-run"], ["runtest"])
              - "restart_failed_jobs": boolean (true if failed jobs in this workflow run should be restarted)

            For a flaky verdict all retries of a workflow run must be analyzed/triaged.
            All output must be a single valid JSON object.

      - name: Validate JSON Output
        if: always() && !cancelled()
        env:
          AGENT_SUMMARY: ${{ steps.trigger_gemini_analysis.outputs.summary }}
        run: |
          clean_json=$(echo "${AGENT_SUMMARY:-{}}" | sed -e '1{/^```json/d}' -e '${/^```/d}')
          echo "${clean_json}" | jq -e . >/dev/null || exit 1

      - name: Extract Analysis Results
        id: extract
        if: always() && !cancelled()
        env:
          AGENT_SUMMARY: ${{ steps.trigger_gemini_analysis.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail

          clean_json=$(echo "${AGENT_SUMMARY:-}" | sed -e '1{/^```json/d}' -e '${/^```/d}')
          verdict=$(echo "${clean_json:-}" | jq -r '.verdict // empty' 2>/dev/null || true)
          confidence=$(echo "${clean_json:-}" | jq -r '.confidence // empty' 2>/dev/null || true)
          findings=$(echo "${clean_json:-}" | jq -r '.findings_summary // empty' 2>/dev/null || true)
          if [[ -z "${findings}" ]]; then
            findings="${clean_json:-}"
          fi
          recommendation=$(echo "${clean_json:-}" | jq -c '.recommendation // empty' 2>/dev/null || true)

          echo "verdict=${verdict}" >> "${GITHUB_OUTPUT}"
          echo "confidence=${confidence}" >> "${GITHUB_OUTPUT}"
          DELIMITER=$(openssl rand -hex 16)
          {
            echo "findings<<${DELIMITER}"
            echo "${findings}"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"
          REC_DELIMITER=$(openssl rand -hex 16)
          {
            echo "recommendation<<${REC_DELIMITER}"
            echo "${recommendation}"
            echo "${REC_DELIMITER}"
          } >> "${GITHUB_OUTPUT}"

  status-and-deflake:
    runs-on: ubuntu-latest
    needs: [init-comment, shepherd-analysis]
    if: always() && !cancelled() && needs.init-comment.result == 'success'
    permissions:
      statuses: write
      actions: write
      contents: read
      pull-requests: write
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      rerun_triggered: ${{ steps.deflake.outputs.rerun_triggered || 'false' }}
    steps:
      - name: Resolve Context
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA_EVENT: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_EVENT: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER_EVENT:-}"
          head_sha="${HEAD_SHA_EVENT:-}"
          if [[ -z "${pr_number}" && -n "${head_sha}" ]]; then
            pr_number=$(gh pr list --repo "${REPO}" --search "${head_sha}" --state all --json number --jq '.[0].number // ""')
          fi
          if [[ -z "${head_sha}" && -n "${pr_number}" ]]; then
            head_sha=$(gh pr view "${pr_number}" --repo "${REPO}" --json headRefOid -q .headRefOid)
          fi
          if [[ -z "${pr_number}" ]]; then
            pr_number=$(gh pr list --repo "${REPO}" --search "${head_sha}" --state all --json number --jq '.[0].number // ""')
          fi

          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Set Pending Status on In-Progress
        if: (github.event.action || inputs.action) == 'in_progress'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.workflow_name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="pending" \
            -f description="Checks are running" \
            -f context="CI / ${WORKFLOW_NAME}" \
            -f target_url="${RUN_URL}"
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="pending" \
            -f description="Checks are running" \
            -f context="CI / All Pass" || true

      - name: Checkout Deflake Config
        if: (github.event.action || inputs.action) != 'in_progress' && github.event.workflow_run.conclusion == 'failure'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Deflake Failing Tests
        id: deflake
        if: (github.event.action || inputs.action) != 'in_progress' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || 1 }}
          DEFAULT_MAX_ATTEMPTS: ${{ env.DEFAULT_MAX_DEFLAKE_ATTEMPTS }}
          RECOMMENDATION_JSON: ${{ needs.shepherd-analysis.outputs.recommendation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RECOMMENDATION_JSON:-}" ]]; then
            echo "No recommendation JSON received from shepherd-analysis. Skipping deflake."
            exit 0
          fi

          action=$(echo "${RECOMMENDATION_JSON}" | jq -r '.action // empty' 2>/dev/null || true)
          should_restart=$(echo "${RECOMMENDATION_JSON}" | jq -r '
            if .restart_failed_jobs == true or .action == "restart_failed_jobs" then "true"
            else "false"
            end
          ' 2>/dev/null || echo "false")
          mapfile -t labels < <(echo "${RECOMMENDATION_JSON}" | jq -r '(.labels // [])[]' 2>/dev/null || true)

          # Apply recommended labels to PR if any
          for label in "${labels[@]}"; do
            if [[ -n "${label}" && -n "${PR_NUMBER}" ]]; then
              echo "Applying label '${label}' to PR #${PR_NUMBER}"
              gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "${label}" || true
            fi
          done

          # Restart failed jobs if recommended
          if [[ "${should_restart}" == "true" ]]; then
            if [[ -f .github/config/infra/deflake.json ]]; then
              max_attempts=$(jq -r '.deflake_runs | tonumber? // empty' .github/config/infra/deflake.json)
            fi
            max_attempts="${max_attempts:-${DEFAULT_MAX_ATTEMPTS}}"

            if [[ "${RUN_ATTEMPT}" -ge "${max_attempts}" ]]; then
              echo "Max attempts reached (${RUN_ATTEMPT}/${max_attempts}). Skipping rerun."
              exit 0
            fi

            current_sha=$(git ls-remote "https://github.com/${HEAD_REPO}.git" "refs/heads/${HEAD_BRANCH}" | cut -f1)
            if [[ "${current_sha}" != "${HEAD_SHA}" ]]; then
              echo "Branch head moved to ${current_sha} (run SHA: ${HEAD_SHA}). Skipping rerun."
              exit 0
            fi

            echo "Rerunning failed jobs under https://github.com/${REPO}/actions/runs/${WORKFLOW}"
            gh run rerun --repo "${REPO}" "${WORKFLOW}" --failed
            echo "rerun_triggered=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No job restart recommended by shepherd agent (action: ${action:-none})."
          fi

      - name: Update Workflow and Overall Commit Status
        id: update-commit-status
        if: (github.event.action || inputs.action) != 'in_progress'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.workflow_name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RERUN_TRIGGERED: ${{ steps.deflake.outputs.rerun_triggered || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RERUN_TRIGGERED}" == "true" ]]; then
            state="pending"
            desc="Retrying failed jobs"
          else
            mkdir -p shepherd_artifacts
            gh run download "${WORKFLOW_ID}" --repo "${REPO}" -p "shepherd-report-*" -D shepherd_artifacts 2>/dev/null || true

            shopt -s globstar nullglob
            reports=(shepherd_artifacts/**/shepherd_report.json)
            if [[ ${#reports[@]} -eq 0 ]]; then
              state="failure"
              desc="Failed"
            else
              has_failures=$(jq -s '
                if length == 0 then true
                else
                  any(.[];
                    any(.checks | objects | .[]?; . == "failure" or . == "cancelled")
                    or
                    any((.test_failures | objects | .failing_tests // .) | objects | .[]?; (arrays | length) > 0)
                  )
                end
              ' "${reports[@]}" 2>/dev/null || echo "true")

              [[ "${has_failures}" == "true" ]] && state="failure" desc="Failed" || state="success" desc="Passed"
            fi
          fi

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f target_url="${RUN_URL}" \
            -f description="${desc}" \
            -f context="CI / ${WORKFLOW_NAME}"

          # 1. Query current commit statuses
          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || echo "{}")

          # 2. Inspect CI checks to check for failures or full completion
          has_failures=$(echo "${status_json}" | jq -r '
            [.statuses[]? | select(.context | startswith("CI /")?) | select(.context != "CI / All Pass")]
            | any(.state == "failure" or .state == "error")
          ')

          all_passed=$(echo "${status_json}" | jq -r '
            [.statuses[]? | select(.context | startswith("CI /")?) | select(.context != "CI / All Pass")]
            | length > 0 and all(.state == "success")
          ')

          all_done=$(echo "${status_json}" | jq -r '
            [.statuses[]? | select(.context | startswith("CI /")?) | select(.context != "CI / All Pass")]
            | length > 0 and all(.state != "pending")
          ')

          # 3. Determine overall status and description
          if [[ "${has_failures}" == "true" ]]; then
            overall_state="failure"
            overall_desc="Some checks failed"
          elif [[ "${all_passed}" == "true" ]]; then
            overall_state="success"
            overall_desc="All checks passed"
          else
            overall_state="pending"
            overall_desc="Checks are running"
          fi

          if [[ -n "${overall_state:-}" && "${overall_state}" != "pending" ]]; then
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="${overall_state}" \
              -f description="${overall_desc}" \
              -f context="CI / All Pass"
          fi

  comment-pr:
    runs-on: ubuntu-latest
    needs: [init-comment, status-and-deflake, shepherd-analysis]
    if: always() && needs.init-comment.outputs.comment_id != '' && !cancelled()
    concurrency:
      group: ci-shepherd-comment @ ${{ needs.init-comment.outputs.head_sha || needs.status-and-deflake.outputs.head_sha }}
      cancel-in-progress: true
    permissions:
      statuses: read
      pull-requests: write
    steps:
      - name: Update PR Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.init-comment.outputs.head_sha || needs.status-and-deflake.outputs.head_sha }}
          COMMENT_ID: ${{ needs.init-comment.outputs.comment_id }}
          VERDICT: ${{ needs.shepherd-analysis.outputs.verdict }}
          CONFIDENCE: ${{ needs.shepherd-analysis.outputs.confidence }}
          FINDINGS: ${{ needs.shepherd-analysis.outputs.findings }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "| Context | State | Description |"
            echo "|---|---|---|"
          } > shepherd_report.md

          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || echo "{}")
          echo "${status_json}" | jq -r '
            {success: "✅ PASS", pending: "⏳ PENDING"} as $icons |
            .statuses // [] | sort_by(.context)[] | select(.context | startswith("CI /")?) |
            "| [\(.context)](\(.target_url // "")) | \($icons[.state] // "❌ FAIL") | \(.description // "") |"
          ' >> shepherd_report.md

          if [[ -n "${FINDINGS:-}" || -n "${VERDICT:-}" ]]; then
            {
              echo ""
              echo "### 🤖 CI Shepherd Analysis"
              echo ""
              if [[ -n "${VERDICT:-}" ]]; then
                echo "- **Verdict**: ${VERDICT}"
              fi
              if [[ -n "${CONFIDENCE:-}" ]]; then
                echo "- **Confidence**: $(echo "$CONFIDENCE" | awk "{printf \"%.0f%%\", \$1 * 100}")"
              fi
              if [[ -n "${VERDICT:-}" || -n "${CONFIDENCE:-}" ]]; then
                echo ""
              fi
              if [[ -n "${FINDINGS:-}" ]]; then
                echo "${FINDINGS}"
              fi
            } >> shepherd_report.md
          fi

          header="<!-- sticky-pull-request-comment: shepherd-report -->"
          comment_body="${header}"$'\n'"$(cat shepherd_report.md)"
          gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="${comment_body}" --silent
