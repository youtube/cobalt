# Requests the tvOS Kokoro build for every staging PR. Staging PRs are mostly
# Chromium roll fixes that can affect any platform, so this doesn't run the gn
# analysis that tvos_impact.yaml on main runs.
name: tvOS Impact

# tvos_staging.yaml looks up this run by name.
run-name: tvOS Impact (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }} (${{ github.event.action }}))

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - staging
      - autoroll-chromium/main-to-staging

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write Result
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p tvos_impact
          echo "${PR_NUMBER}" > tvos_impact/pr_number
          echo true > tvos_impact/affects_tvos
          cat tvos_impact/*

      - name: Upload Result
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: tvos-impact
          path: tvos_impact/
          retention-days: 1
