name: OverlayFS Workspace Layer
description: Layers a pre-warmed golden workspace using fuse-overlayfs for zero-copy, instant checkouts.

inputs:
  path:
    description: Destination path (e.g. cobalt).
    required: true
  platform:
    description: Target platform for platform-specific golden snapshot.
    default: ''
  use_gcloud:
    description: "Whether to run gcloud config set account."
    default: 'false'

outputs:
  cache_hit:
    description: "Whether the golden workspace cache was hit on the node SSD."
    value: ${{ steps.resolve-snapshot.outputs.cache_hit }}

runs:
  using: "composite"
  steps:
    - name: Authenticate with GoB
      uses: ./.github/actions/gob_auth
      with:
        use_gcloud: ${{ inputs.use_gcloud }}

    - name: Clean Stale Mounts and Workspaces
      id: cleanup
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"
        # Clean up stale mounts and reclaim space from finished or cancelled jobs
        fusermount3 -u -z "${MERGED_DIR}" 2>/dev/null || fusermount -u -z "${MERGED_DIR}" 2>/dev/null || umount -l "${MERGED_DIR}" 2>/dev/null || true
        rm -rf /runner-cache/workspaces/*

    # TODO: Clean up legacy .runner_cache_ready marker logic once all runner nodes
    # have migrated to the new snapshot-based caching system.
    - name: Validate Legacy Cache Marker
      id: validate-marker
      shell: bash
      run: |
        # If golden workspace exists but lacks .runner_cache_ready, it is an
        # incomplete or corrupted artifact from an interrupted legacy sync.
        if [ -w "/runner-cache" ] && [ -d "/runner-cache/golden-workspace" ]; then
          if [ ! -f "/runner-cache/golden-workspace/.runner_cache_ready" ]; then
            echo "Notice: Purging corrupted or incomplete golden workspace (missing .runner_cache_ready)..."
            rm -rf /runner-cache/golden-workspace
          fi
        fi

    - name: Check SSD Cache Hit
      id: detect-cache
      shell: bash
      run: |
        cache_hit=false
        if [ -w "/runner-cache" ] && [ -d "/runner-cache/golden-workspace" ] && [ -n "$(ls -A /runner-cache/golden-workspace 2>/dev/null)" ]; then
          cache_hit=true
        fi
        echo "cache_hit=${cache_hit}" >> "${GITHUB_OUTPUT}"

        echo "Logging workspace cache status to Cloud Logging..."
        LOG_PAYLOAD=$(jq -n \
          --arg workflow "${GITHUB_WORKFLOW}" \
          --arg job "${GITHUB_JOB}" \
          --arg runner "${RUNNER_NAME:-runner}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --argjson cache_hit "${cache_hit}" \
          '{workflow: $workflow, job: $job, runner: $runner, run_id: $run_id, url: $url, cache_hit: $cache_hit}')
        gcloud logging write github-actions-runners "${LOG_PAYLOAD}" --payload-type=json 2>/dev/null || true

    - name: Hydrate Snapshot from GCS
      id: hydrate-snapshot
      shell: bash
      env:
        PLATFORM_INPUT: ${{ inputs.platform }}
      run: |
        LOWER_DIR="/runner-cache/golden-workspace"
        if [ ! -w "/runner-cache" ] || [ -d "${LOWER_DIR}" ]; then
          exit 0
        fi

        GOLDEN_WORKSPACE_BUCKET="${GOLDEN_WORKSPACE_BUCKET:-cobalt-internal-build-artifacts/golden-workspace}"
        ARCHIVE_GCS="gs://${GOLDEN_WORKSPACE_BUCKET}/${PLATFORM_INPUT}/golden-workspace-latest.tar.zst"
        STAGING_DIR="/runner-cache/staging.$$"
        rm -rf "${STAGING_DIR}"
        mkdir -p "${STAGING_DIR}"

        echo "Streaming and decompressing snapshot from ${ARCHIVE_GCS}..."
        if gcloud storage cat "${ARCHIVE_GCS}" \
            | tar --no-same-owner --use-compress-program="zstd -d -T0" -xf - -C "${STAGING_DIR}"; then
          # Refresh git stat cache so files extracted from the tarball match
          # the recorded index mtime/size, preventing false-positive dirty status.
          git -C "${STAGING_DIR}/src" update-index --refresh -q 2>/dev/null || true

          # Seed vpython cache directory on the runner from snapshot
          mkdir -p /runner-cache/vpython
          cp -rn "${STAGING_DIR}/vpython/." /runner-cache/vpython/ 2>/dev/null || true
          # Mark snapshot ready for legacy compatibility
          touch "${STAGING_DIR}/.runner_cache_ready"
          rm -rf "${LOWER_DIR}"
          mv "${STAGING_DIR}" "${LOWER_DIR}"
          echo "Extracted golden workspace snapshot to ${LOWER_DIR}"
        else
          echo "Notice: Golden workspace archive not found or failed to stream from GCS."
          rm -rf "${STAGING_DIR}"
        fi

    - name: Resolve Active Snapshot Directory
      id: resolve-snapshot
      shell: bash
      run: |
        lower_dir=""
        if [ -d "/runner-cache/golden-workspace" ]; then
          lower_dir="/runner-cache/golden-workspace"
        fi

        if [ -n "${lower_dir}" ]; then
          echo "lower_dir=${lower_dir}" >> "${GITHUB_OUTPUT}"
          echo "cache_hit=true" >> "${GITHUB_OUTPUT}"
        else
          echo "lower_dir=" >> "${GITHUB_OUTPUT}"
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          echo "Golden workspace not found on SSD or GCS. Proceeding with cold workspace."
        fi

    - name: Mount OverlayFS Layer
      if: steps.resolve-snapshot.outputs.lower_dir != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        LOWER_DIR: ${{ steps.resolve-snapshot.outputs.lower_dir }}
      run: |
        SESSION_ID="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RUNNER_NAME:-runner}"
        UPPER_DIR="/runner-cache/workspaces/${SESSION_ID}/upper"
        WORK_DIR="/runner-cache/workspaces/${SESSION_ID}/work"
        MERGED_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH}"

        mkdir -p "${UPPER_DIR}" "${WORK_DIR}" "${MERGED_DIR}"

        echo "Mounting OverlayFS (${LOWER_DIR}) to ${MERGED_DIR}..."
        fuse-overlayfs -o lowerdir="${LOWER_DIR}",upperdir="${UPPER_DIR}",workdir="${WORK_DIR}" "${MERGED_DIR}"

        git config --global --add safe.directory "${MERGED_DIR}"
        git config --global --add safe.directory "${MERGED_DIR}/src"
        git config --global --add safe.directory "${MERGED_DIR}/depot_tools"
