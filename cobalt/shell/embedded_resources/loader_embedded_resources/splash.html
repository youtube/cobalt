<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
      }
      video {
        height: 100%;
        width: 100%;
      }
      .placeholder {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <video class="video" id="video" disableRemotePlayback></video>
    <div class="placeholder" id="placeholder"></div>
  </body>
  <footer>
    <script>
      function objectUrlFromSafeSource(source) {
        return URL.createObjectURL(source);
      }

      const maybeDestroyVideoInstance = () => {};
      const getPlaceholderEl = () => document.getElementById('placeholder');
      const getVideoEl = () => document.getElementById('video');

      function animate(onAnimationEnd) {
        const videoEl = getVideoEl();
        if (!videoEl) {
          return;
        }

        const onSplashEnd = () => {
          onAnimationEnd && onAnimationEnd();
          window.close();
        };

        videoEl.addEventListener('ended', () => {
          maybeDestroyVideoInstance();
          setTimeout(() => {
            onSplashEnd();
          }, 3000);  // Wait before closing to allow user to see the last frame.
        });

        const showPlaceholderImage = () => {
          const placeholderEl = getPlaceholderEl && getPlaceholderEl();
          if (placeholderEl) {
            placeholderEl.style.opacity = '100%';
          }
        };
        playSplashAnimation(/*afterVideoStart=*/ showPlaceholderImage, /*afterImageLoad=*/ onSplashEnd);
      }

      /**
       * Displays static splash screen for devices that don't support VP9
       * @param urlParams URL parameters containing cache configuration
       */
      function handleStaticImageFallback(urlParams, splashTopic, afterImageLoad) {
        const placeholderEl = getPlaceholderEl();
        if (!placeholderEl) {
          return;
        }
        urlParams.append('fallback', `${splashTopic}splash.png`);
        fetch('h5vcc-embedded://splash.png?' + urlParams.toString())
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.blob();
        })
        .then(imageBlob => {
          const imageUrl = URL.createObjectURL(imageBlob);
          placeholderEl.style.backgroundImage = `url(${imageUrl})`;
          placeholderEl.style.opacity = '100%';
          // set timeout to align with timeout for splash video
          setTimeout(() => {
              afterImageLoad && afterImageLoad();
            }, 1000);
        })
        .catch(error => {
          console.error('Failed to fetch splash image:', error);
        });
        return;
      }

      /**
       * Plays the splash video and audio using separate SourceBuffers.
       * @param urlParams URL parameters containing cache and fallback configuration
       * @param splashTopic Topic prefix (e.g. 'music_' or '')
       * @param afterVideoStart Callback function when playback starts
       */
      function handleMedia(urlParams, splashTopic, afterVideoStart) {
        const videoEl = getVideoEl();
        if (!videoEl) {
          return;
        }
        const mediaSource = new MediaSource();

        mediaSource.addEventListener('sourceopen', async () => {
          // 1. Create Video SourceBuffer synchronously
          let videoSourceBuffer = null;
          try {
            videoSourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp9"');
          } catch (e) {
            console.error('Failed to add video SourceBuffer:', e);
            return;
          }

          // 2. Create Audio SourceBuffer synchronously (if supported)
          let audioSourceBuffer = null;
          if (MediaSource.isTypeSupported('audio/webm; codecs="opus"')) {
            try {
              audioSourceBuffer = mediaSource.addSourceBuffer('audio/webm; codecs="opus"');
            } catch (e) {
              audioSourceBuffer = null;
            }
          }

          // Video and Audio embedded resource URLs
          const videoParams = new URLSearchParams(urlParams.toString());
          const splashFormat = (MediaSource.isTypeSupported("video/webm; codecs=\"vp9\"; width=3840; height=2160;")) ? '' : '_480';
          videoParams.append('fallback', `${splashTopic}splash_test_video${splashFormat}.webm`);
          const videoUrl = 'h5vcc-embedded://splash_test_video.webm?' + videoParams.toString();

          const audioParams = new URLSearchParams(urlParams.toString());
          audioParams.append('fallback', `${splashTopic}splash_test_audio.webm`);
          const audioUrl = `h5vcc-embedded://${splashTopic}splash_test_audio.webm?` + audioParams.toString();

          let videoAppended = false;
          let audioAppended = !audioSourceBuffer;

          const checkAllAppendedAndPlay = () => {
            if (!videoAppended || !audioAppended) {
              return;
            }
            if (mediaSource.readyState === 'open') {
              try {
                mediaSource.endOfStream();
              } catch (e) {
                console.error('Error ending MediaSource stream:', e);
              }
              videoEl.play();
              afterVideoStart && afterVideoStart();
            }
          };

          // Fetch and append Video
          fetch(videoUrl)
            .then(response => {
              if (!response.ok) throw new Error('Video fetch failed: ' + response.status);
              return response.arrayBuffer();
            })
            .then(data => {
              videoSourceBuffer.addEventListener('updateend', () => {
                videoAppended = true;
                checkAllAppendedAndPlay();
              }, {once: true});
              videoSourceBuffer.appendBuffer(data);
            })
            .catch(error => {
              console.error('Failed to fetch or append splash video:', error);
            });

          // Fetch and append Audio
          if (audioSourceBuffer) {
            fetch(audioUrl)
              .then(response => {
                if (!response.ok) throw new Error('Audio fetch failed: ' + response.status);
                return response.arrayBuffer();
              })
              .then(data => {
                audioSourceBuffer.addEventListener('updateend', () => {
                  audioAppended = true;
                  checkAllAppendedAndPlay();
                }, {once: true});
                audioSourceBuffer.appendBuffer(data);
              })
              .catch(error => {
                if (audioSourceBuffer && mediaSource.readyState === 'open') {
                  try {
                    mediaSource.removeSourceBuffer(audioSourceBuffer);
                  } catch (e) {}
                }
                audioAppended = true;
                checkAllAppendedAndPlay();
              });
          }
        }, {once: true});

        videoEl.src = objectUrlFromSafeSource(mediaSource).toString();
      }

      /**
       * Plays the splash animation depending on device type.
       * @param afterVideoStart Callback function when the video starts playing.
       * @param afterImageLoad Callback function for static image.
       */
      function playSplashAnimation(afterVideoStart, afterImageLoad) {
        const params = new URLSearchParams(window.location.search);
        const forceImage = params.get('force_image');
        // The default splash video is splash.webm. If it does not exist in
        // the given cache, "fallback" parameter specifies which built-in video
        // to use.
        if (!params.has('cache')) {
          params.append('cache', 'default');
        }
        const topicName = params.get('cache');
        // Only topic=music using music_splash{_480}.{webm/png}. All others
        // are default splash screen.
        const splashTopic = (topicName === 'music') ? 'music_' : '';

        if (forceImage === 'true' || !MediaSource.isTypeSupported("video/webm; codecs=\"vp9\";")) {
          return handleStaticImageFallback(params, splashTopic, afterImageLoad);
        }

        return handleMedia(params, splashTopic, afterVideoStart);
      }

      animate(() => console.log('splash animation completed!'));
    </script>
  </footer>
</html>
