# Requests the tvOS Kokoro build by labeling the PR from the tvOS Impact
# result. workflow_run runs this file from the default branch with a write
# token, and it never checks out or runs PR code.
name: Auto Label Kokoro

# tvos.yaml looks up this run by name.
run-name: Auto Label Kokoro (tvOS Impact run ${{ github.event.workflow_run.id }})

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - tvOS Impact
    types:
      - completed

permissions:
  contents: read

jobs:
  label-kokoro-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      statuses: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A missing result means the tvOS Impact run was cancelled. Fail, so
          # the tvOS check fails too, unless the PR has a newer commit.
          dir="${RUNNER_TEMP}/tvos_impact"
          if ! gh run download "${RUN_ID}" --repo "${REPO}" --name tvos-impact --dir "${dir}"; then
            echo "::error::No result: tvOS Impact run ${RUN_ID} was cancelled."
            exit 1
          fi

          # The result comes from a run of PR code. Only accept a PR whose
          # head is the analyzed commit, and treat anything but false as true.
          pr_number=$(head -c 32 "${dir}/pr_number" | tr -d '[:space:]')
          affects_tvos=$(head -c 32 "${dir}/affects_tvos" | tr -d '[:space:]')
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number."; exit 1; }

          pr=$(gh api "repos/${REPO}/pulls/${pr_number}")
          if [[ "$(jq -r .head.sha <<< "${pr}")" != "${HEAD_SHA}" ]]; then
            echo "PR #${pr_number} head isn't ${HEAD_SHA}."
            exit 0
          fi
          if [[ "$(jq -r '.state == "open" and .draft == false' <<< "${pr}")" != "true" ]]; then
            echo "PR #${pr_number} is closed or a draft."
            exit 0
          fi

          author=$(jq -r .user.login <<< "${pr}")
          assoc=$(jq -r .author_association <<< "${pr}")
          permission=$(gh api "repos/${REPO}/collaborators/${author}/permission" --jq .permission || echo none)
          echo "${author}: association ${assoc}, permission ${permission}"
          if [[ ! "${assoc}" =~ ^(OWNER|MEMBER|COLLABORATOR)$ && ! "${permission}" =~ ^(admin|write)$ ]]; then
            echo "Not a committer."
            exit 0
          fi

          if [[ "${affects_tvos}" == "false" ]]; then
            echo "PR #${pr_number} doesn't affect tvOS."
            exit 0
          fi

          # Kokoro doesn't build a commit twice, so it would leave the label,
          # and the next push would build before its analysis.
          started=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status?per_page=100" \
            --jq 'any(.statuses[]; .context == "kokoro")')
          if [[ "${started}" == "true" ]]; then
            echo "Kokoro already built ${HEAD_SHA}."
            exit 0
          fi
          [[ "${affects_tvos}" == "true" ]] || echo "tvOS Impact analysis didn't finish. Labeling anyway."
          gh pr edit "${pr_number}" --repo "${REPO}" --add-label kokoro:run
