on:
  push:
    branches:
      - 'experimental/staging_shadow'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific starting commit SHA (e.g. 4bbb4baf278b8162e15191c44c98c6e21c8d4aea)'
        required: false
        type: string
      pr_number:
        description: 'PR number to resolve (optional, e.g. 12040)'
        required: false
        type: string
      base_branch:
        description: 'Base/Vendor roll branch to resolve'
        required: false
        type: string
        default: 'experimental/staging_shadow'
      ai_branch_prefix:
        description: 'Prefix for the isolated AI working branch'
        required: false
        type: string
        default: 'experimental/ai_'
      agent_ref:
        description: 'Branch containing the AI rebase agent scripts'
        required: false
        type: string
        default: 'experimental/rebase_agent'
      dry_run:
        description: 'Dry run mode (runs AI resolver but skips pushing commit & creating PR)'
        type: boolean
        default: true
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - resolve-conflicts
          - full-pipeline
          - gn-gen
        default: resolve-conflicts

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for GCP Workload Identity Federation

jobs:
  ai_resolve:
    name: Vertex AI Rebase Healing
    runs-on: ubuntu-latest
    env:
      DEPOT_TOOLS_METRICS: 0
      GIT_AUTHOR_NAME: "cobalt-github-releaser-bot"
      GIT_AUTHOR_EMAIL: "cobalt-github-releaser-bot@google.com"
      GIT_COMMITTER_NAME: "cobalt-github-releaser-bot"
      GIT_COMMITTER_EMAIL: "cobalt-github-releaser-bot@google.com"
      GITHUB_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository (Isolated)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: src
          fetch-depth: 100
          token: ${{ env.GITHUB_TOKEN }}

      - name: Setup Working Branch
        id: branch_setup
        working-directory: src
        run: |
          set -x

          PR_NUM="${{ inputs.pr_number }}"
          COMMIT_SHA="${{ inputs.commit_sha }}"
          BASE_BRANCH="${{ inputs.base_branch || 'experimental/staging_shadow' }}"
          AI_PREFIX="${{ inputs.ai_branch_prefix || 'experimental/ai_' }}"
          AGENT_REF="${{ inputs.agent_ref || 'experimental/rebase_agent' }}"

          # 1. Checkout starting target: PR (with optional commit SHA), direct commit SHA, or base branch
          if [[ -n "${PR_NUM}" ]]; then
            echo "Fetching PR #${PR_NUM}..."
            git fetch origin "pull/${PR_NUM}/head:pr-${PR_NUM}"
            git checkout "pr-${PR_NUM}"

            if [[ -n "${COMMIT_SHA}" ]]; then
              echo "Checking out target commit SHA inside PR #${PR_NUM}: ${COMMIT_SHA}..."
              git checkout "${COMMIT_SHA}"
              SHORT_SHA=$(git rev-parse --short "${COMMIT_SHA}")
              BASE_NAME="pr_${PR_NUM}_${SHORT_SHA}"
              AI_BRANCH="${AI_PREFIX}pr_${PR_NUM}_${SHORT_SHA}"
            else
              BASE_NAME="pr_${PR_NUM}"
              AI_BRANCH="${AI_PREFIX}pr_${PR_NUM}"
            fi
          elif [[ -n "${COMMIT_SHA}" ]]; then
            echo "Fetching and checking out commit SHA: ${COMMIT_SHA}..."
            git fetch --depth=100 origin "${COMMIT_SHA}" || git fetch origin --tags
            git checkout "${COMMIT_SHA}"
            SHORT_SHA=$(git rev-parse --short "${COMMIT_SHA}")
            BASE_NAME="commit_${SHORT_SHA}"
            AI_BRANCH="${AI_PREFIX}${SHORT_SHA}"
          else
            echo "Checking out base branch ${BASE_BRANCH}..."
            git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}" || true
            git checkout "${BASE_BRANCH}"
            CLEAN_NAME=$(echo "${BASE_BRANCH}" | sed 's|experimental/||g; s|/|_|g')
            BASE_NAME="${BASE_BRANCH}"
            AI_BRANCH="${AI_PREFIX}${CLEAN_NAME}"
          fi

          # 2. Create a separate, isolated AI branch from the base branch
          echo "Creating isolated AI branch: ${AI_BRANCH}..."
          git checkout -B "${AI_BRANCH}"

          # 3. Always borrow latest rebase scripts from agent_ref
          echo "Fetching latest rebase pipeline scripts from origin/${AGENT_REF}..."
          git fetch origin "${AGENT_REF}:${AGENT_REF}" || true
          git checkout "origin/${AGENT_REF}" -- .github/rebase

          echo "base_branch=${BASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "ai_branch=${AI_BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (Vertex AI)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set Up Isolated Python Environment & Dependencies
        working-directory: src
        run: |
          python3 -m venv "${GITHUB_WORKSPACE}/.venv"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "${GITHUB_ENV}"
          source "${GITHUB_WORKSPACE}/.venv/bin/activate"
          pip install --upgrade pip
          if [[ -f .github/rebase/requirements.txt ]]; then
            pip install -r .github/rebase/requirements.txt
          fi

      - name: Run AI Conflict Resolver
        id: run_ai
        working-directory: src
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'lxn-test' }}
          GCP_REGION: "us-central1"
          REASONING_ENGINE_ID: ${{ secrets.REASONING_ENGINE_ID || '7153081251950231552' }}
          MODE: ${{ inputs.mode || 'resolve-conflicts' }}
        run: |
          set +e
          echo "::group::Running Vertex AI Pipeline"

          python3 .github/rebase/run_rebase_pipeline.py \
            --mode "${MODE}"

          EXIT_CODE=$?
          echo "::endgroup::"

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "resolved=true" >> "${GITHUB_OUTPUT}"
          else
            echo "resolved=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit, Push and Create/Update AI PR
        if: inputs.dry_run != true
        working-directory: src
        env:
          BASE_BRANCH: "staging"
          AI_BRANCH: ${{ steps.branch_setup.outputs.ai_branch }}
          PR_NUM: ${{ steps.branch_setup.outputs.pr_num }}
          IS_RESOLVED: ${{ steps.run_ai.outputs.resolved }}
          GH_TOKEN: ${{ secrets.CHERRY_PICK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git add -A
          if ! git diff --cached --quiet; then
            if [[ "${IS_RESOLVED}" == "true" ]]; then
              COMMIT_MSG="RESOLVED: AI automated rebase conflict healing"
            else
              COMMIT_MSG="WIP: AI automated rebase partial progress (build unverified)"
            fi
            echo "Committing and pushing changes: ${COMMIT_MSG}..."
            git commit -m "${COMMIT_MSG}"
            git push -u origin "${AI_BRANCH}" --force
          else
            echo "No working tree diff to commit, pushing branch state..."
            git push -u origin "${AI_BRANCH}" --force || true
          fi

          TARGET_PR="${PR_NUM:-custom}"
          PR_TITLE="[AI] Fix conflicts and builds for PR #${TARGET_PR}"
          PR_BODY="### Vertex AI Rebase Agent Resolution

          Automated rebase resolution for target PR #${TARGET_PR}.
          - **Status**: $([[ "${IS_RESOLVED}" == "true" ]] && echo "✅ Build Verified" || echo "⚠️ In Progress")
          - **AI Branch**: \`${AI_BRANCH}\`
          - **Target Base**: \`${BASE_BRANCH}\`"

          EXISTING_PR=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${AI_BRANCH}" --json number --jq '.[0].number // ""')
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "Updating existing AI PR #${EXISTING_PR}..."
            gh pr edit "${EXISTING_PR}" --repo "${GITHUB_REPOSITORY}" --title "${PR_TITLE}" --body "${PR_BODY}"
          else
            echo "Creating new AI PR for ${AI_BRANCH} against ${BASE_BRANCH}..."
            gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base "${BASE_BRANCH}" \
              --head "${AI_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
          fi
