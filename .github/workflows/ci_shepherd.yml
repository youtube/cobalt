# Disable dangerous-triggers rule because this workflow uses workflow_run
# strictly to deflake tests and generate reports, without checking out
# or executing untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: CI Shepherd

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [android, aosp, evergreen, linux, tvos]
    types:
      - in_progress
      - completed
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Workflow name'
        required: true
        type: choice
        options: [android, aosp, evergreen, linux, tvos]
      pr_number:
        description: 'Pull request number'
        required: true
        type: string
      action:
        description: 'Event action'
        required: true
        type: choice
        options: [in_progress, completed]

permissions:
  contents: read

jobs:
  init-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      actions: read
    outputs:
      pr_number: ${{ steps.anchor.outputs.pr_number }}
      comment_id: ${{ steps.anchor.outputs.comment_id }}
      head_sha: ${{ steps.anchor.outputs.head_sha }}
      workflow_state: ${{ steps.report.outputs.state }}
    steps:
      - name: Create Anchor Comment
        id: anchor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER_INPUT:-}"
          head_sha="${HEAD_SHA:-}"

          if [[ -z "${pr_number}" && -n "${head_sha}" ]]; then
            pr_number=$(gh pr list --repo "${REPO}" --search "${head_sha}" --json number --jq '.[0].number // ""')
          fi

          if [[ -z "${head_sha}" && -n "${pr_number}" ]]; then
            head_sha=$(gh pr view "${pr_number}" --repo "${REPO}" --json headRefOid -q .headRefOid)
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

          if [[ -z "${pr_number}" ]]; then
            echo "No PR found. Skipping anchor comment creation."
            exit 0
          fi

          header="<!-- sticky-pull-request-comment: shepherd-report -->"

          # Check for existing comment with header across all pages (--paginate) safely
          comments_json=$(gh api --paginate "repos/${REPO}/issues/${pr_number}/comments" 2>/dev/null || true)
          matching_ids=($(printf '%s\n' "${comments_json}" | jq -s -r --arg h "${header}" '[.[][]? | objects | select((.body // "") | contains($h)) | .id] | .[]' 2>/dev/null || true))

          if [[ ${#matching_ids[@]} -gt 0 ]]; then
            existing_comment_id="${matching_ids[0]}"
            echo "Anchor comment already exists (${existing_comment_id}) on PR #${pr_number}."
            for extra_id in "${matching_ids[@]:1}"; do
              echo "Removing duplicate anchor comment ${extra_id} on PR #${pr_number}"
              gh api -X DELETE "repos/${REPO}/issues/comments/${extra_id}" --silent 2>/dev/null || true
            done
          else
            echo "Creating empty anchor sticky PR comment on PR #${pr_number}"
            json_payload=$(jq -n --arg b "${header}" '{body: $b}')
            existing_comment_id=$(echo "${json_payload}" | gh api -X POST "repos/${REPO}/issues/${pr_number}/comments" --input - --jq '.id')
          fi

          echo "comment_id=${existing_comment_id}" >> "${GITHUB_OUTPUT}"

      - name: Parse Workflow Report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.workflow_name }}
          STATUS: ${{ github.event.workflow_run.status || inputs.action || 'none' }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || 1 }}
          HEAD_SHA: ${{ steps.anchor.outputs.head_sha }}
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${WORKFLOW}" && -n "${HEAD_SHA}" && -n "${WORKFLOW_NAME:-}" ]]; then
            WORKFLOW=$(gh run list --repo "${REPO}" --commit "${HEAD_SHA}" --workflow "${WORKFLOW_NAME}.yaml" -q '.[0].databaseId' 2>/dev/null || true)
          fi

          if [[ -n "${WORKFLOW}" ]]; then
            live_run=$(gh run view --repo "${REPO}" "${WORKFLOW}" --json status,conclusion,attempt 2>/dev/null || true)
            if [[ -n "${live_run}" ]]; then
              live_status=$(echo "${live_run}" | jq -r '.status // empty')
              live_attempt=$(echo "${live_run}" | jq -r '.attempt // empty')
              if [[ -n "${live_status}" ]]; then
                STATUS="${ACTION:-${live_status}}"
              fi
              if [[ -n "${live_attempt}" ]]; then
                RUN_ATTEMPT="${live_attempt}"
              fi
            fi
          fi

          # Download latest shepherd-report artifacts per name by artifact ID
          mkdir -p shepherd_artifacts
          artifact_ids=()
          if [[ -n "${WORKFLOW}" ]]; then
            artifact_ids=($(gh api "repos/${REPO}/actions/runs/${WORKFLOW}/artifacts" --jq '
              [.artifacts[]? | select(.name | startswith("shepherd-report-"))] |
              group_by(.name)[] | max_by(.id) | .id
            ' 2>/dev/null || true))
          fi

          if [[ ${#artifact_ids[@]} -eq 0 ]]; then
            if [[ "${STATUS}" == "completed" ]]; then
              state="failure"
              desc="Failed"
            else
              state="pending"
              desc="Checks are running"
              if [[ "${RUN_ATTEMPT}" -gt 1 ]]; then
                desc="Retrying failed jobs"
              fi
            fi
          else
            for aid in "${artifact_ids[@]}"; do
              gh api "repos/${REPO}/actions/artifacts/${aid}/zip" > "${aid}.zip"
              unzip -qo "${aid}.zip" -d "shepherd_artifacts/${aid}"
              rm -f "${aid}.zip"
            done

            shopt -s globstar nullglob
            reports=(shepherd_artifacts/**/shepherd_report.json)
            if [[ ${#reports[@]} -eq 0 ]]; then
              state="failure"
              desc="Failed"
            else
              has_failures=$(jq -s '
                if length == 0 then true
                else
                  any(.[];
                    any(.checks | objects | .[]?; . == "failure" or . == "cancelled")
                    or
                    any((.test_failures | objects | .failing_tests // .) | objects | .[]?; (arrays | length) > 0)
                  )
                end
              ' "${reports[@]}" 2>/dev/null || echo "true")

              if [[ "${has_failures}" == "true" ]]; then
                state="failure"
                desc="Failed"
              else
                state="success"
                desc="Passed"
              fi
            fi
          fi

          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "desc=${desc}" >> "${GITHUB_OUTPUT}"
          echo "workflow_id=${WORKFLOW}" >> "${GITHUB_OUTPUT}"

      - name: Update Triggering Workflow Commit Status
        id: update-status
        if: steps.anchor.outputs.head_sha != '' && (github.event.workflow_run.name != '' || inputs.workflow_name != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.anchor.outputs.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.workflow_name }}
          WORKFLOW_ID: ${{ steps.report.outputs.workflow_id }}
          STATE: ${{ steps.report.outputs.state }}
          DESC: ${{ steps.report.outputs.desc }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          run_url="${RUN_URL:-}"
          if [[ -z "${run_url}" && -n "${WORKFLOW_ID}" ]]; then
            run_url="https://github.com/${REPO}/actions/runs/${WORKFLOW_ID}"
          fi

          params=(-f state="${STATE}" -f description="${DESC}" -f context="CI / ${WORKFLOW_NAME}")
          if [[ -n "${run_url}" ]]; then
            params+=(-f target_url="${run_url}")
          fi

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" "${params[@]}"

  deflake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      statuses: write
    outputs:
      rerun_triggered: ${{ steps.rerun.outputs.rerun_triggered || 'false' }}
    steps:
      - name: Checkout
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Rerun Failing Tests
        id: rerun
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha=$(git ls-remote "https://github.com/${HEAD_REPO}.git" "refs/heads/${HEAD_BRANCH}" 2>/dev/null | cut -f1) || true
          if [[ -n "${current_sha}" && "${current_sha}" != "${HEAD_SHA}" ]]; then
            echo "Branch head moved to ${current_sha} (run SHA: ${HEAD_SHA}). Skipping rerun."
            exit 0
          fi

          # Max number of times the tests should run.
          MAX_ATTEMPTS=3
          if [[ -f .github/config/infra/deflake.json ]]; then
            MAX_ATTEMPTS=$(jq -r '.deflake_runs | tonumber? // 3' .github/config/infra/deflake.json)
          fi

          # This call fails until the workflow has run $MAX_ATTEMPTS times.
          if gh run view --repo "${REPO}" "${WORKFLOW}" --attempt "${MAX_ATTEMPTS}" 2>/dev/null; then
            echo "Done retrying ${WORKFLOW_NAME}. It is still failing after ${MAX_ATTEMPTS} attempts."
            echo "rerun_triggered=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Check if there are failing _tests jobs to rerun.
          failed_tests=$(gh run view --repo "${REPO}" "${WORKFLOW}" --json jobs --jq '[.jobs[] | select(.conclusion=="failure") | select(.name | contains("_tests"))] | length')

          if [[ "${failed_tests}" -eq 0 ]]; then
            echo "No failing '_tests' jobs found to rerun."
            echo "rerun_triggered=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Rerun all failed jobs under the workflow all in one go.
          echo "Rerunning failed jobs under https://github.com/${REPO}/actions/runs/${WORKFLOW}"
          gh run rerun --repo "${REPO}" "${WORKFLOW}" --failed
          echo "rerun_triggered=true" >> "${GITHUB_OUTPUT}"

          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="pending" \
            -f target_url="${RUN_URL}" \
            -f description="Retrying failed jobs" \
            -f context="CI / ${WORKFLOW_NAME}" 2>/dev/null || true

          # Sleep to allow GitHub API to transition the run status to in_progress/queued
          sleep 5

  shepherd-analysis:
    runs-on: ubuntu-latest
    needs: [deflake, init-comment]
    if: always() && needs.deflake.outputs.rerun_triggered == 'false' && !cancelled()
    concurrency:
      group: shepherd-analysis-${{ needs.init-comment.outputs.head_sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    outputs:
      overall_state: ${{ steps.extract.outputs.overall_state }}
      overall_desc: ${{ steps.extract.outputs.overall_desc }}
      findings: ${{ steps.extract.outputs.findings }}
    steps:
      - name: Parse CI Statuses
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.init-comment.outputs.head_sha || github.event.workflow_run.head_sha }}
          RERUN_TRIGGERED: ${{ needs.deflake.outputs.rerun_triggered || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || echo "{}")

          # Check if CI / All Pass has already been finalized by a previous run
          already_finalized=$(echo "${status_json}" | jq -r '
            [.statuses[]? | select(.context == "CI / All Pass" and (.state == "success" or .state == "failure"))] | length > 0
          ')

          if [[ "${already_finalized}" == "true" && "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "CI / All Pass already finalized by an earlier run. Skipping analysis."
            echo "run_analysis=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          IFS=$'\t' read -r all_done overall_state overall_desc has_failure < <(echo "${status_json}" | jq -r --arg rerun "${RERUN_TRIGGERED}" '
            [.statuses[]? | select(.context | startswith("CI /")?) | select(.context != "CI / All Pass")] as $ci |
            ($ci | length > 0 and ($ci | all(.state != "pending")) and $rerun != "true") as $done |
            ($ci | any(.state == "failure" or .state == "error")) as $failed |
            if ($done | not) then
              "false\tpending\tChecks are running\t\($failed)"
            elif $failed then
              "true\tfailure\tChecks failed\ttrue"
            else
              "true\tsuccess\tAll checks passed\tfalse"
            end
          ') || true

          if [[ "${all_done}" == "true" && "${has_failure}" == "true" ]]; then
            echo "run_analysis=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_analysis=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "overall_state=${overall_state:-pending}" >> "${GITHUB_OUTPUT}"
          echo "overall_desc=${overall_desc:-Checks are running}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR files
        if: steps.parse.outputs.run_analysis == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.init-comment.outputs.head_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .agent

      - name: Run Gemini PR Shepherd Analysis
        id: gemini-analysis
        if: steps.parse.outputs.run_analysis == 'true'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_DEBUG: 'true'
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
          github_pr_number: ${{ needs.init-comment.outputs.pr_number }}
          upload_artifacts: true
          prompt: |
            Analyze the CI test failures for this pull request using the pr-shepherd skill (github.com/youtube/cobalt/pull/12679).
            Provide your final determination as a JSON object with the following fields:
            - "verdict": "failure" (if real failure in PR), "flaky" (if failures are due to flakes/infra), or "pass" (if all passed)
            - "confidence": a number from 0 to 1 indicating your confidence in the verdict
            - "findings_summary": markdown text explaining the root cause and triage recommendations to append to the PR comment

            For a flaky verdict all retries of a workflow run must be analyzed/triaged.

      - name: Extract Analysis Results
        id: extract
        if: always() && !cancelled()
        env:
          RUN_ANALYSIS: ${{ steps.parse.outputs.run_analysis || 'false' }}
          PARSE_STATE: ${{ steps.parse.outputs.overall_state || 'pending' }}
          PARSE_DESC: ${{ steps.parse.outputs.overall_desc || 'Checks are running' }}
          AGENT_SUMMARY: ${{ steps.gemini-analysis.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail

          overall_state="${PARSE_STATE}"
          overall_desc="${PARSE_DESC}"
          verdict=""
          findings=""

          if [[ "${RUN_ANALYSIS}" == "true" && -n "${AGENT_SUMMARY:-}" ]]; then
            verdict=$(echo "${AGENT_SUMMARY}" | jq -r '.verdict // empty' 2>/dev/null || true)
            findings=$(echo "${AGENT_SUMMARY}" | jq -r '.findings_summary // empty' 2>/dev/null || true)
            if [[ -z "${findings}" ]]; then
              findings="${AGENT_SUMMARY}"
            fi

            if [[ "${verdict}" == "flaky" ]]; then
              overall_state="success"
              overall_desc="Failures identified as flakes"
            else
              overall_state="failure"
              overall_desc="Checks failed"
            fi
          fi

          echo "overall_state=${overall_state}" >> "${GITHUB_OUTPUT}"
          echo "overall_desc=${overall_desc}" >> "${GITHUB_OUTPUT}"

          DELIMITER=$(openssl rand -hex 16)
          {
            echo "findings<<${DELIMITER}"
            echo "${findings}"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"

  comment-pr:
    runs-on: ubuntu-latest
    needs: [init-comment, shepherd-analysis]
    if: always() && needs.init-comment.outputs.pr_number != '' && !cancelled()
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Generate and Post Shepherd Report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.init-comment.outputs.head_sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ needs.init-comment.outputs.pr_number }}
          COMMENT_ID: ${{ needs.init-comment.outputs.comment_id }}
          OVERALL_STATE: ${{ needs.shepherd-analysis.outputs.overall_state }}
          OVERALL_DESC: ${{ needs.shepherd-analysis.outputs.overall_desc }}
          FINDINGS: ${{ needs.shepherd-analysis.outputs.findings }}
        shell: bash
        run: |
          set -euo pipefail

          # Update the overall status if all checks are done
          if [[ -n "${OVERALL_STATE:-}" && "${OVERALL_STATE}" != "pending" ]]; then
            all_pass_url="https://github.com/${REPO}/commit/${HEAD_SHA}"
            if [[ -n "${PR_NUMBER}" ]]; then
              all_pass_url="https://github.com/${REPO}/pull/${PR_NUMBER}"
            fi

            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="${OVERALL_STATE}" \
              -f target_url="${all_pass_url}" \
              -f description="${OVERALL_DESC}" \
              -f context="CI / All Pass"

            # Sleep to allow GitHub API to propagate the updated commit status
            sleep 10
          fi

          # Generate markdown status table from the commit statuses.
          {
            echo "| Context | State | Description |"
            echo "|---|---|---|"
          } > shepherd_report.md

          status_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || echo "{}")
          echo "${status_json}" | jq -r '
            {success: "✅ PASS", pending: "⏳ PENDING"} as $icons |
            .statuses // [] | sort_by(.context)[] | select(.context | startswith("CI /")?) |
            "| [\(.context)](\(.target_url // "")) | \($icons[.state] // "❌ FAIL") | \(.description // "") |"
          ' >> shepherd_report.md

          if [[ -n "${FINDINGS:-}" ]]; then
            {
              echo ""
              echo "### 🤖 CI Shepherd Analysis"
              echo ""
              echo "${FINDINGS}"
            } >> shepherd_report.md
          fi

          # Update the anchor comment
          header="<!-- sticky-pull-request-comment: shepherd-report -->"
          comment_body="${header}"$'\n'"$(cat shepherd_report.md)"
          json_payload=$(jq -n --arg b "${comment_body}" '{body: $b}')
          echo "${json_payload}" | gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" --input - --silent
