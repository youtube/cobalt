name: Web Tests
description: Runs Blink Web Tests.
inputs:
  test_artifacts_key:
    description: "Artifact key used to store test artifacts."
    required: true
  test_results_key:
    description: "Artifact key used to store test results."
    required: true
runs:
  using: "composite"
  steps:
    - name: Download and Extract Test Artifacts from GCS
      uses: ./.github/actions/download_test_artifacts
      with:
        test_artifacts_key: ${{ inputs.test_artifacts_key }}
        archive_name: test_artifacts.tar.zstd
        extract: "true"
        extract_path: cobalt/src
    - name: Run Web Tests
      id: run-tests
      shell: bash
      working-directory: cobalt/src
      env:
        TEST_PATH: wpt_internal/cobalt
        PLATFORM: ${{ matrix.platform }}
        CONFIG: ${{ matrix.config }}
      run: |
        set -x
        env

        RESULTS_DIR="out/${PLATFORM}_${CONFIG}/layout-test-results"
        echo "RESULTS_DIR=${RESULTS_DIR}" >> "${GITHUB_ENV}"

        third_party/blink/tools/run_web_tests.py \
          --driver-logging \
          --additional-driver-flag="--no-sandbox" \
          --debug \
          --no-show-results \
          --target "${PLATFORM}_${CONFIG}" \
          "${TEST_PATH}"

        echo "Finished running tests..."
    - name: Archive Test Results
      if: always() && contains(fromJson('["success", "failed"]'), steps.run-tests.outcome)
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: ${{ inputs.test_results_key }}
        path: cobalt/src/${{ env.RESULTS_DIR }}/*
