name: Build Cobalt
description: Builds Cobalt targets
inputs:
  targets:
    description: "JSON list of ninja targets for Cobalt build."
    required: true
  test_root_target:
    description: "The root target from which to deduce what tests to run."
    required: true
  test_targets_json_file:
    description: "The path to the file the test targets are written to."
    required: true
  enable_sccache:
    description: Use sccache for build acceleration.
    default: 'false'
  sccache_gcs_key:
    description: GCS SA key to read/write to bucket
outputs:
  skip:
    description: "Set to true when the platform build was skipped."
    value: ${{ steps.filter-platform.outputs.skip }}
runs:
  using: "composite"
  steps:
      - name: Clean out dir from previous runner
        run: |
          rm -rf cobalt/src/out
        shell: bash
      - name: Install sccache
        if: inputs.enable_sccache == 'true'
        uses: ./.github/actions/sccache
        with:
          sccache_gcs_key: ${{ inputs.sccache_gcs_key }}
      - name: GN gen
        env:
          ENABLE_SCCACHE: ${{ inputs.enable_sccache }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        working-directory: cobalt/src
        run: |
          gn_flags=()
          if [[ "${PLATFORM}" == *"tvos"* ]]; then
            # TvOS does not use RBE unless it's sccache
            gn_flags+=(--no-rbe)
          fi
          if [[ "${ENABLE_SCCACHE}" == "true" ]]; then
            gn_flags+=(--use-sccache)
          fi
          cobalt/build/gn.py -p "${PLATFORM}" -C "${CONFIG}" "${gn_flags[@]}"
        shell: bash
      - name: Configure Siso Credential Helper
        shell: bash
        run: |
          echo "SISO_CREDENTIAL_HELPER=gcloud" >> "${GITHUB_ENV}"
      - name: List GN args
        env:
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        working-directory: cobalt/src
        run: |
          gn args --list --short --overrides-only out/"${PLATFORM}_${CONFIG}"
        shell: bash
      - name: Get list of changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        env:
          CHANGED_FILES_LIST: changed_files.txt
        working-directory: cobalt/src
        run: |
          set -x
          git -c core.quotepath=off diff --name-only --no-renames HEAD~1 HEAD > ${CHANGED_FILES_LIST}
          cat ${CHANGED_FILES_LIST}
        shell: bash
      - name: Filter platform
        id: filter-platform
        working-directory: cobalt/src
        shell: bash
        run: |
          set -ex
          skip="false"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            skip=$(python3 cobalt/build/filter_platform.py \
              --out-dir "out/${{ matrix.platform }}_${{ matrix.config }}" \
              --changed-files changed_files.txt \
              --targets '${{ inputs.targets }}' \
              --test-root-target "${{ inputs.test_root_target }}")
          fi
          echo "skip=${skip}" >> $GITHUB_OUTPUT
      - name: Calculate test targets
        # TODO(b/382508397): Ignore test_root_target until test target listing is dynamic.
        if: steps.filter-platform.outputs.skip != 'true' && matrix.config == 'devel' # && inputs.test_root_target != 'null'
        id: calculate-test-targets
        env:
          CHANGED_FILES_LIST: changed_files.txt
          ROOT_TARGET: ${{ inputs.test_root_target }}
          STATIC_TEST_TARGETS_JSON_FILE: cobalt/build/testing/targets/${{ matrix.platform }}/test_targets.json
          # TODO(b/382508397): Replace hardcoded list with dynamically generated one.
          DYN_TEST_TARGETS_JSON_FILE: out/${{ matrix.platform }}_${{ matrix.config }}/dyn_targets.json
          TEST_TARGETS_JSON_FILE: ${{ inputs.test_targets_json_file }}
        working-directory: cobalt/src
        run: |
          set -x

          if [[ ! -f "${STATIC_TEST_TARGETS_JSON_FILE}" ]]; then
            echo "Static test targets file not found at ${STATIC_TEST_TARGETS_JSON_FILE}. Skipping step."
            echo "test_targets_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # TODO: b/382508397 - Currently, override with static test targets
          cp -av "${STATIC_TEST_TARGETS_JSON_FILE}" "${TEST_TARGETS_JSON_FILE}"

          test_targets_json=$(jq -cr '[.[] | select(.target != null) | .target]' "${TEST_TARGETS_JSON_FILE}")
          echo "test_targets_json=${test_targets_json}" >> "${GITHUB_OUTPUT}"

          test_targets_count=$(echo "${test_targets_json}" | jq -cr 'length')
          echo "test_targets_count=${test_targets_count}" >> "${GITHUB_OUTPUT}"
        shell: bash
      - name: Archive test target JSON
        if: steps.filter-platform.outputs.skip != 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.platform }}_test_targets_json
          path: cobalt/src/out/${{ matrix.platform }}_${{ matrix.config }}/test_targets.json
      - name: Ninja build test targets
        if: ${{ steps.filter-platform.outputs.skip != 'true' && matrix.config == 'devel' && fromJSON(steps.calculate-test-targets.outputs.test_targets_count || 0) > 0 }}
        id: build-test-targets
        working-directory: cobalt/src
        env:
          TEST_TARGETS_JSON: ${{ steps.calculate-test-targets.outputs.test_targets_json }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -ex
          readarray -t test_targets < <(echo "${TEST_TARGETS_JSON:-[]}" | jq -r '.[]')
          time autoninja -C out/"${PLATFORM}_${CONFIG}" "${test_targets[@]}"
        shell: bash
      - name: Ninja build
        if: steps.filter-platform.outputs.skip != 'true'
        working-directory: cobalt/src
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          USE_SCCACHE: ${{ inputs.enable_sccache }}
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -ex
          readarray -t targets < <(echo "${TARGETS_JSON:-[]}" | jq -r '.[]')
          time autoninja -C out/"${PLATFORM}_${CONFIG}" "${targets[@]}"
          if [[ "${USE_SCCACHE}" == "true" ]]; then
            sccache --show-stats
          fi
        shell: bash
      - name: Archive Android APKs
        if: steps.filter-platform.outputs.skip != 'true' && (startsWith(matrix.platform, 'android') || contains(matrix.platform, 'aosp')) && matrix.config == 'qa'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.platform }} APKs
          path: |
            cobalt/src/out/${{ matrix.platform }}_qa/apks/*.apk
            cobalt/src/out/${{ matrix.platform }}_qa/*_apk/*.apk
            cobalt/src/out/${{ matrix.platform }}_qa/gen/build_info.json
