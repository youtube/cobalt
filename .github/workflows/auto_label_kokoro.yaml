# pull_request_target is needed to label PRs. The tvOS impact analysis runs PR
# code (GN exec_script) only for committer PRs, like main.yaml does.
# actionlint: disable dangerous-triggers
name: Auto Label Kokoro

# tvos.yaml looks up this run by name.
run-name: Auto Label Kokoro (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }} (${{ github.event.action }}))

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - staging
      - autoroll-chromium/main-to-staging
      - 'stack/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-author:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_committer: ${{ steps.check.outputs.is_committer }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          permission=$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq .permission || echo none)
          echo "${PR_AUTHOR}: association ${AUTHOR_ASSOC}, permission ${permission}"
          is_committer=false
          if [[ "${AUTHOR_ASSOC}" =~ ^(OWNER|MEMBER|COLLABORATOR)$ || "${permission}" =~ ^(admin|write)$ ]]; then
            is_committer=true
          fi
          echo "is_committer=${is_committer}" >> "${GITHUB_OUTPUT}"

  analyze-tvos-impact:
    needs: check-author
    if: github.event.pull_request.draft == false && needs.check-author.outputs.is_committer == 'true'
    runs-on: [self-hosted, chrobalt-linux-runner]
    permissions:
      contents: read
    timeout-minutes: 20
    container:
      image: ghcr.io/youtube/cobalt/linux:main
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /runner-cache:/runner-cache
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    outputs:
      affects_tvos: ${{ steps.analyze.outputs.affects_tvos }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            cobalt/build

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Prepare OverlayFS Workspace
        uses: ./.github/actions/overlay_workspace
        with:
          path: cobalt
          use_gcloud: true

      - name: Checkout
        uses: ./.github/actions/checkout
        with:
          path: cobalt/src
          ref: ${{ github.sha }}
          fetch_depth: 1
          use_cache: true

      # github.sha is the base branch tip in pull_request_target. GitHub updates
      # refs/pull/<num>/merge asynchronously, so wait until it merges the head.
      - name: Check Out PR Merge Commit
        working-directory: cobalt/src
        env:
          MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in {1..6}; do
            git fetch --no-tags --depth=2 origin "${MERGE_REF}" &&
              [[ "$(git rev-parse FETCH_HEAD^2)" == "${PR_HEAD_SHA}" ]] && break
            sleep 10
          done
          [[ "$(git rev-parse FETCH_HEAD^2)" == "${PR_HEAD_SHA}" ]] ||
            { echo "::error::${MERGE_REF} is outdated or missing (merge conflict?)"; exit 1; }
          git checkout --detach FETCH_HEAD
          git diff --name-only --no-renames HEAD^1 HEAD | tee "${RUNNER_TEMP}/changed_files.txt"

      - name: Check tvOS Build Impact
        id: analyze
        working-directory: cobalt/src
        env:
          TEST_TARGETS: ${{ steps.parse-targets.outputs.test_targets_json }}
          # Changes that gn analyze can't see.
          ALWAYS_AFFECTS_TVOS: ^(DEPS$|\.gn$|build/|build_overrides/|cobalt/build/|cobalt/devinfra/kokoro/|cobalt/testing/filters/tvos-arm64-simulator/|\.github/workflows/(tvos|auto_label_kokoro)\.yaml$)
          HEADERS: \.(h|hh|hpp|inc|inl|def)$
        run: |
          export PATH="/runner-cache/golden-workspace/depot_tools:${GITHUB_WORKSPACE}/cobalt/depot_tools:${PATH}"
          files="${RUNNER_TEMP}/changed_files.txt"
          if grep -qE "${ALWAYS_AFFECTS_TVOS}" "${files}"; then
            echo "affects_tvos=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          out="${RUNNER_TEMP}/out"
          wrapper="--script-executable=${PWD}/cobalt/build/tvos_linux_script_wrapper.py"
          python3 cobalt/build/gn.py "${out}" -p tvos-arm64-simulator -C devel --no-rbe --no-check "${wrapper}"

          # gn analyze only knows headers listed in BUILD.gn, so add includers.
          for header in $(grep -E "${HEADERS}" "${files}"); do
            git grep -lF "\"${header}\"" -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.m' '*.mm' '*.h' '*.hh' '*.hpp' '*.inc' '*.inl' '*.def' >> "${files}" || true
          done

          jq -nR --argjson targets "${TEST_TARGETS}" '{
            files: [inputs | select(. != "") | "//" + .] | unique,
            test_targets: [$targets[] | "//" + .],
            additional_compile_targets: ["//cobalt:cobalt"]
          }' < "${files}" > "${out}/analyze_in.json"
          gn analyze "${out}" "${out}/analyze_in.json" "${out}/analyze_out.json" "${wrapper}"
          cat "${out}/analyze_out.json"
          status=$(jq -r .status "${out}/analyze_out.json")
          echo "affects_tvos=$([[ "${status}" == "No dependency" ]] && echo false || echo true)" >> "${GITHUB_OUTPUT}"

  label-kokoro-run:
    needs: [check-author, analyze-tvos-impact]
    # Also labels if the analysis failed.
    if: >-
      always() && !cancelled() &&
      needs.check-author.outputs.is_committer == 'true' &&
      (needs.analyze-tvos-impact.result != 'success' ||
       needs.analyze-tvos-impact.outputs.affects_tvos == 'true')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "${PR_URL}" --add-label kokoro:run
