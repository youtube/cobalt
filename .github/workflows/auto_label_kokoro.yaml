name: Auto Label Kokoro

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - experimental/*
      - feature/*

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  label-kokoro-run:
    runs-on: ubuntu-latest
    if: !github.event.pull_request.draft
    steps:
      - name: Apply kokoro:run label to PR for collaborators/committers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          PERMISSION=$(gh api "repos/${REPO}/collaborators/${PR_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Author '${PR_AUTHOR}' permission level: ${PERMISSION}"

          if [[ "${PERMISSION}" != "none" ]]; then
            if ! echo "$PR_LABELS" | jq -e '.[] | select(.name == "kokoro:run")' > /dev/null; then
              echo "Author is a collaborator/committer. Applying kokoro:run label..."
              gh pr edit "$PR_URL" --add-label "kokoro:run" || true
            else
              echo "kokoro:run label is already present."
            fi
          else
            echo "Author '${PR_AUTHOR}' is an outside contributor without collaborator access. Skipping auto-labeling."
          fi
