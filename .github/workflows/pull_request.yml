# Disable dangerous-triggers rule because this workflow uses pull_request_target
# and issue_comment strictly for PR automation (anchor comment, commit statuses,
# and commit message generation) without checking out or executing untrusted
# code from PR branches.
# actionlint: disable dangerous-triggers
name: 'Pull Request Automation'

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-shepherd-anchor:
    name: Initialize CI Shepherd Anchor
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Initialize Anchor Comment and Commit Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail

          header="<!-- sticky-pull-request-comment: shepherd-report -->"

          # 1. Determine contexts: on synchronize pull existing CI / statuses, otherwise default to CI / All Pass
          contexts=("CI / All Pass")
          if [[ "${EVENT_ACTION}" == "synchronize" && -n "${BEFORE_SHA:-}" ]]; then
            mapfile -t prev_contexts < <(gh api "repos/${REPO}/commits/${BEFORE_SHA}/status" 2>/dev/null \
              | jq -r '.statuses[]? | select(.context | startswith("CI /")) | .context' 2>/dev/null | sort -u || true)
            contexts+=("${prev_contexts[@]}")
          fi
          mapfile -t contexts < <(printf '%s\n' "${contexts[@]}" | grep -v '^$' | sort -u)

          # 2. Reset all CI / commit statuses to pending on HEAD_SHA
          for ctx in "${contexts[@]}"; do
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="pending" \
              -f description="Checks are running" \
              -f context="${ctx}" || true
          done

          # 3. Build anchor comment table
          table=$(printf '| Context | State | Description |\n|---|---|---|')
          for ctx in "${contexts[@]}"; do
            table+=$(printf '\n| %s | ⏳ PENDING | Checks are running |' "${ctx}")
          done
          body=$(printf '%s\n\n%s' "${header}" "${table}")

          # 4. Create or patch anchor comment
          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" 2>/dev/null \
            | jq -r --arg h "${header}" '.[]? | select((.body // "") | contains($h)) | .id' | head -n1 || true)

          if [[ -n "${comment_id}" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="${body}" --silent
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" --silent
          fi

  pull_request_review:
    name: 'Pull Request Review & Commit Message'
    needs: [ci-shepherd-anchor]
    if: >
      always() && !cancelled() && (
        (github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
          startsWith(github.event.comment.body, '/generate-commit-message') ||
          startsWith(github.event.comment.body, '/owner-review')
        ))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_comment: ${{ steps.format_comment.outputs.has_comment }}
      pr_number: ${{ steps.format_comment.outputs.pr_number }}
      comment_body: ${{ steps.format_comment.outputs.comment_body }}

    steps:
      - name: 'Check Trigger'
        id: trigger
        env:
          EVENT: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}${{ github.event.issue.user.login }}
        run: |
          [[ "${AUTHOR}" =~ -bot$ ]] && exit 0
          [[ "${EVENT}" == "pull_request_target" || "${COMMENT}" == "/generate-commit-message"* ]] && echo "commit_msg=true" >> "${GITHUB_OUTPUT}"
          [[ "${EVENT}" == "pull_request_target" || "${COMMENT}" == "/owner-review"* ]] && echo "owner_rev=true" >> "${GITHUB_OUTPUT}"

      - name: 'Checkout prompts'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .agent
            .github
          sparse-checkout-cone-mode: false

      - name: 'Get PR Diff'
        env:
          URL: ${{ github.event.pull_request.url }}${{ github.event.issue.pull_request.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.v3.diff" "${URL}" > "${RUNNER_TEMP}/pr.diff"
          gh api "${URL}/files" --paginate --jq '.[].filename' > "${RUNNER_TEMP}/changed_files.txt"

      - name: 'Prepare Commit Prompt'
        id: commit_prompt
        if: steps.trigger.outputs.commit_msg == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}${{ github.event.issue.title }}
          BODY: ${{ github.event.pull_request.body }}${{ github.event.issue.body }}
        run: |
          prompt_file="${RUNNER_TEMP}/commit_prompt.txt"
          {
            cat .agent/commit_message_prompt.md
            echo ""
            echo "**PR Title:** ${TITLE}"
            echo "**PR Description:** ${BODY}"
            echo ""
            echo "<code_diff>"
            cat "${RUNNER_TEMP}/pr.diff"
            echo "</code_diff>"
          } > "${prompt_file}"
          {
            echo "prompt<<EOF"
            cat "${prompt_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Generate Commit Message'
        id: gemini_commit
        if: steps.trigger.outputs.commit_msg == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
          gemini_model: 'gemini-3.8-flash'
          instruction: ${{ steps.commit_prompt.outputs.prompt }}

      - name: 'Resolve Reviewers & Prompt'
        id: resolve_review
        if: steps.trigger.outputs.owner_rev == 'true'
        run: |
          prompt_file="${RUNNER_TEMP}/review_prompt.txt"
          mapfile -t changed_files < "${RUNNER_TEMP}/changed_files.txt"
          reviewer_paths=$(python3 .github/scripts/resolve_codeowners.py "${changed_files[@]}")
          if [ -n "${reviewer_paths}" ]; then
            echo "has_reviewers=true" >> "${GITHUB_OUTPUT}"
            echo "reviewer_paths=${reviewer_paths}" >> "${GITHUB_OUTPUT}"
            {
              echo "Review the PR diff below as the lead reviewer."
              echo "Run each matching reviewer persona as a subagent using its prompt file:"
              for rpath in ${reviewer_paths}; do
                echo "---"
                echo "Reviewer prompt (${rpath}):"
                cat "${rpath}"
                echo ""
              done
              echo "---"
              echo "Produce comments on lines with change suggestions integrated in \`\`\`suggestion blocks."
              echo "Return output in JSON format with fields:"
              echo '{"summary": "overall review summary", "comments": [{"path": "file/path", "line": 12, "body": "comment with ```suggestion\nreplacement\n```"}]}'
              echo ""
              echo "<code_diff>"
              cat "${RUNNER_TEMP}/pr.diff"
              echo "</code_diff>"
            } > "${prompt_file}"
            {
              echo "prompt<<EOF"
              cat "${prompt_file}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: 'Review with Gemini CLI'
        id: gemini_review
        if: steps.trigger.outputs.owner_rev == 'true' && steps.resolve_review.outputs.has_reviewers == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_ACTIONS_API_KEY }}
          gemini_model: 'gemini-3.8-flash'
          instruction: ${{ steps.resolve_review.outputs.prompt }}

      - name: 'Format Comment'
        id: format_comment
        env:
          COMMIT_MSG: ${{ steps.gemini_commit.outputs.summary || '' }}
          OWNER_REV: ${{ steps.gemini_review.outputs.summary || '' }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          out_file="${RUNNER_TEMP}/comment.md"
          json_file="${RUNNER_TEMP}/comments.json"
          echo "[]" > "${json_file}"
          rm -f "${out_file}"
          touch "${out_file}"

          if [ -n "${COMMIT_MSG}" ]; then
            echo "### 🤖 Gemini Suggested Commit Message" >> "${out_file}"
            echo "" >> "${out_file}"
            echo '```' >> "${out_file}"
            echo "${COMMIT_MSG}" >> "${out_file}"
            echo '```' >> "${out_file}"
            echo "" >> "${out_file}"
          fi

          if [ -n "${OWNER_REV}" ]; then
            [ -s "${out_file}" ] && echo "---" >> "${out_file}" && echo "" >> "${out_file}"
            echo "### 🛡️ CODEOWNERS Critic Review" >> "${out_file}"
            echo "" >> "${out_file}"

            if printf '%s\n' "${OWNER_REV}" | jq -e 'type == "object" and (.summary | type == "string") and (.comments | type == "array")' >/dev/null 2>&1; then
              printf '%s\n\n' "$(printf '%s\n' "${OWNER_REV}" | jq -r .summary)" >> "${out_file}"
              printf '%s\n' "${OWNER_REV}" | jq -c .comments > "${json_file}"
            else
              echo "[]" > "${json_file}"
              echo "Automated code review could not be generated for this change." >> "${out_file}"
              echo "" >> "${out_file}"
            fi
          fi

          if [ -s "${out_file}" ]; then
            echo "> **💡 Triggering reviews & commit messages:**" >> "${out_file}"
            echo "> - Comment \`/generate-commit-message\` to regenerate commit message." >> "${out_file}"
            echo "> - Comment \`/owner-review\` to trigger CODEOWNERS review." >> "${out_file}"
            echo "has_comment=true" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${PR_NUM}" >> "${GITHUB_OUTPUT}"
            {
              echo "comment_body<<EOF"
              cat "${out_file}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "review_comments<<EOF"
              cat "${json_file}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

  post_review_comment:
    name: 'Post Review Comment'
    needs: [pull_request_review]
    if: needs.pull_request_review.outputs.has_comment == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Post Comment'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ needs.pull_request_review.outputs.pr_number }}
          COMMENT_BODY: ${{ needs.pull_request_review.outputs.comment_body }}
          REVIEW_COMMENTS: ${{ needs.pull_request_review.outputs.review_comments }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const body = process.env.COMMENT_BODY;
            let comments = [];
            try {
              comments = JSON.parse(process.env.REVIEW_COMMENTS || '[]');
            } catch (_) {}

            if (comments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: body,
                  event: 'COMMENT',
                  comments: comments
                });
                return;
              } catch (err) {
                console.log('Failed to post inline review, falling back to top-level comment:', err.message);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
