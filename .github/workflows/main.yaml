          upload_chromedriver_test_artifacts: ${{ matrix.config == 'qa' && needs.initialize.outputs.test_chromedriver == 'true' }}
          test_targets_json_file: out/${{ matrix.platform }}_${{ matrix.config }}/test_targets.json
          platform: ${{ matrix.platform }}
          config: ${{ matrix.config }}

      - name: Archive Linux E2E Test Artifacts
        if: (matrix.config == 'qa' || matrix.config == 'devel') && needs.initialize.outputs.test_linux_e2e == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -x
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd cobalt/src
          python3 ./cobalt/build/archive_test_artifacts.py \
            --source-dir . \
            --out-dir "out/${PLATFORM}_${CONFIG}" \
            --destination-dir "${GITHUB_WORKSPACE}/artifacts" \
            --targets //cobalt:cobalt_loader \
            --compression zstd --compression-level=1
          if [ -f "${GITHUB_WORKSPACE}/artifacts/test_artifacts.tar.zstd" ]; then
