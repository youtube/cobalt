name: Cached Checkout
description: Generic git checkout with bare repository cache support.
inputs:
  repository:
    description: The url of the repo to checkout. Defaults to Cobalt.
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: Git ref to checkout.
    required: true
  path:
    description: Destination path.
    required: true
  fetch_depth:
    description: Number of commits to fetch.
    default: '1'
  use_cache:
    description: Whether to attempt using /runner-cache.
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Clone Repo
      env:
        REPO_URL: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DEST_PATH: ${{ inputs.path }}
        FETCH_DEPTH: ${{ inputs.fetch_depth }}
        USE_CACHE: ${{ inputs.use_cache }}
      shell: bash
      run: |
        set -ex

        depth_arg=()
        if [ "${FETCH_DEPTH}" -ne 0 ]; then
          depth_arg+=(--depth "${FETCH_DEPTH}")
        fi

        ref_args=()
        if [ ! -d "${DEST_PATH}/.git" ]; then
          if [[ "${USE_CACHE}" == "true" ]] && [[ -w "/runner-cache" ]]; then
            MIRROR="/runner-cache/git-cache/checkout/$(echo -n "${REPO_URL}" | sha256sum | cut -c1-16).git"
            mkdir -p "$(dirname "${MIRROR}")"

            # Use flock to serialize mirror initialization and updates across concurrent jobs
            # sharing the same node cache, preventing repository corruption during clone/fetch.
            lock_acquired=false
            if (
              flock -w 60 9 || exit 1
              if [ ! -f "${MIRROR}/config" ]; then
                git clone --mirror --no-tags "${REPO_URL}" "${MIRROR}" || rm -rf "${MIRROR}"
              elif ! git -C "${MIRROR}" fetch --prune origin 2>/dev/null; then
                echo "Warning: git fetch failed for mirror ${MIRROR}; keeping existing cache objects."
              fi
            ) 9>"${MIRROR}.lock" 2>/dev/null; then
              lock_acquired=true
            fi

            if [ "${lock_acquired}" = "true" ] && [ -d "${MIRROR}" ]; then
              ref_args=(--reference-if-able "${MIRROR}")
            fi
          fi

          for attempt in 1 2 3; do
            if git clone \
              --filter=blob:none \
              "${ref_args[@]}" \
              "${depth_arg[@]}" \
              "${REPO_URL}" \
              "${DEST_PATH}"; then
              break
            fi
            if [[ -n "${DEST_PATH}" && "${DEST_PATH}" != "." && "${DEST_PATH}" != "/" ]]; then
              rm -rf "${DEST_PATH}"
            else
              rm -rf "${DEST_PATH}/.git"
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
        else
          echo "Repository already exists at ${DEST_PATH}. Skipping clone."
        fi

        git config --global --add safe.directory "$(cd "${DEST_PATH}" && pwd)"

        if [[ "${REF}" =~ ^[0-9a-fA-F]{40}$ ]] && git -C "${DEST_PATH}" cat-file -e "${REF}^{commit}" 2>/dev/null; then
          echo "Commit ${REF} already exists in ${DEST_PATH}. Skipping fetch."
        else
          for attempt in 1 2 3; do
            if git -C "${DEST_PATH}" fetch "${depth_arg[@]}" origin "${REF}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
        fi
        CURRENT_HEAD=$(git -C "${DEST_PATH}" rev-parse HEAD 2>/dev/null || echo "")
        if [ -n "${CURRENT_HEAD}" ] && [ "${CURRENT_HEAD}" = "${REF}" ]; then
          echo "Workspace HEAD is already at ${REF}. Skipping checkout."
        elif ! git -C "${DEST_PATH}" checkout "${REF}" 2>/dev/null; then
          echo "Delta checkout encountered conflicts; falling back to forced checkout."
          git -C "${DEST_PATH}" checkout -f "${REF}"
        fi
