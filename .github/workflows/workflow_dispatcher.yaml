name: Workflow Dispatcher

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  dispatch:
    if: github.event.label.name == 'runtest' || github.event.label.name == 'yts_playback_test' || github.event.label.name == 'kokoro:run' || github.event.label.name == 'kokoro:force-run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Check label and trigger PR jobs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const labelName = context.payload.label.name;

            const PLATFORM_WORKFLOWS = [
              'android.yaml',
              'aosp.yaml',
              'evergreen.yaml',
              'linux.yaml',
              'tvos.yaml'
            ];

            let workflows = [];
            if (labelName === 'kokoro:run' || labelName === 'kokoro:force-run') {
              workflows = ['tvos.yaml'];
            } else {
              workflows = PLATFORM_WORKFLOWS;
            }

            console.log(`Triggering workflows for label ${labelName}:`, workflows);

            for (const workflow of workflows) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow,
                  head_sha: pr.head.sha,
                  event: 'pull_request'
                });

                if (runs.data.workflow_runs.length === 0) {
                  continue;
                }

                const latestRun = runs.data.workflow_runs[0];
                await github.rest.actions.rerunWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: latestRun.id
                });
              } catch (error) {
                console.error(`Failed to rerun ${workflow}:`, error);
              }
            }

            // Remove runtest label after triggering all workflows
            if (labelName === 'runtest') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: 'runtest'
                });
              } catch (error) {
                console.error('Failed to remove runtest label:', error);
              }
            }
