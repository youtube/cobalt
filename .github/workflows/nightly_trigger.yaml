name: nightly_trigger

on:
  schedule:
    # GMT timezone.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

env:
  GITHUB_REPO: ${{ github.repository }}

jobs:
  trigger_23:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Nightly
        run: |
          set -x
          gh workflow run android.yaml --ref 23.lts.1+ -f nightly=true --repo "${GITHUB_REPO}"
          gh workflow run evergreen.yaml --ref 23.lts.1+ -f nightly=true --repo "${GITHUB_REPO}"
          gh workflow run linux.yaml --ref 23.lts.1+ -f nightly=true --repo "${GITHUB_REPO}"
          gh workflow run raspi-2.yaml --ref 23.lts.1+ -f nightly=true --repo "${GITHUB_REPO}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trigger_22:
