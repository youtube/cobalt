name: On Device Test
description: Runs on-device tests.
inputs:
  nightly:
    description: "Indicates if this is a nightly job."
    required: true
  test_targets_json:
    description: "The test targets in a JSON array."
    required: true
  gcs_results_path:
    description: "GCS path for the test results."
    required: true
  test_results_key:
    description: "Artifact key used to store test results."
    required: true
  test_dimensions:
    description: "Test dimensions JSON string."
    required: true
  test_device_family:
    description: "Test device family."
    required: true
  test_attempts:
    description: "Number of attempts for the tests."
    default: ""
  retry_all:
    description: "Whether to retry all tests instead of analyzing previous results."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Prepare Test Filters
      id: prepare-test-filters
      uses: ./.github/actions/prepare_test_filters
      with:
        test_results_key: ${{ inputs.test_results_key }}
        platform: ${{ matrix.platform }}
        retry_all: ${{ inputs.retry_all }}
    - name: Install Requirements
      run: |
        pip3 install --require-hashes --no-deps -r "${GITHUB_WORKSPACE}/cobalt/tools/requirements.txt"
      shell: bash
    - name: Generate gRPC files
      run: |
        python -m grpc_tools.protoc -I"${GITHUB_WORKSPACE}/cobalt/tools/" \
            --python_out="${GITHUB_WORKSPACE}/cobalt/tools/" \
            --grpc_python_out="${GITHUB_WORKSPACE}/cobalt/tools/" \
            "${GITHUB_WORKSPACE}/cobalt/tools/on_device_tests_gateway.proto"
      shell: bash
    - name: Set Up Cloud SDK
      uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6 # v1.1.1
    - name: Set GCS Project Name
      run: |
        echo "PROJECT_NAME=$(gcloud config get-value project)" >> "${GITHUB_ENV}"
      shell: bash
    - name: Run Tests on ${{ matrix.platform }} Platform
      env:
        TEST_TARGETS_JSON: ${{ inputs.test_targets_json }}
        GCS_ARTIFACTS_PATH: /bigstore/${{ env.PROJECT_NAME }}-test-artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ matrix.platform }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        GITHUB_ACTOR_ID: ${{ github.actor_id }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_PR_HEAD_USER_LOGIN: ${{ github.event.pull_request.head.user.login }}
        GITHUB_PR_HEAD_USER_ID: ${{ github.event.pull_request.head.user.id }}
        GITHUB_COMMIT_AUTHOR_USERNAME: ${{ github.event.commits[0].author.username }}
        GITHUB_COMMIT_AUTHOR_EMAIL: ${{ github.event.commits[0].author.email }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GITHUB_BASE_REF: ${{ github.base_ref || github.ref_name }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        TEST_ATTEMPTS: ${{ inputs.test_attempts }}
        TEST_TYPE: unit_test
        PLATFORM: ${{ matrix.platform }}
        TEST_DEVICE_FAMILY: ${{ inputs.test_device_family }}
        TEST_DIMENSIONS: ${{ inputs.test_dimensions }}
        GCS_RESULTS_PATH: ${{ inputs.gcs_results_path }}
        FILTER_DIR: ${{ steps.prepare-test-filters.outputs.filter_dir }}
        PYTHONPATH: "${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
      run: |
        set -x

        # TODO(oxv): Fix dimensions. Pass as json? key-value pair?
        python3 -u cobalt/tools/on_device_tests_gateway_client.py \
          --token ${GITHUB_TOKEN} \
          trigger \
          --test_type ${TEST_TYPE} \
          --device_family "${TEST_DEVICE_FAMILY}" \
          --targets "${TEST_TARGETS_JSON}" \
          --filter_json_dir "${FILTER_DIR}" \
          --label chrobalt_on_device_test \
          --label github_${GITHUB_PR_NUMBER:-postsubmit} \
          --label builder-${PLATFORM} \
          --label builder_url-${GITHUB_RUN_URL} \
          --label ${TEST_TYPE} \
          --label github \
          --label ${GITHUB_EVENT_NAME} \
          --label ${GITHUB_WORKFLOW} \
          --label actor-${GITHUB_ACTOR} \
          --label actor_id-${GITHUB_ACTOR_ID} \
          --label triggering_actor-${GITHUB_TRIGGERING_ACTOR} \
          --label sha-${GITHUB_SHA} \
          --label repository-${GITHUB_REPO} \
          --label author-${GITHUB_PR_HEAD_USER_LOGIN:-${GITHUB_COMMIT_AUTHOR_USERNAME}} \
          --label author_id-${GITHUB_PR_HEAD_USER_ID:-${GITHUB_COMMIT_AUTHOR_EMAIL}} \
          --label branch:${GITHUB_REF_NAME} \
          --label target_branch:${GITHUB_BASE_REF} \
          --dimensions "${TEST_DIMENSIONS}" \
          ${TEST_ATTEMPTS:+"--test_attempts" "${TEST_ATTEMPTS}"} \
          --gcs_archive_path "${GCS_ARTIFACTS_PATH}" \
          --gcs_result_path "${GCS_RESULTS_PATH}" || {
            echo "Finished running tests..."
            echo "The test session failed. See logs for details."
            # Fail the job so it's easy to retrigger.
            exit 1
          }
        echo "Finished running tests..."
      shell: bash
    - name: Download ${{ matrix.platform }} Test Results from GCS
      if: always()
      env:
        TEST_TARGETS_JSON: ${{ inputs.test_targets_json }}
        PLATFORM: ${{ matrix.platform }}
        GCS_RESULTS_PATH: ${{ inputs.gcs_results_path }}
        FILTER_DIR: ${{ steps.prepare-test-filters.outputs.filter_dir }}
      run: |
        set -uxe
        shopt -s globstar nullglob

        test_output="${GITHUB_WORKSPACE}/results"
        echo "test_output=${test_output}" >> "${GITHUB_ENV}"

        # Test results (xml and logs) must be in a subfolder in results_dir.
        # to be picked up by the test result processor.
        mkdir -p "${test_output}/${PLATFORM}"
        gsutil -m cp -r "${GCS_RESULTS_PATH%/}/*" "${test_output}/${PLATFORM}/" || true

        # Check for missing result xml files.
        target_failed=0
        readarray -t test_target_entries < <(echo "${TEST_TARGETS_JSON:-[]}" | jq -rc '.[] | if type == "object" then {target: .target, shards: (.shards // 1)} else {target: ., shards: 1} end')
        for entry in "${test_target_entries[@]}"; do
          test_target_with_path=$(echo "${entry}" | jq -r '.target')
          shards=$(echo "${entry}" | jq -r '.shards')
          if ! [[ "${shards}" =~ ^[0-9]+$ ]] || (( shards < 1 || shards > 10 )); then
            echo "::error::Invalid shards value (${shards}) for ${test_target_with_path}; expected integer in 1..10."
            target_failed=1
            continue
          fi
          test_target=${test_target_with_path#*:}
          test_filter=$(python3 cobalt/devinfra/github/test_filter.py \
              --filter-dir "${FILTER_DIR}" \
              --target "${test_target}")
          if [ "${test_filter}" == "-*" ]; then
            # Target was skipped.
            continue
          fi

          if [[ "${shards}" -gt 1 ]]; then
            for (( shard_idx=0; shard_idx<shards; shard_idx++ )); do
              shard_filter=$(python3 cobalt/devinfra/github/test_filter.py \
                  --filter-dir "${FILTER_DIR}" \
                  --target "${test_target}" \
                  --shard "${shard_idx}")
              shard_dir="${test_output}/${PLATFORM}/shard_${shard_idx}"
              if [ "${shard_filter}" == "-*" ]; then
                # On the initial attempt, emit a zero-test XML so result
                # processing sees the expected shard count. On retry attempts,
                # leave skipped shards untouched so download_test_results
                # preserves the passing XML from the earlier attempt.
                if [[ "${GITHUB_RUN_ATTEMPT:-1}" -eq 1 ]]; then
                  mkdir -p "${shard_dir}"
                  echo "Skipped due to test filter." > "${shard_dir}/${test_target}_log.txt"
                  printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuites tests="0" failures="0" errors="0" time="0"></testsuites>\n' \
                    > "${shard_dir}/${test_target}_testoutput.xml"
                fi
                continue
              fi

              xml_files=("${shard_dir}/${test_target}"*.xml)
              if [[ "${#xml_files[@]}" -eq 0 ]]; then
                echo "Test result xml is missing for ${test_target} shard ${shard_idx}."
                log_path="${shard_dir}/${test_target}_log.txt"
                if [ -f "${log_path}" ]; then
                  python3 "${GITHUB_WORKSPACE}/.github/scripts/generate_crash_report.py" \
                    "${log_path}" \
                    "${shard_dir}/${test_target}_testoutput.xml"
                fi
                target_failed=1
              elif grep -q -e '<failure' -e '<error' "${xml_files[@]}"; then
                # Double-check the result XML for failures. ODT service has been known to report incorrect status.
                echo "::error::Found failures in the test xml for ${test_target} shard ${shard_idx}."
                target_failed=1
              elif ! grep -q '<testcase' "${xml_files[@]}"; then
                # A non-skipped shard that ran zero test cases (for example when
                # device setup or test listing failed before execution) must not
                # archive an empty XML that marks the shard as passed on retry.
                echo "::error::Test result xml has no test cases for ${test_target} shard ${shard_idx}."
                rm -f "${xml_files[@]}"
                log_path="${shard_dir}/${test_target}_log.txt"
                if [ -f "${log_path}" ]; then
                  python3 "${GITHUB_WORKSPACE}/.github/scripts/generate_crash_report.py" \
                    "${log_path}" \
                    "${shard_dir}/${test_target}_testoutput.xml"
                fi
                target_failed=1
              fi
            done
          else
            xml_files=("${test_output}/${PLATFORM}"/**/"${test_target}"*.xml)
            if [[ "${#xml_files[@]}" -eq 0 ]]; then
              # Target was NOT skipped, but XML is missing -> Crash.
              echo "Test result xml is missing for ${test_target}."
              log_paths=("${test_output}/${PLATFORM}"/**/"${test_target}"_log.txt)
              if [ -f "${log_paths[0]:-}" ]; then
                python3 "${GITHUB_WORKSPACE}/.github/scripts/generate_crash_report.py" "${log_paths[0]}" "${test_output}/${PLATFORM}/${test_target}_testoutput.xml"
              fi
              target_failed=1
            elif grep -q -e '<failure' -e '<error' "${xml_files[@]}"; then
              # Double-check the result XML for failures. ODT service has been known to report incorrect status.
              echo "::error::Found failures in the test xml."
              target_failed=1
            elif [[ "${test_target}" == *"cobalt_browsertests"* ]] && ! grep -q '<testcase' "${xml_files[@]}"; then
              echo "::error::Test result xml has no test cases for ${test_target}."
              rm -f "${xml_files[@]}"
              log_paths=("${test_output}/${PLATFORM}"/**/"${test_target}"_log.txt)
              if [ -f "${log_paths[0]:-}" ]; then
                python3 "${GITHUB_WORKSPACE}/.github/scripts/generate_crash_report.py" "${log_paths[0]}" "${test_output}/${PLATFORM}/${test_target}_testoutput.xml"
              fi
              target_failed=1
            fi
          fi
        done
        exit ${target_failed}
      shell: bash
    - name: Archive Test Results
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: ${{ inputs.test_results_key }}_${{ github.run_attempt }}
        path: ${{ env.test_output }}/*
