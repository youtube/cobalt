# Disable dangerous-triggers rule because this workflow uses pull_request_target
# strictly to edit PR labels (pull-requests: write) without checking out or executing
# untrusted code from PR branches.
# actionlint: disable dangerous-triggers
name: Auto Label Kokoro

run-name: Auto Label Kokoro (#${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }})

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main
      - staging
      - autoroll-chromium/main-to-staging
      - experimental/*
      - feature/*
      - 'stack/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      should_analyze: ${{ steps.precheck.outputs.should_analyze }}
      changed_files: ${{ steps.precheck.outputs.changed_files }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts

      - name: Precheck PR eligibility and fast-path files
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 .github/scripts/check_tvos_impact.py precheck

  analyze-tvos-impact:
    needs: precheck
    if: needs.precheck.outputs.should_analyze == 'true'
    runs-on: [self-hosted, chrobalt-linux-runner]
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 20
    container:
      image: ghcr.io/youtube/cobalt/linux:main
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /runner-cache:/runner-cache
    env:
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            cobalt/build

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Prepare OverlayFS Workspace
        uses: ./.github/actions/overlay_workspace
        with:
          path: cobalt
          use_gcloud: true

      - name: Checkout
        uses: ./.github/actions/checkout
        with:
          path: cobalt/src
          ref: ${{ github.sha }}
          fetch_depth: 1
          use_cache: true

      - name: Run GN Analyze and Update Label
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ needs.precheck.outputs.changed_files }}
          TEST_TARGETS: ${{ steps.parse-targets.outputs.test_targets_json }}
        run: |
          export PATH="/runner-cache/golden-workspace/depot_tools:${GITHUB_WORKSPACE}/cobalt/depot_tools:${PATH}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/check_tvos_impact.py" \
            --src-dir "${GITHUB_WORKSPACE}/cobalt/src" \
            --files-json "${CHANGED_FILES}" \
            --test-targets-json "${TEST_TARGETS}" \
            --compile-targets "//cobalt:cobalt" \
            --update-label
