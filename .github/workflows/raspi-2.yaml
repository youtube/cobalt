# Registration stub on main so GitHub Actions exposes workflow_dispatch for
# release branches (e.g., 25.lts.1+..19.lts.1+, rc_11, COBALT_9).
name: raspi-2

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly workflow.'
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  stub:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "raspi-2 workflow is only active on release branches."
