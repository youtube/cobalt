<html>
  <head>
    <script>
      // The video plays natively behind this page (see the
      // NativeVideoSplashScreen feature), which shows it through a video hole.
      if (new URLSearchParams(window.location.search).get('native_video') ===
          'true') {
        document.documentElement.classList.add('native-video');
      }

      // DO NOT SUBMIT: benchmark only (SplashWasmPolicy). The splash screen's
      // asset comes from a WebAssembly policy, splash_policy.wasm, which
      // chooses it from the list of the built-in assets and the ones that the
      // WebApp cached (splash_assets.json, which Shell starts listing when the
      // splash screen starts). Both start loading here, as the page loads.
      const wasmPolicy =
          new URLSearchParams(window.location.search).get('wasm_policy') ===
          'true';
      const fetchOk = response => {
        if (!response.ok) {
          throw new Error(`Failed to fetch ${response.url}`);
        }
        return response;
      };
      const wasmPolicyModule = wasmPolicy ?
          fetch('h5vcc-embedded://splash_policy.wasm')
              .then(fetchOk)
              .then(response => response.arrayBuffer())
              .then(bytes => WebAssembly.compile(bytes)) :
          null;
      const splashAssetList = wasmPolicy ?
          fetch('h5vcc-embedded://splash_assets.json')
              .then(fetchOk)
              .then(response => response.json()) :
          null;

      /** Describes `asset` of the splash asset list, as Shell reads it. */
      const describeSplashAsset = asset => asset.source === 'cache' ?
          `cache:${asset.cache}/${asset.name}` : `builtin:${asset.name}`;

      /**
       * Runs the WebAssembly policy for `params`, the splash screen's query
       * params, and returns the asset of the splash asset list that it chose,
       * or null.
       */
      async function chooseSplashAsset(params) {
        const startMs = performance.now();
        const [module, assets] =
            await Promise.all([wasmPolicyModule, splashAssetList]);
        const listedMs = performance.now();
        const instance = await WebAssembly.instantiate(module);
        const {memory, items_buffer, max_items, choose} = instance.exports;
        // The native video's player checks what the platform plays itself, on
        // its own thread, as without the policy, so the page doesn't ask: the
        // first query enumerates the platform's codecs, which can block the
        // page for most of a second, before Shell gets the choice. The HTML
        // video asks anyway, before the policy runs.
        const native =
            document.documentElement.classList.contains('native-video');
        const vp9 =
            native || MediaSource.isTypeSupported('video/webm; codecs="vp9";');
        const vp9_4k = native || MediaSource.isTypeSupported(
            'video/webm; codecs="vp9"; width=3840; height=2160;');
        const items = assets.slice(0, max_items());
        const view =
            new DataView(memory.buffer, items_buffer(), items.length * 12);
        items.forEach((asset, i) => {
          const video = asset.kind === 'video';
          // As splash.html and the native video without the policy: the
          // built-in 1080p video needs 4K VP9, the other videos VP9.
          const playable = !video ||
              (asset.source === 'builtin' && asset.height >= 1080 ? vp9_4k :
                                                                    vp9);
          view.setUint8(i * 12, asset.source === 'cache' ? 1 : 0);
          view.setUint8(i * 12 + 1, video ? 1 : 0);
          view.setUint8(i * 12 + 2, asset.topic === 'music' ? 1 : 0);
          view.setUint8(i * 12 + 3, playable ? 1 : 0);
          view.setUint16(i * 12 + 4, asset.width, true);
          view.setUint16(i * 12 + 6, asset.height, true);
          view.setUint32(i * 12 + 8, asset.bytes, true);
        });
        const index = choose(
            items.length,
            (vp9 ? 1 : 0) | (params.get('force_image') === 'true' ? 4 : 0),
            params.get('cache') === 'music' ? 1 : 0);
        const asset = index >= 0 ? items[index] : null;
        console.log(`SplashWasmPolicy: chose ` +
                    `${asset ? describeSplashAsset(asset) : 'nothing'} from ` +
                    `${items.length} assets in ` +
                    `${Math.round(performance.now() - startMs)}ms (listed ` +
                    `after ${Math.round(listedMs - startMs)}ms), at ` +
                    `${Math.round(performance.now())}ms`);
        return asset;
      }

      if (wasmPolicy &&
          document.documentElement.classList.contains('native-video')) {
        // Shell waits for the policy's choice to play it: see
        // Shell::OnSplashScreenTitleSet().
        chooseSplashAsset(new URLSearchParams(window.location.search))
            .then(asset => asset ? describeSplashAsset(asset) : '', error => {
              console.error('SplashWasmPolicy failed:', error);
              return '';
            })
            .then(choice => {
              document.title = 'cobalt-splash-src:' + choice;
            });
      }
    </script>
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
      }
      .native-video .video {
        position: fixed;
        top: 0;
        left: 0;
        /* The hole covers the whole window, where the native video fits
           whatever its aspect ratio. */
        object-fit: fill;
      }
      .native-video .placeholder {
        display: none;
      }
      video {
        height: 100%;
        width: 100%;
      }
      .placeholder {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <video class="video" id="video" muted disableRemotePlayback></video>
    <div class="placeholder" id="placeholder"></div>
  </body>
  <footer>
    <script>
      function objectUrlFromSafeSource(source) {
        return URL.createObjectURL(source);
      }

      const maybeDestroyVideoInstance = () => {};
      const getPlaceholderEl = () => document.getElementById('placeholder');
      const getVideoEl = () => document.getElementById('video');

      function animate(onAnimationEnd) {
        const videoEl = getVideoEl();
        if (!videoEl) {
          return;
        }

        // When the video starts playing: the timeout of a video counts from
        // there, as in Shell.
        let videoStartMs = 0;
        videoEl.addEventListener('playing', () => {
          videoStartMs = performance.now();
        }, {once: true});

        const onSplashEnd = () => {
          onAnimationEnd && onAnimationEnd();
          // Stay until the timeout, if specified.
          const timeoutMs = Number(
              new URLSearchParams(window.location.search).get('timeout')) || 0;
          const loadEndMs =
              performance.getEntriesByType('navigation')[0]?.loadEventEnd || 0;
          const startMs = videoStartMs || loadEndMs;
          const remainingMs =
              Math.max(0, timeoutMs - (performance.now() - startMs));
          if (remainingMs > 0) {
            setTimeout(() => window.close(), remainingMs);
          } else {
            window.close();
          }
        }

        videoEl.addEventListener('ended', () => {
          maybeDestroyVideoInstance();
          onSplashEnd();
        });

        const showPlaceholderImage = () => {
          const placeholderEl = getPlaceholderEl && getPlaceholderEl();
          if (placeholderEl) {
            placeholderEl.style.opacity = '100%';
          }
        };
        playSplashAnimation(/*afterVideoStart=*/ showPlaceholderImage, /*afterImageLoad=*/ onSplashEnd);
      }

      /**
       * Displays static splash screen for devices that don't support VP9
       * @param urlParams URL parameters containing cache configuration
       */
      function handleStaticImageFallback(urlParams, splashTopic, afterImageLoad) {
        const placeholderEl = getPlaceholderEl();
        if (!placeholderEl) {
          return;
        }
        urlParams.append('fallback', `${splashTopic}splash.png`);
        fetch('h5vcc-embedded://splash.png?' + urlParams.toString())
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.blob();
        })
        .then(imageBlob => {
          const imageUrl = URL.createObjectURL(imageBlob);
          const image = new Image();
          image.onload = () => {
            const scale = (window.innerWidth > 0 && window.innerHeight > 0)
                ? Math.max(window.innerWidth / 1920, window.innerHeight / 1080)
                : 1;
            const width = image.naturalWidth * scale;
            const height = image.naturalHeight * scale;
            placeholderEl.style.backgroundSize = `${width}px ${height}px`;
            placeholderEl.style.backgroundImage = `url(${imageUrl})`;
            placeholderEl.style.opacity = '100%';
          };
          image.src = imageUrl;
          // set timeout to align with timeout for splash video
          setTimeout(() => {
            afterImageLoad && afterImageLoad();
          }, 1000);
        })
        .catch(error => {
          console.error('Failed to fetch splash image:', error);
        });
        return;
      }

      /**
       * DO NOT SUBMIT: benchmark only (SplashWasmPolicy). Returns the URL of
       * the video that the WebAssembly policy chose from the splash asset
       * list, or of splash.html's own choice if the policy fails.
       */
      async function splashVideoUrlFromWasmPolicy(urlParams, splashTopic) {
        const splashFormat = (MediaSource.isTypeSupported("video/webm; codecs=\"vp9\"; width=3840; height=2160;")) ? '' : '_480';
        urlParams.set('fallback', `${splashTopic}splash${splashFormat}.webm`);
        try {
          const asset = await chooseSplashAsset(urlParams);
          if (asset?.source === 'builtin') {
            // Already known not to be cached: served without reading the
            // cache.
            return `h5vcc-embedded://${asset.name}?source=builtin`;
          }
          // The loader reads the cache entry named by the request's host,
          // falling back to the built-in video as without the policy.
          if (asset?.source === 'cache' && asset.name === 'splash.webm') {
            urlParams.set('cache', asset.cache);
            return 'h5vcc-embedded://splash.webm?' + urlParams.toString();
          }
          console.error('SplashWasmPolicy: unexpected choice ' +
                        JSON.stringify(asset));
        } catch (error) {
          console.error('SplashWasmPolicy failed:', error);
        }
        return 'h5vcc-embedded://splash.webm?' + urlParams.toString();
      }

      /**
       * Plays the splash video based on resolution the device support
       * @param urlParams URL parameters containing cache and fallback configuration
       */
      function handleVideo(urlParams, splashTopic, afterVideoStart) {
        const videoEl = getVideoEl();
        if (!videoEl) {
          return;
        }
        const mediaSource = new MediaSource();
        mediaSource.addEventListener('sourceopen', async () => {
          const sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp9"');
          let url;
          if (wasmPolicy) {
            // DO NOT SUBMIT: benchmark only (SplashWasmPolicy).
            url = await splashVideoUrlFromWasmPolicy(urlParams, splashTopic);
          } else {
            const splashFormat = (MediaSource.isTypeSupported("video/webm; codecs=\"vp9\"; width=3840; height=2160;")) ? '' : '_480';
            urlParams.append('fallback', `${splashTopic}splash${splashFormat}.webm`);
            url = 'h5vcc-embedded://splash.webm?' + urlParams.toString();
          }
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error('Network response was not ok');
            }
            const data = await response.arrayBuffer();
            sourceBuffer.addEventListener('updateend', () => {
              if (!sourceBuffer.updating && mediaSource.readyState === 'open') {
                mediaSource.endOfStream();
                videoEl.play();
                afterVideoStart && afterVideoStart();
              }
            }, {once: true});
            sourceBuffer.appendBuffer(data);
          } catch (error) {
            console.error('Failed to fetch splash video:', error);
          }
        }, {once: true});
        videoEl.src = objectUrlFromSafeSource(mediaSource).toString();
      }

      /**
       * Plays the splash animation depending on device type.
       * @param afterVideoStart Callback function when the video starts playing.
       * @param afterImageLoad Callback function for static image.
       */
      function playSplashAnimation(afterVideoStart, afterImageLoad) {
        const params = new URLSearchParams(window.location.search);
        const forceImage = params.get('force_image');
        // The default splash video is splash.webm. If it does not exist in
        // the given cache, "fallback" parameter specifies which built-in video
        // to use.
        if (!params.has('cache')) {
          params.append('cache', 'default');
        }
        const topicName = params.get('cache');
        // Only topic=music using music_splash{_480}.{webm/png}. All others
        // are default splash screen.
        const splashTopic = (topicName === 'music') ? 'music_' : '';

        // Shell asks Starboard the same (kSplashVideoType), so both agree on
        // whether the video plays.
        if (forceImage === 'true' || !MediaSource.isTypeSupported("video/webm; codecs=\"vp9\";")) {
          return handleStaticImageFallback(params, splashTopic, afterImageLoad);
        }

        return handleVideo(params, splashTopic, afterVideoStart);
      }

      if (document.documentElement.classList.contains('native-video')) {
        // Shows the native video through the hole of a VideoHoleWebMediaPlayer.
        getVideoEl().src =
            URL.createObjectURL(new Blob()) + '#cobalt-video-hole';
      } else {
        animate(() => console.log('splash animation completed!'));
      }
    </script>
  </footer>
</html>
