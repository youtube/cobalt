name: tvos

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - 'stack/**'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly workflow.'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  get-sha:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.set-sha.outputs.sha }}
    steps:
      - id: set-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "sha=${PR_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${PUSH_SHA}" >> "${GITHUB_OUTPUT}"
          fi

  get-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.short-targets.outputs.targets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/actions/test_targets_json
            cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json
          sparse-checkout-cone-mode: false

      - name: Parse Test Targets JSON
        id: parse-targets
        uses: ./.github/actions/test_targets_json
        with:
          test_targets_json_file: cobalt/build/testing/targets/tvos-arm64-simulator/test_targets.json

      - name: Convert Targets to Short Names
        id: short-targets
        env:
          TEST_TARGETS_JSON: ${{ steps.parse-targets.outputs.test_targets_json }}
        run: |
          targets=$(echo "${TEST_TARGETS_JSON}" | jq -cr 'map(split(":")[-1])')
          echo "Targets found: ${targets}"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  wait-for-kokoro-build:
    needs: get-sha
    runs-on: ubuntu-latest
    timeout-minutes: 150 # 2.5 hours timeout to ensure we don't block forever but allow 2h polling
    outputs:
      invocation_id: ${{ steps.poll-status.outputs.invocation_id }}
      skipped: ${{ steps.check-skip.outputs.skipped }}
    steps:
      - name: Check if tvOS build should be skipped
        id: check-skip
        if: github.event_name == 'pull_request'
        env:
          COMMIT_SHA: ${{ needs.get-sha.outputs.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "PR #${PR_NUMBER} is a draft. Skipping tvOS build."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A Kokoro build counts as requested if the PR has a Kokoro trigger
          # label, or if Kokoro already reported a status for this commit.
          # Kokoro removes the label right after it starts the build, but it
          # posts its pending status before that, so one of them is always
          # visible. The combined status endpoint returns the latest status per
          # context, unlike /statuses, which pages through every status posted
          # on the commit (often hundreds, from CI).
          kokoro_requested() {
            local has_label has_status
            has_label=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json labels \
              --jq 'any(.labels[]; .name == "kokoro:run" or .name == "kokoro:force-run")' || echo "false")
            [[ "${has_label}" == "true" ]] && return 0
            has_status=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/status?per_page=100" \
              --jq 'any(.statuses[]; .context == "kokoro")' || echo "false")
            [[ "${has_status}" == "true" ]]
          }

          # Waits for the Auto Label Kokoro run of this commit and event action,
          # matched by its run-name. Matching the action too avoids picking up an
          # older run of the same commit (e.g., the draft run before
          # ready_for_review).
          run_key="@ ${COMMIT_SHA} (${EVENT_ACTION}))"
          run_json=""
          for _ in {1..120}; do
            run_json=$(gh api "repos/${REPO}/actions/workflows/auto_label_kokoro.yaml/runs?event=pull_request_target&per_page=100" \
              --jq "[.workflow_runs[] | select((.display_title // \"\") | endswith(\"${run_key}\"))][0] // empty" || true)
            if [[ -n "${run_json}" && "$(jq -r '.status' <<< "${run_json}")" == "completed" ]]; then
              break
            fi
            run_json=""
            sleep 10
          done

          if kokoro_requested; then
            echo "Kokoro build requested for PR #${PR_NUMBER}. Waiting for it."
            exit 0
          fi

          if [[ -z "${run_json}" ]]; then
            echo "::error::Timed out waiting for the Auto Label Kokoro run '${run_key}', and no Kokoro build was requested. Failing instead of skipping; apply the kokoro:run label to run the tvOS build."
            exit 1
          fi

          conclusion=$(jq -r '.conclusion' <<< "${run_json}")
          run_url=$(jq -r '.html_url' <<< "${run_json}")
          if [[ "${conclusion}" == "success" ]]; then
            echo "Auto Label Kokoro (${run_url}) didn't request a Kokoro build: the PR doesn't affect tvOS, or its author isn't a committer. Skipping tvOS build."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          head_sha=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' || true)
          if [[ "${conclusion}" == "cancelled" && -n "${head_sha}" && "${head_sha}" != "${COMMIT_SHA}" ]]; then
            echo "Auto Label Kokoro (${run_url}) was cancelled, and PR #${PR_NUMBER} has moved on to ${head_sha}. Skipping tvOS build for the outdated commit ${COMMIT_SHA}."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::Auto Label Kokoro (${run_url}) ended with '${conclusion}', and no Kokoro build was requested. Failing instead of skipping; apply the kokoro:run label to run the tvOS build."
          exit 1

      - name: Poll GitHub Statuses API for Kokoro build
        id: poll-status
        if: steps.check-skip.outputs.skipped != 'true'
        env:
          COMMIT_SHA: ${{ needs.get-sha.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Polling GitHub Statuses API for Kokoro status on commit ${COMMIT_SHA}..."
          for i in {1..240}; do # Poll for 2 hours (240 * 30s)
            echo "Attempt ${i}/240..."
            # The combined status has the latest status per context. /statuses
            # lists every status on the commit, so Kokoro's can be past page 1.
            statuses=$(gh api "repos/youtube/cobalt/commits/${COMMIT_SHA}/status?per_page=100" --jq '.statuses')

            echo "--- Current Statuses ---"
            echo "${statuses}" | jq -r '.[] | "\(.context): \(.state) (\(.description))"'
            echo "----------------------"

            # Select the latest kokoro status
            target_status=$(echo "${statuses}" | jq -c '[.[] | select(.context == "kokoro")][0]')

            if [[ -n "${target_status}" && "${target_status}" != "null" ]]; then
              state=$(echo "${target_status}" | jq -r '.state')
              description=$(echo "${target_status}" | jq -r '.description')
              target_url=$(echo "${target_status}" | jq -r '.target_url')
              invocation_id="${target_url##*/}"

              echo "Found target status: kokoro"
              echo "State: ${state} | Description: ${description}"
              echo "Kokoro Invocation ID: ${invocation_id}"
              echo "Kokoro ResultStore URL: ${target_url}"

              if [[ "${state}" == "success" ]]; then
                echo "Kokoro build succeeded!"
                echo "invocation_id=${invocation_id}" >> "${GITHUB_OUTPUT}"
                exit 0
              elif [[ "${state}" == "failure" || "${state}" == "error" ]]; then
                echo "Kokoro build failed with state: ${state}"
                exit 1
              fi
              # If state is "pending", we continue waiting
            else
              echo "Kokoro status not found yet."
            fi

            echo "Waiting 30 seconds..."
            sleep 30
          done
          echo "Timeout waiting for Kokoro build."
          exit 1

  download-artifacts:
    needs: [get-sha, wait-for-kokoro-build, get-targets]
    if: needs.wait-for-kokoro-build.outputs.skipped != 'true'
    runs-on: [self-hosted, odt-runner]
    container:
      image: ghcr.io/youtube/cobalt/linux:main
    steps:
      - name: Download Artifacts from GCS
        env:
          INVOCATION_ID: ${{ needs.wait-for-kokoro-build.outputs.invocation_id }}
          TARGETS: ${{ needs.get-targets.outputs.targets }}
        run: |
          BUCKET="cobalt-unittest-storage"
          PLATFORM="tvos-arm64-simulator"
          CONFIG="devel"
          for target in $(python3 -c "import json, os; print(' '.join(json.loads(os.environ['TARGETS'])))"); do
            echo "Downloading ${target}.tar.gz..."
            gcloud storage cp "gs://${BUCKET}/kokoro/build/${PLATFORM}_${CONFIG}/${INVOCATION_ID}/${target}.tar.gz" .
          done

      - name: Upload to GitHub Actions
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: tvos-test-artifacts
          path: "*.tar.gz"
          retention-days: 1

  # TODO(b/519669027): Refactor below steps to reuse the logic from main.yaml.
  run-tests:
    name: tvos_${{ matrix.target }}
    needs: [get-targets, wait-for-kokoro-build, download-artifacts]
    if: needs.wait-for-kokoro-build.outputs.skipped != 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.get-targets.outputs.targets) }}
    steps:
      - name: Checkout Cobalt (Sparse)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            cobalt/testing/filters
            .github
            cobalt/tools

      - name: Download from GitHub Actions
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: tvos-test-artifacts

      - name: Filter
        id: filter
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test_filter=""
          filter_file="cobalt/testing/filters/tvos-arm64-simulator/${TARGET}_filter.json"
          if [[ -f "${filter_file}" ]]; then
            test_filter="$(jq -cr '.failing_tests[0]' "${filter_file}")"
            if [[ "${test_filter}" == '*' ]]; then
              echo "${TARGET} was skipped due to test filter."
              echo "skipped=true" >> "${GITHUB_OUTPUT}"
            else
              echo "skipped=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "skipped=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Run Test in Simulator
        id: run-tests
        if: steps.filter.outputs.skipped != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -xzf "${TARGET}.tar.gz"

          mkdir -p results

          filter_file="cobalt/testing/filters/tvos-arm64-simulator/${TARGET}_filter.json"
          gtest_args=()
          if [[ -f "${filter_file}" ]]; then
            echo "Found filter file: ${filter_file}"
            failing_tests=$(jq -r '.failing_tests | join(":")' "${filter_file}")
            if [[ -n "${failing_tests}" ]]; then
              gtest_args+=(-c "--gtest_filter=-${failing_tests}")
              echo "Applying gtest_filter: -${failing_tests}"
            fi
          fi

          xml_path="${GITHUB_WORKSPACE}/results/${TARGET}_result.xml"
          log_path="${GITHUB_WORKSPACE}/results/${TARGET}_log.txt"

          gtest_args+=(-c "--gtest_output=xml:${xml_path}")

          ./iossim \
            -x tvos \
            -d "Apple TV 4K (3rd generation)" \
            -v \
            -i \
            "${gtest_args[@]}" \
            "./${TARGET}.app" 2>&1 | tee "${log_path}" || true

          if [[ ! -f "${xml_path}" ]]; then
            echo "XML result not found. Generating crash report."
            python3 .github/scripts/generate_crash_report.py "${log_path}" "${xml_path}"
          fi

      - name: Test Results
        if: always() && steps.filter.outputs.skipped != 'true'
        uses: ./.github/actions/process_test_results
        with:
          target_name: ${{ matrix.target }}
          results_glob: results/${{ matrix.target }}_result.xml
          log_glob: results/${{ matrix.target }}_log.txt
          num_gtest_shards: 1
          datadog_api_key: ""

      - name: Archive Test Results
        if: always() && steps.filter.outputs.skipped != 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: tvos_${{ matrix.target }}_test_results
          path: results/*

  validate-test-result:
    needs: [wait-for-kokoro-build, run-tests]
    if: always() && !cancelled() && needs.wait-for-kokoro-build.result == 'success'
    runs-on: ubuntu-latest
    name: tvos_tests_passing
    steps:
      - name: Check test results
        env:
          GATE_SKIPPED: ${{ needs.wait-for-kokoro-build.outputs.skipped }}
          RUN_TESTS_RESULT: ${{ needs.run-tests.result }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -n \
            --arg platform "tvos" \
            --argjson needs "${NEEDS_JSON}" \
            '{
              platform: $platform,
              checks: ($needs | map_values(.result)),
              test_failures: {}
            }' > shepherd_report.json

          # Only an intentional skip by the gate in wait-for-kokoro-build counts
          # as passing. run-tests is also skipped when download-artifacts fails,
          # which must fail.
          if [[ "${GATE_SKIPPED}" == "true" ]]; then
            echo "tvOS build wasn't requested for this PR. Skipping tvOS tests."
            exit 0
          elif [[ "${RUN_TESTS_RESULT}" == "success" ]]; then
            echo "All tvOS tests passed successfully!"
            exit 0
          else
            echo "tvOS test job failed with result: ${RUN_TESTS_RESULT}"
            exit 1
          fi
      - name: Upload Shepherd Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: shepherd-report-tvos
          path: shepherd_report.json
          retention-days: 30
          overwrite: true
